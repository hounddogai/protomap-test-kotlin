syntax = "proto3";

package acme.deliveries.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/deliveries/v1/deliveries.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "ProofOfDeliveryValidationServiceProto";
option java_package = "com.acme.deliveries.v1";

// Checks proof of deliveries against the rules before anything acts on them.
service ProofOfDeliveryValidationService {
  // Validates a proof of delivery.
  rpc ValidateProofOfDelivery(ValidateProofOfDeliveryRequest) returns (ValidateProofOfDeliveryResponse);

  // Previews a proof of delivery.
  rpc PreviewProofOfDelivery(PreviewProofOfDeliveryRequest) returns (PreviewProofOfDeliveryResponse);

  // Checks a proof of delivery.
  rpc CheckProofOfDeliveryEligibility(CheckProofOfDeliveryEligibilityRequest) returns (CheckProofOfDeliveryEligibilityResponse);

  // Normalizes a proof of delivery.
  rpc NormalizeProofOfDelivery(NormalizeProofOfDeliveryRequest) returns (NormalizeProofOfDeliveryResponse);

  // Explains a proof of delivery.
  rpc ExplainProofOfDeliveryDecision(ExplainProofOfDeliveryDecisionRequest) returns (ExplainProofOfDeliveryDecisionResponse);

  // Scores a proof of delivery.
  rpc ScoreProofOfDelivery(ScoreProofOfDeliveryRequest) returns (ScoreProofOfDeliveryResponse);

  // Lints a proof of delivery.
  rpc LintProofOfDeliveries(LintProofOfDeliveriesRequest) returns (LintProofOfDeliveriesResponse);
}

// The request of `ValidateProofOfDelivery`.
message ValidateProofOfDeliveryRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string proof_of_delivery_id = 2;
  ProofOfDelivery proof_of_delivery = 3;
  ValidateProofOfDeliveryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateProofOfDelivery`.
message ValidateProofOfDeliveryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ProofOfDelivery proof_of_delivery = 1;
  ValidateProofOfDeliveryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

