syntax = "proto3";

package acme.deliveries.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/deliveries/v1/deliveries.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "ProofOfDeliveryCalculationServiceProto";
option java_package = "com.acme.deliveries.v1";

// Computes the figures of a proof of delivery, such as totals, taxes, and estimates.
service ProofOfDeliveryCalculationService {
  // Calculates a proof of delivery.
  rpc CalculateProofOfDelivery(CalculateProofOfDeliveryRequest) returns (CalculateProofOfDeliveryResponse);

  // Estimates a proof of delivery.
  rpc EstimateProofOfDelivery(EstimateProofOfDeliveryRequest) returns (EstimateProofOfDeliveryResponse);

  // Quotes a proof of delivery.
  rpc QuoteProofOfDelivery(QuoteProofOfDeliveryRequest) returns (QuoteProofOfDeliveryResponse);

  // Compares a proof of delivery.
  rpc CompareProofOfDeliveryOptions(CompareProofOfDeliveryOptionsRequest) returns (CompareProofOfDeliveryOptionsResponse);

  // Recalculates a proof of delivery.
  rpc RecalculateProofOfDeliveries(RecalculateProofOfDeliveriesRequest) returns (RecalculateProofOfDeliveriesResponse);

  // Simulates a proof of delivery.
  rpc SimulateProofOfDelivery(SimulateProofOfDeliveryRequest) returns (SimulateProofOfDeliveryResponse);

  // Explains a proof of delivery.
  rpc ExplainProofOfDeliveryCalculation(ExplainProofOfDeliveryCalculationRequest) returns (ExplainProofOfDeliveryCalculationResponse);

  // Returns a proof of delivery.
  rpc GetProofOfDeliveryRates(GetProofOfDeliveryRatesRequest) returns (GetProofOfDeliveryRatesResponse);
}

// The request of `CalculateProofOfDelivery`.
message CalculateProofOfDeliveryRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string proof_of_delivery_id = 2;
  ProofOfDelivery proof_of_delivery = 3;
  CalculateProofOfDeliveryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateProofOfDelivery`.
message CalculateProofOfDeliveryResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateProofOfDeliveryResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ProofOfDelivery proof_of_delivery = 1;
  CalculateProofOfDeliveryResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

