syntax = "proto3";

package acme.deliveries.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/deliveries/v1/deliveries.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryWorkflowServiceProto";
option java_package = "com.acme.deliveries.v1";

// Runs the long-lived workflow that takes a delivery from start to finish.
service DeliveryWorkflowService {
  // Starts a delivery.
  rpc StartDeliveryWorkflow(StartDeliveryWorkflowRequest) returns (StartDeliveryWorkflowResponse);

  // Advances a delivery.
  rpc AdvanceDeliveryWorkflow(AdvanceDeliveryWorkflowRequest) returns (AdvanceDeliveryWorkflowResponse);

  // Cancels a delivery.
  rpc CancelDeliveryWorkflow(CancelDeliveryWorkflowRequest) returns (CancelDeliveryWorkflowResponse);

  // Pauses a delivery.
  rpc PauseDeliveryWorkflow(PauseDeliveryWorkflowRequest) returns (PauseDeliveryWorkflowResponse);

  // Returns a delivery.
  rpc InspectDeliveryWorkflow(InspectDeliveryWorkflowRequest) returns (InspectDeliveryWorkflowResponse);

  // Lists deliveries a page at a time.
  rpc ListDeliveryWorkflows(ListDeliveryWorkflowsRequest) returns (ListDeliveryWorkflowsResponse);

  // Signals a delivery.
  rpc SignalDeliveryWorkflow(SignalDeliveryWorkflowRequest) returns (SignalDeliveryWorkflowResponse);
}

// The request of `StartDeliveryWorkflow`.
message StartDeliveryWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_id = 2;
  Delivery delivery = 3;
  StartDeliveryWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDeliveryWorkflow`.
message StartDeliveryWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Delivery delivery = 1;
  StartDeliveryWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

