option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryExceptionWorkflowServiceProto";
option java_package = "com.acme.deliveries.v1";

// Runs the long-lived workflow that takes a delivery exception from start to finish.
service DeliveryExceptionWorkflowService {
  // Starts a delivery exception.
  rpc StartDeliveryExceptionWorkflow(StartDeliveryExceptionWorkflowRequest) returns (StartDeliveryExceptionWorkflowResponse);

  // Advances a delivery exception.
  rpc AdvanceDeliveryExceptionWorkflow(AdvanceDeliveryExceptionWorkflowRequest) returns (AdvanceDeliveryExceptionWorkflowResponse);

  // Cancels a delivery exception.
  rpc CancelDeliveryExceptionWorkflow(CancelDeliveryExceptionWorkflowRequest) returns (CancelDeliveryExceptionWorkflowResponse);

  // Retrys a delivery exception.
  rpc RetryDeliveryExceptionWorkflow(RetryDeliveryExceptionWorkflowRequest) returns (RetryDeliveryExceptionWorkflowResponse);

  // Pauses a delivery exception.
  rpc PauseDeliveryExceptionWorkflow(PauseDeliveryExceptionWorkflowRequest) returns (PauseDeliveryExceptionWorkflowResponse);

  // Resumes a delivery exception.
  rpc ResumeDeliveryExceptionWorkflow(ResumeDeliveryExceptionWorkflowRequest) returns (ResumeDeliveryExceptionWorkflowResponse);

  // Returns a delivery exception.
  rpc InspectDeliveryExceptionWorkflow(InspectDeliveryExceptionWorkflowRequest) returns (InspectDeliveryExceptionWorkflowResponse);

  // Lists delivery exceptions a page at a time.
  rpc ListDeliveryExceptionWorkflows(ListDeliveryExceptionWorkflowsRequest) returns (ListDeliveryExceptionWorkflowsResponse);

  // Signals a delivery exception.
  rpc SignalDeliveryExceptionWorkflow(SignalDeliveryExceptionWorkflowRequest) returns (SignalDeliveryExceptionWorkflowResponse);
}

// The request of `StartDeliveryExceptionWorkflow`.
message StartDeliveryExceptionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_exception_id = 2;
  DeliveryException delivery_exception = 3;
  StartDeliveryExceptionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDeliveryExceptionWorkflow`.
message StartDeliveryExceptionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryException delivery_exception = 1;
  StartDeliveryExceptionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

