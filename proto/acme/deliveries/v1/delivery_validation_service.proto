syntax = "proto3";

package acme.deliveries.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/deliveries/v1/deliveries.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryValidationServiceProto";
option java_package = "com.acme.deliveries.v1";

// Checks deliveries against the rules before anything acts on them.
service DeliveryValidationService {
  // Validates a delivery.
  rpc ValidateDelivery(ValidateDeliveryRequest) returns (ValidateDeliveryResponse);

  // Previews a delivery.
  rpc PreviewDelivery(PreviewDeliveryRequest) returns (PreviewDeliveryResponse);

  // Checks a delivery.
  rpc CheckDeliveryEligibility(CheckDeliveryEligibilityRequest) returns (CheckDeliveryEligibilityResponse);

  // Normalizes a delivery.
  rpc NormalizeDelivery(NormalizeDeliveryRequest) returns (NormalizeDeliveryResponse);

  // Explains a delivery.
  rpc ExplainDeliveryDecision(ExplainDeliveryDecisionRequest) returns (ExplainDeliveryDecisionResponse);

  // Scores a delivery.
  rpc ScoreDelivery(ScoreDeliveryRequest) returns (ScoreDeliveryResponse);

  // Lints a delivery.
  rpc LintDeliveries(LintDeliveriesRequest) returns (LintDeliveriesResponse);

  // Returns a delivery.
  rpc GetDeliveryRules(GetDeliveryRulesRequest) returns (GetDeliveryRulesResponse);
}

// The request of `ValidateDelivery`.
message ValidateDeliveryRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_id = 2;
  Delivery delivery = 3;
  ValidateDeliveryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDelivery`.
message ValidateDeliveryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Delivery delivery = 1;
  ValidateDeliveryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

