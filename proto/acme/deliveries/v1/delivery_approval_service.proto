syntax = "proto3";

package acme.deliveries.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/deliveries/v1/deliveries.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryApprovalServiceProto";
option java_package = "com.acme.deliveries.v1";

// Routes deliveries through approval, with escalation and delegation.
service DeliveryApprovalService {
  // Submits a delivery.
  rpc SubmitDelivery(SubmitDeliveryRequest) returns (SubmitDeliveryResponse);

  // Approves a delivery.
  rpc ApproveDelivery(ApproveDeliveryRequest) returns (ApproveDeliveryResponse);

  // Rejects a delivery.
  rpc RejectDelivery(RejectDeliveryRequest) returns (RejectDeliveryResponse);

  // Delegates a delivery.
  rpc DelegateDeliveryApproval(DelegateDeliveryApprovalRequest) returns (DelegateDeliveryApprovalResponse);

  // Returns a delivery.
  rpc GetDeliveryApprovalStatus(GetDeliveryApprovalStatusRequest) returns (GetDeliveryApprovalStatusResponse);

  // Comments a delivery.
  rpc CommentDeliveryApproval(CommentDeliveryApprovalRequest) returns (CommentDeliveryApprovalResponse);
}

// The request of `SubmitDelivery`.
message SubmitDeliveryRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_id = 2;
  Delivery delivery = 3;
  SubmitDeliveryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDelivery`.
message SubmitDeliveryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Delivery delivery = 1;
  SubmitDeliveryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveDelivery`.
message ApproveDeliveryRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
