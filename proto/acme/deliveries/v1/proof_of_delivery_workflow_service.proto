syntax = "proto3";

package acme.deliveries.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/deliveries/v1/deliveries.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "ProofOfDeliveryWorkflowServiceProto";
option java_package = "com.acme.deliveries.v1";

// Runs the long-lived workflow that takes a proof of delivery from start to finish.
service ProofOfDeliveryWorkflowService {
  // Starts a proof of delivery.
  rpc StartProofOfDeliveryWorkflow(StartProofOfDeliveryWorkflowRequest) returns (StartProofOfDeliveryWorkflowResponse);

  // Advances a proof of delivery.
  rpc AdvanceProofOfDeliveryWorkflow(AdvanceProofOfDeliveryWorkflowRequest) returns (AdvanceProofOfDeliveryWorkflowResponse);

  // Cancels a proof of delivery.
  rpc CancelProofOfDeliveryWorkflow(CancelProofOfDeliveryWorkflowRequest) returns (CancelProofOfDeliveryWorkflowResponse);

  // Retrys a proof of delivery.
  rpc RetryProofOfDeliveryWorkflow(RetryProofOfDeliveryWorkflowRequest) returns (RetryProofOfDeliveryWorkflowResponse);

  // Pauses a proof of delivery.
  rpc PauseProofOfDeliveryWorkflow(PauseProofOfDeliveryWorkflowRequest) returns (PauseProofOfDeliveryWorkflowResponse);

  // Resumes a proof of delivery.
  rpc ResumeProofOfDeliveryWorkflow(ResumeProofOfDeliveryWorkflowRequest) returns (ResumeProofOfDeliveryWorkflowResponse);

  // Returns a proof of delivery.
  rpc InspectProofOfDeliveryWorkflow(InspectProofOfDeliveryWorkflowRequest) returns (InspectProofOfDeliveryWorkflowResponse);

  // Lists proof of deliveries a page at a time.
  rpc ListProofOfDeliveryWorkflows(ListProofOfDeliveryWorkflowsRequest) returns (ListProofOfDeliveryWorkflowsResponse);

  // Signals a proof of delivery.
  rpc SignalProofOfDeliveryWorkflow(SignalProofOfDeliveryWorkflowRequest) returns (SignalProofOfDeliveryWorkflowResponse);
}

// The request of `StartProofOfDeliveryWorkflow`.
message StartProofOfDeliveryWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string proof_of_delivery_id = 2;
  ProofOfDelivery proof_of_delivery = 3;
  StartProofOfDeliveryWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartProofOfDeliveryWorkflow`.
message StartProofOfDeliveryWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ProofOfDelivery proof_of_delivery = 1;
  StartProofOfDeliveryWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

