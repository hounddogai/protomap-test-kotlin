syntax = "proto3";

package acme.deliveries.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/deliveries/v1/deliveries.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryExceptionValidationServiceProto";
option java_package = "com.acme.deliveries.v1";

// Checks delivery exceptions against the rules before anything acts on them.
service DeliveryExceptionValidationService {
  // Validates a delivery exception.
  rpc ValidateDeliveryException(ValidateDeliveryExceptionRequest) returns (ValidateDeliveryExceptionResponse);

  // Previews a delivery exception.
  rpc PreviewDeliveryException(PreviewDeliveryExceptionRequest) returns (PreviewDeliveryExceptionResponse);

  // Checks a delivery exception.
  rpc CheckDeliveryExceptionEligibility(CheckDeliveryExceptionEligibilityRequest) returns (CheckDeliveryExceptionEligibilityResponse);

  // Normalizes a delivery exception.
  rpc NormalizeDeliveryException(NormalizeDeliveryExceptionRequest) returns (NormalizeDeliveryExceptionResponse);

  // Explains a delivery exception.
  rpc ExplainDeliveryExceptionDecision(ExplainDeliveryExceptionDecisionRequest) returns (ExplainDeliveryExceptionDecisionResponse);

  // Scores a delivery exception.
  rpc ScoreDeliveryException(ScoreDeliveryExceptionRequest) returns (ScoreDeliveryExceptionResponse);

  // Lints a delivery exception.
  rpc LintDeliveryExceptions(LintDeliveryExceptionsRequest) returns (LintDeliveryExceptionsResponse);

  // Returns a delivery exception.
  rpc GetDeliveryExceptionRules(GetDeliveryExceptionRulesRequest) returns (GetDeliveryExceptionRulesResponse);
}

// The request of `ValidateDeliveryException`.
message ValidateDeliveryExceptionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_exception_id = 2;
  DeliveryException delivery_exception = 3;
  ValidateDeliveryExceptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDeliveryException`.
message ValidateDeliveryExceptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryException delivery_exception = 1;
  ValidateDeliveryExceptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

