syntax = "proto3";

package acme.deliveries.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/deliveries/v1/deliveries.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryExceptionCalculationServiceProto";
option java_package = "com.acme.deliveries.v1";

// Computes the figures of a delivery exception, such as totals, taxes, and estimates.
service DeliveryExceptionCalculationService {
  // Calculates a delivery exception.
  rpc CalculateDeliveryException(CalculateDeliveryExceptionRequest) returns (CalculateDeliveryExceptionResponse);

  // Estimates a delivery exception.
  rpc EstimateDeliveryException(EstimateDeliveryExceptionRequest) returns (EstimateDeliveryExceptionResponse);

  // Quotes a delivery exception.
  rpc QuoteDeliveryException(QuoteDeliveryExceptionRequest) returns (QuoteDeliveryExceptionResponse);

  // Compares a delivery exception.
  rpc CompareDeliveryExceptionOptions(CompareDeliveryExceptionOptionsRequest) returns (CompareDeliveryExceptionOptionsResponse);

  // Simulates a delivery exception.
  rpc SimulateDeliveryException(SimulateDeliveryExceptionRequest) returns (SimulateDeliveryExceptionResponse);

  // Returns a delivery exception.
  rpc GetDeliveryExceptionRates(GetDeliveryExceptionRatesRequest) returns (GetDeliveryExceptionRatesResponse);
}

// The request of `CalculateDeliveryException`.
message CalculateDeliveryExceptionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_exception_id = 2;
  DeliveryException delivery_exception = 3;
  CalculateDeliveryExceptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDeliveryException`.
message CalculateDeliveryExceptionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDeliveryExceptionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  DeliveryException delivery_exception = 1;
  CalculateDeliveryExceptionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

