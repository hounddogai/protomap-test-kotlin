syntax = "proto3";

package acme.deliveries.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/deliveries/v1/deliveries.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Deliveries.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/deliveries/v1;deliveriesv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryExceptionApprovalServiceProto";
option java_package = "com.acme.deliveries.v1";

// Routes delivery exceptions through approval, with escalation and delegation.
service DeliveryExceptionApprovalService {
  // Submits a delivery exception.
  rpc SubmitDeliveryException(SubmitDeliveryExceptionRequest) returns (SubmitDeliveryExceptionResponse);

  // Approves a delivery exception.
  rpc ApproveDeliveryException(ApproveDeliveryExceptionRequest) returns (ApproveDeliveryExceptionResponse);

  // Rejects a delivery exception.
  rpc RejectDeliveryException(RejectDeliveryExceptionRequest) returns (RejectDeliveryExceptionResponse);

  // Escalates a delivery exception.
  rpc EscalateDeliveryException(EscalateDeliveryExceptionRequest) returns (EscalateDeliveryExceptionResponse);

  // Recalls a delivery exception.
  rpc RecallDeliveryException(RecallDeliveryExceptionRequest) returns (RecallDeliveryExceptionResponse);

  // Returns a delivery exception.
  rpc GetDeliveryExceptionApprovalStatus(GetDeliveryExceptionApprovalStatusRequest) returns (GetDeliveryExceptionApprovalStatusResponse);
}

// The request of `SubmitDeliveryException`.
message SubmitDeliveryExceptionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_exception_id = 2;
  DeliveryException delivery_exception = 3;
  SubmitDeliveryExceptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDeliveryException`.
message SubmitDeliveryExceptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryException delivery_exception = 1;
  SubmitDeliveryExceptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

