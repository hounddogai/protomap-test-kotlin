syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "PartApprovalServiceProto";
option java_package = "com.acme.maintenance.v1";

// Routes parts through approval, with escalation and delegation.
service PartApprovalService {
  // Submits a part.
  rpc SubmitPart(SubmitPartRequest) returns (SubmitPartResponse);

  // Approves a part.
  rpc ApprovePart(ApprovePartRequest) returns (ApprovePartResponse);

  // Rejects a part.
  rpc RejectPart(RejectPartRequest) returns (RejectPartResponse);

  // Lists parts a page at a time.
  rpc ListPendingParts(ListPendingPartsRequest) returns (ListPendingPartsResponse);

  // Delegates a part.
  rpc DelegatePartApproval(DelegatePartApprovalRequest) returns (DelegatePartApprovalResponse);

  // Recalls a part.
  rpc RecallPart(RecallPartRequest) returns (RecallPartResponse);

  // Returns a part.
  rpc GetPartApprovalStatus(GetPartApprovalStatusRequest) returns (GetPartApprovalStatusResponse);

  // Comments a part.
  rpc CommentPartApproval(CommentPartApprovalRequest) returns (CommentPartApprovalResponse);
}

// The request of `SubmitPart`.
message SubmitPartRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  Part part = 3;
  SubmitPartRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPart`.
message SubmitPartResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Part part = 1;
  SubmitPartResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

