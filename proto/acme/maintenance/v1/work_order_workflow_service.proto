syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "WorkOrderWorkflowServiceProto";
option java_package = "com.acme.maintenance.v1";

// Runs the long-lived workflow that takes a work order from start to finish.
service WorkOrderWorkflowService {
  // Starts a work order.
  rpc StartWorkOrderWorkflow(StartWorkOrderWorkflowRequest) returns (StartWorkOrderWorkflowResponse);

  // Advances a work order.
  rpc AdvanceWorkOrderWorkflow(AdvanceWorkOrderWorkflowRequest) returns (AdvanceWorkOrderWorkflowResponse);

  // Retrys a work order.
  rpc RetryWorkOrderWorkflow(RetryWorkOrderWorkflowRequest) returns (RetryWorkOrderWorkflowResponse);

  // Pauses a work order.
  rpc PauseWorkOrderWorkflow(PauseWorkOrderWorkflowRequest) returns (PauseWorkOrderWorkflowResponse);

  // Resumes a work order.
  rpc ResumeWorkOrderWorkflow(ResumeWorkOrderWorkflowRequest) returns (ResumeWorkOrderWorkflowResponse);

  // Returns a work order.
  rpc InspectWorkOrderWorkflow(InspectWorkOrderWorkflowRequest) returns (InspectWorkOrderWorkflowResponse);

  // Lists work orders a page at a time.
  rpc ListWorkOrderWorkflows(ListWorkOrderWorkflowsRequest) returns (ListWorkOrderWorkflowsResponse);

  // Signals a work order.
  rpc SignalWorkOrderWorkflow(SignalWorkOrderWorkflowRequest) returns (SignalWorkOrderWorkflowResponse);
}

// The request of `StartWorkOrderWorkflow`.
message StartWorkOrderWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string work_order_id = 2;
  WorkOrder work_order = 3;
  StartWorkOrderWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartWorkOrderWorkflow`.
message StartWorkOrderWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WorkOrder work_order = 1;
  StartWorkOrderWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

