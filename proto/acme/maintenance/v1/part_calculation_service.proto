syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "PartCalculationServiceProto";
option java_package = "com.acme.maintenance.v1";

// Computes the figures of a part, such as totals, taxes, and estimates.
service PartCalculationService {
  // Calculates a part.
  rpc CalculatePart(CalculatePartRequest) returns (CalculatePartResponse);

  // Estimates a part.
  rpc EstimatePart(EstimatePartRequest) returns (EstimatePartResponse);

  // Quotes a part.
  rpc QuotePart(QuotePartRequest) returns (QuotePartResponse);

  // Compares a part.
  rpc ComparePartOptions(ComparePartOptionsRequest) returns (ComparePartOptionsResponse);

  // Recalculates a part.
  rpc RecalculateParts(RecalculatePartsRequest) returns (RecalculatePartsResponse);

  // Simulates a part.
  rpc SimulatePart(SimulatePartRequest) returns (SimulatePartResponse);

  // Explains a part.
  rpc ExplainPartCalculation(ExplainPartCalculationRequest) returns (ExplainPartCalculationResponse);

  // Returns a part.
  rpc GetPartRates(GetPartRatesRequest) returns (GetPartRatesResponse);
}

// The request of `CalculatePart`.
message CalculatePartRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  Part part = 3;
  CalculatePartRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePart`.
message CalculatePartResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePartResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Part part = 1;
  CalculatePartResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

