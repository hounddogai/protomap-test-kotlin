syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "ServiceScheduleQueryServiceProto";
option java_package = "com.acme.maintenance.v1";

// Answers read-only questions about service schedules, for screens and reports.
service ServiceScheduleQueryService {
  // Returns a service schedule.
  rpc LookupServiceSchedule(LookupServiceScheduleRequest) returns (LookupServiceScheduleResponse);

  // Lists service schedules a page at a time.
  rpc BrowseServiceSchedules(BrowseServiceSchedulesRequest) returns (BrowseServiceSchedulesResponse);

  // Lists service schedules a page at a time.
  rpc FindServiceSchedules(FindServiceSchedulesRequest) returns (FindServiceSchedulesResponse);

  // Counts service schedules by status.
  rpc CountServiceSchedules(CountServiceSchedulesRequest) returns (CountServiceSchedulesResponse);

  // Returns several service schedules at once.
  rpc ResolveServiceSchedules(ResolveServiceSchedulesRequest) returns (ResolveServiceSchedulesResponse);

  // Streams every matching service schedule.
  rpc ExportServiceSchedules(ExportServiceSchedulesRequest) returns (stream ExportServiceSchedulesResponse);

  // Summarizes a service schedule.
  rpc SummarizeServiceSchedules(SummarizeServiceSchedulesRequest) returns (SummarizeServiceSchedulesResponse);

  // Lists service schedules a page at a time.
  rpc SuggestServiceSchedules(SuggestServiceSchedulesRequest) returns (SuggestServiceSchedulesResponse);

  // Returns a service schedule.
  rpc PeekServiceSchedule(PeekServiceScheduleRequest) returns (PeekServiceScheduleResponse);
}

// The request of `LookupServiceSchedule`.
message LookupServiceScheduleRequest {
  acme.common.v1.RequestContext context = 1;
  string service_schedule_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupServiceSchedule`.
message LookupServiceScheduleResponse {
  ServiceSchedule service_schedule = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseServiceSchedules`.
message BrowseServiceSchedulesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ServiceScheduleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseServiceSchedulesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseServiceSchedules`.
message BrowseServiceSchedulesResponse {
  repeated ServiceSchedule service_schedules = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindServiceSchedules`.
message FindServiceSchedulesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ServiceScheduleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindServiceSchedulesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindServiceSchedules`.
message FindServiceSchedulesResponse {
  repeated ServiceSchedule service_schedules = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountServiceSchedules`.
message CountServiceSchedulesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ServiceScheduleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountServiceSchedulesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountServiceSchedules`.
message CountServiceSchedulesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveServiceSchedules`.
message ResolveServiceSchedulesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string service_schedule_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveServiceSchedules`.
message ResolveServiceSchedulesResponse {
  repeated ServiceSchedule service_schedules = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportServiceSchedules`.
message ExportServiceSchedulesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ServiceScheduleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportServiceSchedulesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportServiceSchedules`.
message ExportServiceSchedulesResponse {
  ServiceSchedule service_schedule = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeServiceSchedules`.
message SummarizeServiceSchedulesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string service_schedule_id = 2;
  SummarizeServiceSchedulesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeServiceSchedules`.
message SummarizeServiceSchedulesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestServiceSchedules`.
message SuggestServiceSchedulesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ServiceScheduleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestServiceSchedulesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestServiceSchedules`.
message SuggestServiceSchedulesResponse {
  repeated ServiceSchedule service_schedules = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekServiceSchedule`.
message PeekServiceScheduleRequest {
  acme.common.v1.RequestContext context = 1;
  string service_schedule_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekServiceSchedule`.
message PeekServiceScheduleResponse {
  ServiceSchedule service_schedule = 1;
  acme.common.v1.OperationResult result = 2;
}
