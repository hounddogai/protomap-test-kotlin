syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "ServiceScheduleValidationServiceProto";
option java_package = "com.acme.maintenance.v1";

// Checks service schedules against the rules before anything acts on them.
service ServiceScheduleValidationService {
  // Validates a service schedule.
  rpc ValidateServiceSchedule(ValidateServiceScheduleRequest) returns (ValidateServiceScheduleResponse);

  // Previews a service schedule.
  rpc PreviewServiceSchedule(PreviewServiceScheduleRequest) returns (PreviewServiceScheduleResponse);

  // Normalizes a service schedule.
  rpc NormalizeServiceSchedule(NormalizeServiceScheduleRequest) returns (NormalizeServiceScheduleResponse);

  // Explains a service schedule.
  rpc ExplainServiceScheduleDecision(ExplainServiceScheduleDecisionRequest) returns (ExplainServiceScheduleDecisionResponse);

  // Lints a service schedule.
  rpc LintServiceSchedules(LintServiceSchedulesRequest) returns (LintServiceSchedulesResponse);

  // Returns a service schedule.
  rpc GetServiceScheduleRules(GetServiceScheduleRulesRequest) returns (GetServiceScheduleRulesResponse);
}

// The request of `ValidateServiceSchedule`.
message ValidateServiceScheduleRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string service_schedule_id = 2;
  ServiceSchedule service_schedule = 3;
  ValidateServiceScheduleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateServiceSchedule`.
message ValidateServiceScheduleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ServiceSchedule service_schedule = 1;
  ValidateServiceScheduleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

