syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "PartValidationServiceProto";
option java_package = "com.acme.maintenance.v1";

// Checks parts against the rules before anything acts on them.
service PartValidationService {
  // Validates a part.
  rpc ValidatePart(ValidatePartRequest) returns (ValidatePartResponse);

  // Previews a part.
  rpc PreviewPart(PreviewPartRequest) returns (PreviewPartResponse);

  // Checks a part.
  rpc CheckPartEligibility(CheckPartEligibilityRequest) returns (CheckPartEligibilityResponse);

  // Normalizes a part.
  rpc NormalizePart(NormalizePartRequest) returns (NormalizePartResponse);

  // Explains a part.
  rpc ExplainPartDecision(ExplainPartDecisionRequest) returns (ExplainPartDecisionResponse);

  // Scores a part.
  rpc ScorePart(ScorePartRequest) returns (ScorePartResponse);

  // Returns a part.
  rpc GetPartRules(GetPartRulesRequest) returns (GetPartRulesResponse);
}

// The request of `ValidatePart`.
message ValidatePartRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  Part part = 3;
  ValidatePartRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePart`.
message ValidatePartResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Part part = 1;
  ValidatePartResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

