syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "ServiceScheduleCalculationServiceProto";
option java_package = "com.acme.maintenance.v1";

// Computes the figures of a service schedule, such as totals, taxes, and estimates.
service ServiceScheduleCalculationService {
  // Calculates a service schedule.
  rpc CalculateServiceSchedule(CalculateServiceScheduleRequest) returns (CalculateServiceScheduleResponse);

  // Estimates a service schedule.
  rpc EstimateServiceSchedule(EstimateServiceScheduleRequest) returns (EstimateServiceScheduleResponse);

  // Quotes a service schedule.
  rpc QuoteServiceSchedule(QuoteServiceScheduleRequest) returns (QuoteServiceScheduleResponse);

  // Recalculates a service schedule.
  rpc RecalculateServiceSchedules(RecalculateServiceSchedulesRequest) returns (RecalculateServiceSchedulesResponse);

  // Simulates a service schedule.
  rpc SimulateServiceSchedule(SimulateServiceScheduleRequest) returns (SimulateServiceScheduleResponse);

  // Explains a service schedule.
  rpc ExplainServiceScheduleCalculation(ExplainServiceScheduleCalculationRequest) returns (ExplainServiceScheduleCalculationResponse);

  // Returns a service schedule.
  rpc GetServiceScheduleRates(GetServiceScheduleRatesRequest) returns (GetServiceScheduleRatesResponse);
}

// The request of `CalculateServiceSchedule`.
message CalculateServiceScheduleRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string service_schedule_id = 2;
  ServiceSchedule service_schedule = 3;
  CalculateServiceScheduleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateServiceSchedule`.
message CalculateServiceScheduleResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateServiceScheduleResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ServiceSchedule service_schedule = 1;
  CalculateServiceScheduleResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

