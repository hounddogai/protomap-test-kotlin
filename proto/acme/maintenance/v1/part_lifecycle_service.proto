syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "PartLifecycleServiceProto";
option java_package = "com.acme.maintenance.v1";

// Moves a part between the states of its lifecycle.
service PartLifecycleService {
  // Activates a part.
  rpc ActivatePart(ActivatePartRequest) returns (ActivatePartResponse);

  // Suspends a part.
  rpc SuspendPart(SuspendPartRequest) returns (SuspendPartResponse);

  // Terminates a part.
  rpc TerminatePart(TerminatePartRequest) returns (TerminatePartResponse);

  // Renews a part.
  rpc RenewPart(RenewPartRequest) returns (RenewPartResponse);

  // Expires a part.
  rpc ExpirePart(ExpirePartRequest) returns (ExpirePartResponse);

  // Returns a part.
  rpc GetPartLifecycle(GetPartLifecycleRequest) returns (GetPartLifecycleResponse);

  // Schedules a part.
  rpc SchedulePartExpiry(SchedulePartExpiryRequest) returns (SchedulePartExpiryResponse);
}

// The request of `ActivatePart`.
message ActivatePartRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  ActivatePartRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePart`.
message ActivatePartResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Part part = 1;
  ActivatePartResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

