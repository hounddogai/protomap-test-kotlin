syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "PartReportingServiceProto";
option java_package = "com.acme.maintenance.v1";

// Builds and schedules reports about parts.
service PartReportingService {
  // Generates a part.
  rpc GeneratePartReport(GeneratePartReportRequest) returns (GeneratePartReportResponse);

  // Returns a part.
  rpc FetchPartReport(FetchPartReportRequest) returns (FetchPartReportResponse);

  // Schedules a part.
  rpc SchedulePartReport(SchedulePartReportRequest) returns (SchedulePartReportResponse);

  // Lists parts a page at a time.
  rpc ListPartReports(ListPartReportsRequest) returns (ListPartReportsResponse);

  // Shares a part.
  rpc SharePartReport(SharePartReportRequest) returns (SharePartReportResponse);

  // Deletes a part.
  rpc DeletePartReport(DeletePartReportRequest) returns (DeletePartReportResponse);
}

// The request of `GeneratePartReport`.
message GeneratePartReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  GeneratePartReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePartReport`.
message GeneratePartReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPartReport`.
message FetchPartReportRequest {
  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPartReport`.
message FetchPartReportResponse {
  Part part = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePartReport`.
message SchedulePartReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  SchedulePartReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePartReport`.
message SchedulePartReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListPartReports`.
message ListPartReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PartStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPartReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPartReports`.
message ListPartReportsResponse {
  repeated Part parts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePartReport`.
message SharePartReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  SharePartReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePartReport`.
message SharePartReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Part part = 1;
  SharePartReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeletePartReport`.
message DeletePartReportRequest {
  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePartReport`.
message DeletePartReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
