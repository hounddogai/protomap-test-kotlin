option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "ServiceScheduleWorkflowServiceProto";
option java_package = "com.acme.maintenance.v1";

// Runs the long-lived workflow that takes a service schedule from start to finish.
service ServiceScheduleWorkflowService {
  // Starts a service schedule.
  rpc StartServiceScheduleWorkflow(StartServiceScheduleWorkflowRequest) returns (StartServiceScheduleWorkflowResponse);

  // Advances a service schedule.
  rpc AdvanceServiceScheduleWorkflow(AdvanceServiceScheduleWorkflowRequest) returns (AdvanceServiceScheduleWorkflowResponse);

  // Cancels a service schedule.
  rpc CancelServiceScheduleWorkflow(CancelServiceScheduleWorkflowRequest) returns (CancelServiceScheduleWorkflowResponse);

  // Retrys a service schedule.
  rpc RetryServiceScheduleWorkflow(RetryServiceScheduleWorkflowRequest) returns (RetryServiceScheduleWorkflowResponse);

  // Pauses a service schedule.
  rpc PauseServiceScheduleWorkflow(PauseServiceScheduleWorkflowRequest) returns (PauseServiceScheduleWorkflowResponse);

  // Resumes a service schedule.
  rpc ResumeServiceScheduleWorkflow(ResumeServiceScheduleWorkflowRequest) returns (ResumeServiceScheduleWorkflowResponse);

  // Returns a service schedule.
  rpc InspectServiceScheduleWorkflow(InspectServiceScheduleWorkflowRequest) returns (InspectServiceScheduleWorkflowResponse);

  // Lists service schedules a page at a time.
  rpc ListServiceScheduleWorkflows(ListServiceScheduleWorkflowsRequest) returns (ListServiceScheduleWorkflowsResponse);

  // Signals a service schedule.
  rpc SignalServiceScheduleWorkflow(SignalServiceScheduleWorkflowRequest) returns (SignalServiceScheduleWorkflowResponse);
}

// The request of `StartServiceScheduleWorkflow`.
message StartServiceScheduleWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string service_schedule_id = 2;
  ServiceSchedule service_schedule = 3;
  StartServiceScheduleWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartServiceScheduleWorkflow`.
message StartServiceScheduleWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ServiceSchedule service_schedule = 1;
  StartServiceScheduleWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

