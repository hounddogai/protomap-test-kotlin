syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "PartWorkflowServiceProto";
option java_package = "com.acme.maintenance.v1";

// Runs the long-lived workflow that takes a part from start to finish.
service PartWorkflowService {
  // Starts a part.
  rpc StartPartWorkflow(StartPartWorkflowRequest) returns (StartPartWorkflowResponse);

  // Advances a part.
  rpc AdvancePartWorkflow(AdvancePartWorkflowRequest) returns (AdvancePartWorkflowResponse);

  // Retrys a part.
  rpc RetryPartWorkflow(RetryPartWorkflowRequest) returns (RetryPartWorkflowResponse);

  // Pauses a part.
  rpc PausePartWorkflow(PausePartWorkflowRequest) returns (PausePartWorkflowResponse);

  // Resumes a part.
  rpc ResumePartWorkflow(ResumePartWorkflowRequest) returns (ResumePartWorkflowResponse);

  // Returns a part.
  rpc InspectPartWorkflow(InspectPartWorkflowRequest) returns (InspectPartWorkflowResponse);

  // Lists parts a page at a time.
  rpc ListPartWorkflows(ListPartWorkflowsRequest) returns (ListPartWorkflowsResponse);

  // Signals a part.
  rpc SignalPartWorkflow(SignalPartWorkflowRequest) returns (SignalPartWorkflowResponse);
}

// The request of `StartPartWorkflow`.
message StartPartWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string part_id = 2;
  Part part = 3;
  StartPartWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPartWorkflow`.
message StartPartWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Part part = 1;
  StartPartWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

