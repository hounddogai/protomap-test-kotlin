syntax = "proto3";

package acme.maintenance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/maintenance/v1/maintenance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Maintenance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/maintenance/v1;maintenancev1";
option java_multiple_files = true;
option java_outer_classname = "ServiceScheduleApprovalServiceProto";
option java_package = "com.acme.maintenance.v1";

// Routes service schedules through approval, with escalation and delegation.
service ServiceScheduleApprovalService {
  // Submits a service schedule.
  rpc SubmitServiceSchedule(SubmitServiceScheduleRequest) returns (SubmitServiceScheduleResponse);

  // Approves a service schedule.
  rpc ApproveServiceSchedule(ApproveServiceScheduleRequest) returns (ApproveServiceScheduleResponse);

  // Escalates a service schedule.
  rpc EscalateServiceSchedule(EscalateServiceScheduleRequest) returns (EscalateServiceScheduleResponse);

  // Lists service schedules a page at a time.
  rpc ListPendingServiceSchedules(ListPendingServiceSchedulesRequest) returns (ListPendingServiceSchedulesResponse);

  // Delegates a service schedule.
  rpc DelegateServiceScheduleApproval(DelegateServiceScheduleApprovalRequest) returns (DelegateServiceScheduleApprovalResponse);

  // Recalls a service schedule.
  rpc RecallServiceSchedule(RecallServiceScheduleRequest) returns (RecallServiceScheduleResponse);

  // Returns a service schedule.
  rpc GetServiceScheduleApprovalStatus(GetServiceScheduleApprovalStatusRequest) returns (GetServiceScheduleApprovalStatusResponse);

  // Comments a service schedule.
  rpc CommentServiceScheduleApproval(CommentServiceScheduleApprovalRequest) returns (CommentServiceScheduleApprovalResponse);
}

// The request of `SubmitServiceSchedule`.
message SubmitServiceScheduleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string service_schedule_id = 2;
  ServiceSchedule service_schedule = 3;
  SubmitServiceScheduleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitServiceSchedule`.
message SubmitServiceScheduleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ServiceSchedule service_schedule = 1;
  SubmitServiceScheduleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

