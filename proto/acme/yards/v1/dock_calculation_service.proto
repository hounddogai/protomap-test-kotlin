syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "DockCalculationServiceProto";
option java_package = "com.acme.yards.v1";

// Computes the figures of a dock, such as totals, taxes, and estimates.
service DockCalculationService {
  // Calculates a dock.
  rpc CalculateDock(CalculateDockRequest) returns (CalculateDockResponse);

  // Estimates a dock.
  rpc EstimateDock(EstimateDockRequest) returns (EstimateDockResponse);

  // Quotes a dock.
  rpc QuoteDock(QuoteDockRequest) returns (QuoteDockResponse);

  // Compares a dock.
  rpc CompareDockOptions(CompareDockOptionsRequest) returns (CompareDockOptionsResponse);

  // Recalculates a dock.
  rpc RecalculateDocks(RecalculateDocksRequest) returns (RecalculateDocksResponse);

  // Simulates a dock.
  rpc SimulateDock(SimulateDockRequest) returns (SimulateDockResponse);

  // Explains a dock.
  rpc ExplainDockCalculation(ExplainDockCalculationRequest) returns (ExplainDockCalculationResponse);

  // Returns a dock.
  rpc GetDockRates(GetDockRatesRequest) returns (GetDockRatesResponse);
}

// The request of `CalculateDock`.
message CalculateDockRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dock_id = 2;
  Dock dock = 3;
  CalculateDockRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDock`.
message CalculateDockResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDockResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Dock dock = 1;
  CalculateDockResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

