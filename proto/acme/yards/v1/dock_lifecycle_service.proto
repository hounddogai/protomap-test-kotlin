syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "DockLifecycleServiceProto";
option java_package = "com.acme.yards.v1";

// Moves a dock between the states of its lifecycle.
service DockLifecycleService {
  // Activates a dock.
  rpc ActivateDock(ActivateDockRequest) returns (ActivateDockResponse);

  // Suspends a dock.
  rpc SuspendDock(SuspendDockRequest) returns (SuspendDockResponse);

  // Reinstates a dock.
  rpc ReinstateDock(ReinstateDockRequest) returns (ReinstateDockResponse);

  // Terminates a dock.
  rpc TerminateDock(TerminateDockRequest) returns (TerminateDockResponse);

  // Renews a dock.
  rpc RenewDock(RenewDockRequest) returns (RenewDockResponse);

  // Expires a dock.
  rpc ExpireDock(ExpireDockRequest) returns (ExpireDockResponse);

  // Returns a dock.
  rpc GetDockLifecycle(GetDockLifecycleRequest) returns (GetDockLifecycleResponse);

  // Schedules a dock.
  rpc ScheduleDockExpiry(ScheduleDockExpiryRequest) returns (ScheduleDockExpiryResponse);
}

// The request of `ActivateDock`.
message ActivateDockRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dock_id = 2;
  ActivateDockRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateDock`.
message ActivateDockResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dock dock = 1;
  ActivateDockResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

