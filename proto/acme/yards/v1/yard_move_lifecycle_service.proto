syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardMoveLifecycleServiceProto";
option java_package = "com.acme.yards.v1";

// Moves a yard move between the states of its lifecycle.
service YardMoveLifecycleService {
  // Activates a yard move.
  rpc ActivateYardMove(ActivateYardMoveRequest) returns (ActivateYardMoveResponse);

  // Suspends a yard move.
  rpc SuspendYardMove(SuspendYardMoveRequest) returns (SuspendYardMoveResponse);

  // Terminates a yard move.
  rpc TerminateYardMove(TerminateYardMoveRequest) returns (TerminateYardMoveResponse);

  // Renews a yard move.
  rpc RenewYardMove(RenewYardMoveRequest) returns (RenewYardMoveResponse);

  // Expires a yard move.
  rpc ExpireYardMove(ExpireYardMoveRequest) returns (ExpireYardMoveResponse);

  // Returns a yard move.
  rpc GetYardMoveLifecycle(GetYardMoveLifecycleRequest) returns (GetYardMoveLifecycleResponse);

  // Schedules a yard move.
  rpc ScheduleYardMoveExpiry(ScheduleYardMoveExpiryRequest) returns (ScheduleYardMoveExpiryResponse);
}

// The request of `ActivateYardMove`.
message ActivateYardMoveRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_move_id = 2;
  ActivateYardMoveRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateYardMove`.
message ActivateYardMoveResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  YardMove yard_move = 1;
  ActivateYardMoveResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

