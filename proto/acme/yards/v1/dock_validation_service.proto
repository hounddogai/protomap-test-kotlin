syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "DockValidationServiceProto";
option java_package = "com.acme.yards.v1";

// Checks docks against the rules before anything acts on them.
service DockValidationService {
  // Validates a dock.
  rpc ValidateDock(ValidateDockRequest) returns (ValidateDockResponse);

  // Previews a dock.
  rpc PreviewDock(PreviewDockRequest) returns (PreviewDockResponse);

  // Checks a dock.
  rpc CheckDockEligibility(CheckDockEligibilityRequest) returns (CheckDockEligibilityResponse);

  // Normalizes a dock.
  rpc NormalizeDock(NormalizeDockRequest) returns (NormalizeDockResponse);

  // Explains a dock.
  rpc ExplainDockDecision(ExplainDockDecisionRequest) returns (ExplainDockDecisionResponse);

  // Scores a dock.
  rpc ScoreDock(ScoreDockRequest) returns (ScoreDockResponse);

  // Lints a dock.
  rpc LintDocks(LintDocksRequest) returns (LintDocksResponse);

  // Returns a dock.
  rpc GetDockRules(GetDockRulesRequest) returns (GetDockRulesResponse);
}

// The request of `ValidateDock`.
message ValidateDockRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dock_id = 2;
  Dock dock = 3;
  ValidateDockRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDock`.
message ValidateDockResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dock dock = 1;
  ValidateDockResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

