syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardMoveCalculationServiceProto";
option java_package = "com.acme.yards.v1";

// Computes the figures of a yard move, such as totals, taxes, and estimates.
service YardMoveCalculationService {
  // Calculates a yard move.
  rpc CalculateYardMove(CalculateYardMoveRequest) returns (CalculateYardMoveResponse);

  // Estimates a yard move.
  rpc EstimateYardMove(EstimateYardMoveRequest) returns (EstimateYardMoveResponse);

  // Quotes a yard move.
  rpc QuoteYardMove(QuoteYardMoveRequest) returns (QuoteYardMoveResponse);

  // Compares a yard move.
  rpc CompareYardMoveOptions(CompareYardMoveOptionsRequest) returns (CompareYardMoveOptionsResponse);

  // Simulates a yard move.
  rpc SimulateYardMove(SimulateYardMoveRequest) returns (SimulateYardMoveResponse);

  // Explains a yard move.
  rpc ExplainYardMoveCalculation(ExplainYardMoveCalculationRequest) returns (ExplainYardMoveCalculationResponse);

  // Returns a yard move.
  rpc GetYardMoveRates(GetYardMoveRatesRequest) returns (GetYardMoveRatesResponse);
}

// The request of `CalculateYardMove`.
message CalculateYardMoveRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_move_id = 2;
  YardMove yard_move = 3;
  CalculateYardMoveRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateYardMove`.
message CalculateYardMoveResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateYardMoveResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  YardMove yard_move = 1;
  CalculateYardMoveResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

