syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardApprovalServiceProto";
option java_package = "com.acme.yards.v1";

// Routes yards through approval, with escalation and delegation.
service YardApprovalService {
  // Submits a yard.
  rpc SubmitYard(SubmitYardRequest) returns (SubmitYardResponse);

  // Approves a yard.
  rpc ApproveYard(ApproveYardRequest) returns (ApproveYardResponse);

  // Rejects a yard.
  rpc RejectYard(RejectYardRequest) returns (RejectYardResponse);

  // Escalates a yard.
  rpc EscalateYard(EscalateYardRequest) returns (EscalateYardResponse);

  // Lists yards a page at a time.
  rpc ListPendingYards(ListPendingYardsRequest) returns (ListPendingYardsResponse);

  // Delegates a yard.
  rpc DelegateYardApproval(DelegateYardApprovalRequest) returns (DelegateYardApprovalResponse);

  // Recalls a yard.
  rpc RecallYard(RecallYardRequest) returns (RecallYardResponse);

  // Returns a yard.
  rpc GetYardApprovalStatus(GetYardApprovalStatusRequest) returns (GetYardApprovalStatusResponse);

  // Comments a yard.
  rpc CommentYardApproval(CommentYardApprovalRequest) returns (CommentYardApprovalResponse);
}

// The request of `SubmitYard`.
message SubmitYardRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_id = 2;
  Yard yard = 3;
  SubmitYardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitYard`.
message SubmitYardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Yard yard = 1;
  SubmitYardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

