syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "DockQueryServiceProto";
option java_package = "com.acme.yards.v1";

// Answers read-only questions about docks, for screens and reports.
service DockQueryService {
  // Returns a dock.
  rpc LookupDock(LookupDockRequest) returns (LookupDockResponse);

  // Lists docks a page at a time.
  rpc BrowseDocks(BrowseDocksRequest) returns (BrowseDocksResponse);

  // Lists docks a page at a time.
  rpc FindDocks(FindDocksRequest) returns (FindDocksResponse);

  // Counts docks by status.
  rpc CountDocks(CountDocksRequest) returns (CountDocksResponse);

  // Summarizes a dock.
  rpc SummarizeDocks(SummarizeDocksRequest) returns (SummarizeDocksResponse);

  // Lists docks a page at a time.
  rpc SuggestDocks(SuggestDocksRequest) returns (SuggestDocksResponse);

  // Returns a dock.
  rpc PeekDock(PeekDockRequest) returns (PeekDockResponse);
}

// The request of `LookupDock`.
message LookupDockRequest {
  acme.common.v1.RequestContext context = 1;
  string dock_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupDock`.
message LookupDockResponse {
  Dock dock = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseDocks`.
message BrowseDocksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DockStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseDocksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseDocks`.
message BrowseDocksResponse {
  repeated Dock docks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindDocks`.
message FindDocksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DockStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindDocksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindDocks`.
message FindDocksResponse {
  repeated Dock docks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDocks`.
message CountDocksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DockStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDocksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDocks`.
message CountDocksResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeDocks`.
message SummarizeDocksRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dock_id = 2;
  SummarizeDocksRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeDocks`.
message SummarizeDocksResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestDocks`.
message SuggestDocksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DockStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestDocksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestDocks`.
message SuggestDocksResponse {
  repeated Dock docks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekDock`.
message PeekDockRequest {
  acme.common.v1.RequestContext context = 1;
  string dock_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekDock`.
message PeekDockResponse {
  Dock dock = 1;
  acme.common.v1.OperationResult result = 2;
}
