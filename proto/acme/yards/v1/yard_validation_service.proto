syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardValidationServiceProto";
option java_package = "com.acme.yards.v1";

// Checks yards against the rules before anything acts on them.
service YardValidationService {
  // Validates a yard.
  rpc ValidateYard(ValidateYardRequest) returns (ValidateYardResponse);

  // Previews a yard.
  rpc PreviewYard(PreviewYardRequest) returns (PreviewYardResponse);

  // Checks a yard.
  rpc CheckYardEligibility(CheckYardEligibilityRequest) returns (CheckYardEligibilityResponse);

  // Normalizes a yard.
  rpc NormalizeYard(NormalizeYardRequest) returns (NormalizeYardResponse);

  // Explains a yard.
  rpc ExplainYardDecision(ExplainYardDecisionRequest) returns (ExplainYardDecisionResponse);

  // Scores a yard.
  rpc ScoreYard(ScoreYardRequest) returns (ScoreYardResponse);

  // Returns a yard.
  rpc GetYardRules(GetYardRulesRequest) returns (GetYardRulesResponse);
}

// The request of `ValidateYard`.
message ValidateYardRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_id = 2;
  Yard yard = 3;
  ValidateYardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateYard`.
message ValidateYardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Yard yard = 1;
  ValidateYardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

