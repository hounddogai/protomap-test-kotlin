syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardWorkflowServiceProto";
option java_package = "com.acme.yards.v1";

// Runs the long-lived workflow that takes a yard from start to finish.
service YardWorkflowService {
  // Starts a yard.
  rpc StartYardWorkflow(StartYardWorkflowRequest) returns (StartYardWorkflowResponse);

  // Advances a yard.
  rpc AdvanceYardWorkflow(AdvanceYardWorkflowRequest) returns (AdvanceYardWorkflowResponse);

  // Cancels a yard.
  rpc CancelYardWorkflow(CancelYardWorkflowRequest) returns (CancelYardWorkflowResponse);

  // Retrys a yard.
  rpc RetryYardWorkflow(RetryYardWorkflowRequest) returns (RetryYardWorkflowResponse);

  // Pauses a yard.
  rpc PauseYardWorkflow(PauseYardWorkflowRequest) returns (PauseYardWorkflowResponse);

  // Resumes a yard.
  rpc ResumeYardWorkflow(ResumeYardWorkflowRequest) returns (ResumeYardWorkflowResponse);

  // Returns a yard.
  rpc InspectYardWorkflow(InspectYardWorkflowRequest) returns (InspectYardWorkflowResponse);

  // Lists yards a page at a time.
  rpc ListYardWorkflows(ListYardWorkflowsRequest) returns (ListYardWorkflowsResponse);

  // Signals a yard.
  rpc SignalYardWorkflow(SignalYardWorkflowRequest) returns (SignalYardWorkflowResponse);
}

// The request of `StartYardWorkflow`.
message StartYardWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_id = 2;
  Yard yard = 3;
  StartYardWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartYardWorkflow`.
message StartYardWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Yard yard = 1;
  StartYardWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

