syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardMoveReportingServiceProto";
option java_package = "com.acme.yards.v1";

// Builds and schedules reports about yard moves.
service YardMoveReportingService {
  // Generates a yard move.
  rpc GenerateYardMoveReport(GenerateYardMoveReportRequest) returns (GenerateYardMoveReportResponse);

  // Returns a yard move.
  rpc FetchYardMoveReport(FetchYardMoveReportRequest) returns (FetchYardMoveReportResponse);

  // Schedules a yard move.
  rpc ScheduleYardMoveReport(ScheduleYardMoveReportRequest) returns (ScheduleYardMoveReportResponse);

  // Streams the changes of yard moves as they happen.
  rpc StreamYardMoveMetrics(StreamYardMoveMetricsRequest) returns (stream StreamYardMoveMetricsResponse);

  // Lists yard moves a page at a time.
  rpc ListYardMoveReports(ListYardMoveReportsRequest) returns (ListYardMoveReportsResponse);

  // Shares a yard move.
  rpc ShareYardMoveReport(ShareYardMoveReportRequest) returns (ShareYardMoveReportResponse);

  // Counts yard moves by status.
  rpc CountYardMoveTotals(CountYardMoveTotalsRequest) returns (CountYardMoveTotalsResponse);

  // Deletes a yard move.
  rpc DeleteYardMoveReport(DeleteYardMoveReportRequest) returns (DeleteYardMoveReportResponse);
}

// The request of `GenerateYardMoveReport`.
message GenerateYardMoveReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_move_id = 2;
  GenerateYardMoveReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateYardMoveReport`.
message GenerateYardMoveReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchYardMoveReport`.
message FetchYardMoveReportRequest {
  acme.common.v1.RequestContext context = 1;
  string yard_move_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchYardMoveReport`.
message FetchYardMoveReportResponse {
  YardMove yard_move = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleYardMoveReport`.
message ScheduleYardMoveReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_move_id = 2;
  ScheduleYardMoveReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleYardMoveReport`.
message ScheduleYardMoveReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamYardMoveMetrics`.
message StreamYardMoveMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated YardMoveStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamYardMoveMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamYardMoveMetrics`.
message StreamYardMoveMetricsResponse {
  YardMove yard_move = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListYardMoveReports`.
message ListYardMoveReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated YardMoveStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListYardMoveReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListYardMoveReports`.
message ListYardMoveReportsResponse {
  repeated YardMove yard_moves = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareYardMoveReport`.
message ShareYardMoveReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_move_id = 2;
  ShareYardMoveReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareYardMoveReport`.
message ShareYardMoveReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  YardMove yard_move = 1;
  ShareYardMoveReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountYardMoveTotals`.
message CountYardMoveTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated YardMoveStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountYardMoveTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountYardMoveTotals`.
message CountYardMoveTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteYardMoveReport`.
message DeleteYardMoveReportRequest {
  acme.common.v1.RequestContext context = 1;
  string yard_move_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteYardMoveReport`.
message DeleteYardMoveReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
