syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardMoveApprovalServiceProto";
option java_package = "com.acme.yards.v1";

// Routes yard moves through approval, with escalation and delegation.
service YardMoveApprovalService {
  // Submits a yard move.
  rpc SubmitYardMove(SubmitYardMoveRequest) returns (SubmitYardMoveResponse);

  // Approves a yard move.
  rpc ApproveYardMove(ApproveYardMoveRequest) returns (ApproveYardMoveResponse);

  // Rejects a yard move.
  rpc RejectYardMove(RejectYardMoveRequest) returns (RejectYardMoveResponse);

  // Lists yard moves a page at a time.
  rpc ListPendingYardMoves(ListPendingYardMovesRequest) returns (ListPendingYardMovesResponse);

  // Delegates a yard move.
  rpc DelegateYardMoveApproval(DelegateYardMoveApprovalRequest) returns (DelegateYardMoveApprovalResponse);

  // Recalls a yard move.
  rpc RecallYardMove(RecallYardMoveRequest) returns (RecallYardMoveResponse);

  // Comments a yard move.
  rpc CommentYardMoveApproval(CommentYardMoveApprovalRequest) returns (CommentYardMoveApprovalResponse);
}

// The request of `SubmitYardMove`.
message SubmitYardMoveRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_move_id = 2;
  YardMove yard_move = 3;
  SubmitYardMoveRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitYardMove`.
message SubmitYardMoveResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  YardMove yard_move = 1;
  SubmitYardMoveResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

