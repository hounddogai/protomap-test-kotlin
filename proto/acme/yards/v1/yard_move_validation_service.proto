syntax = "proto3";

package acme.yards.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/yards/v1/yards.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Yards.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/yards/v1;yardsv1";
option java_multiple_files = true;
option java_outer_classname = "YardMoveValidationServiceProto";
option java_package = "com.acme.yards.v1";

// Checks yard moves against the rules before anything acts on them.
service YardMoveValidationService {
  // Validates a yard move.
  rpc ValidateYardMove(ValidateYardMoveRequest) returns (ValidateYardMoveResponse);

  // Previews a yard move.
  rpc PreviewYardMove(PreviewYardMoveRequest) returns (PreviewYardMoveResponse);

  // Checks a yard move.
  rpc CheckYardMoveEligibility(CheckYardMoveEligibilityRequest) returns (CheckYardMoveEligibilityResponse);

  // Normalizes a yard move.
  rpc NormalizeYardMove(NormalizeYardMoveRequest) returns (NormalizeYardMoveResponse);

  // Explains a yard move.
  rpc ExplainYardMoveDecision(ExplainYardMoveDecisionRequest) returns (ExplainYardMoveDecisionResponse);

  // Scores a yard move.
  rpc ScoreYardMove(ScoreYardMoveRequest) returns (ScoreYardMoveResponse);

  // Returns a yard move.
  rpc GetYardMoveRules(GetYardMoveRulesRequest) returns (GetYardMoveRulesResponse);
}

// The request of `ValidateYardMove`.
message ValidateYardMoveRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string yard_move_id = 2;
  YardMove yard_move = 3;
  ValidateYardMoveRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateYardMove`.
message ValidateYardMoveResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  YardMove yard_move = 1;
  ValidateYardMoveResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

