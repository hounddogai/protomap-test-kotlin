syntax = "proto3";

package acme.driverapp.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/driverapp/v1/driverapp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "DriverInboxWorkflowServiceProto";
option java_package = "com.acme.driverapp.v1";

// Runs the long-lived workflow that takes a driver inbox from start to finish.
service DriverInboxWorkflowService {
  // Starts a driver inbox.
  rpc StartDriverInboxWorkflow(StartDriverInboxWorkflowRequest) returns (StartDriverInboxWorkflowResponse);

  // Advances a driver inbox.
  rpc AdvanceDriverInboxWorkflow(AdvanceDriverInboxWorkflowRequest) returns (AdvanceDriverInboxWorkflowResponse);

  // Cancels a driver inbox.
  rpc CancelDriverInboxWorkflow(CancelDriverInboxWorkflowRequest) returns (CancelDriverInboxWorkflowResponse);

  // Retrys a driver inbox.
  rpc RetryDriverInboxWorkflow(RetryDriverInboxWorkflowRequest) returns (RetryDriverInboxWorkflowResponse);

  // Resumes a driver inbox.
  rpc ResumeDriverInboxWorkflow(ResumeDriverInboxWorkflowRequest) returns (ResumeDriverInboxWorkflowResponse);

  // Returns a driver inbox.
  rpc InspectDriverInboxWorkflow(InspectDriverInboxWorkflowRequest) returns (InspectDriverInboxWorkflowResponse);

  // Lists driver inboxes a page at a time.
  rpc ListDriverInboxWorkflows(ListDriverInboxWorkflowsRequest) returns (ListDriverInboxWorkflowsResponse);

  // Signals a driver inbox.
  rpc SignalDriverInboxWorkflow(SignalDriverInboxWorkflowRequest) returns (SignalDriverInboxWorkflowResponse);
}

// The request of `StartDriverInboxWorkflow`.
message StartDriverInboxWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  DriverInbox driver_inbox = 3;
  StartDriverInboxWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDriverInboxWorkflow`.
message StartDriverInboxWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverInbox driver_inbox = 1;
  StartDriverInboxWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

