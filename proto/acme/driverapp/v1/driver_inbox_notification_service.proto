syntax = "proto3";

package acme.driverapp.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/driverapp/v1/driverapp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "DriverInboxNotificationServiceProto";
option java_package = "com.acme.driverapp.v1";

// Tells the people who follow a driver inbox what changed.
service DriverInboxNotificationService {
  // Subscribes a driver inbox.
  rpc SubscribeDriverInboxUpdates(SubscribeDriverInboxUpdatesRequest) returns (SubscribeDriverInboxUpdatesResponse);

  // Unsubscribes a driver inbox.
  rpc UnsubscribeDriverInboxUpdates(UnsubscribeDriverInboxUpdatesRequest) returns (UnsubscribeDriverInboxUpdatesResponse);

  // Notifys a driver inbox.
  rpc NotifyDriverInboxWatchers(NotifyDriverInboxWatchersRequest) returns (NotifyDriverInboxWatchersResponse);

  // Lists driver inboxes a page at a time.
  rpc ListDriverInboxSubscriptions(ListDriverInboxSubscriptionsRequest) returns (ListDriverInboxSubscriptionsResponse);

  // Returns a driver inbox.
  rpc GetDriverInboxPreferences(GetDriverInboxPreferencesRequest) returns (GetDriverInboxPreferencesResponse);

  // Streams the changes of driver inboxes as they happen.
  rpc StreamDriverInboxNotices(StreamDriverInboxNoticesRequest) returns (stream StreamDriverInboxNoticesResponse);
}

// The request of `SubscribeDriverInboxUpdates`.
message SubscribeDriverInboxUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  SubscribeDriverInboxUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeDriverInboxUpdates`.
message SubscribeDriverInboxUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverInbox driver_inbox = 1;
  SubscribeDriverInboxUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeDriverInboxUpdates`.
message UnsubscribeDriverInboxUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  UnsubscribeDriverInboxUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeDriverInboxUpdates`.
message UnsubscribeDriverInboxUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverInbox driver_inbox = 1;
  UnsubscribeDriverInboxUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyDriverInboxWatchers`.
message NotifyDriverInboxWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  NotifyDriverInboxWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyDriverInboxWatchers`.
message NotifyDriverInboxWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverInbox driver_inbox = 1;
  NotifyDriverInboxWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDriverInboxSubscriptions`.
message ListDriverInboxSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDriverInboxSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDriverInboxSubscriptions`.
message ListDriverInboxSubscriptionsResponse {
  repeated DriverInbox driver_inboxes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDriverInboxPreferences`.
message GetDriverInboxPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDriverInboxPreferences`.
message GetDriverInboxPreferencesResponse {
  DriverInbox driver_inbox = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamDriverInboxNotices`.
message StreamDriverInboxNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDriverInboxNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDriverInboxNotices`.
message StreamDriverInboxNoticesResponse {
  DriverInbox driver_inbox = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
