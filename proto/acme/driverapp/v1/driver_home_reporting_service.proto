syntax = "proto3";

package acme.driverapp.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/driverapp/v1/driverapp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "DriverHomeReportingServiceProto";
option java_package = "com.acme.driverapp.v1";

// Builds and schedules reports about driver homes.
service DriverHomeReportingService {
  // Generates a driver home.
  rpc GenerateDriverHomeReport(GenerateDriverHomeReportRequest) returns (GenerateDriverHomeReportResponse);

  // Returns a driver home.
  rpc FetchDriverHomeReport(FetchDriverHomeReportRequest) returns (FetchDriverHomeReportResponse);

  // Schedules a driver home.
  rpc ScheduleDriverHomeReport(ScheduleDriverHomeReportRequest) returns (ScheduleDriverHomeReportResponse);

  // Streams the changes of driver homes as they happen.
  rpc StreamDriverHomeMetrics(StreamDriverHomeMetricsRequest) returns (stream StreamDriverHomeMetricsResponse);

  // Shares a driver home.
  rpc ShareDriverHomeReport(ShareDriverHomeReportRequest) returns (ShareDriverHomeReportResponse);

  // Counts driver homes by status.
  rpc CountDriverHomeTotals(CountDriverHomeTotalsRequest) returns (CountDriverHomeTotalsResponse);

  // Deletes a driver home.
  rpc DeleteDriverHomeReport(DeleteDriverHomeReportRequest) returns (DeleteDriverHomeReportResponse);
}

// The request of `GenerateDriverHomeReport`.
message GenerateDriverHomeReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  GenerateDriverHomeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateDriverHomeReport`.
message GenerateDriverHomeReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchDriverHomeReport`.
message FetchDriverHomeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchDriverHomeReport`.
message FetchDriverHomeReportResponse {
  DriverHome driver_home = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleDriverHomeReport`.
message ScheduleDriverHomeReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  ScheduleDriverHomeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDriverHomeReport`.
message ScheduleDriverHomeReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamDriverHomeMetrics`.
message StreamDriverHomeMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDriverHomeMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDriverHomeMetrics`.
message StreamDriverHomeMetricsResponse {
  DriverHome driver_home = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareDriverHomeReport`.
message ShareDriverHomeReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  ShareDriverHomeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDriverHomeReport`.
message ShareDriverHomeReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverHome driver_home = 1;
  ShareDriverHomeReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDriverHomeTotals`.
message CountDriverHomeTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDriverHomeTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDriverHomeTotals`.
message CountDriverHomeTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteDriverHomeReport`.
message DeleteDriverHomeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteDriverHomeReport`.
message DeleteDriverHomeReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
