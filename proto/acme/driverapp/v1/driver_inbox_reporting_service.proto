syntax = "proto3";

package acme.driverapp.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/driverapp/v1/driverapp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "DriverInboxReportingServiceProto";
option java_package = "com.acme.driverapp.v1";

// Builds and schedules reports about driver inboxes.
service DriverInboxReportingService {
  // Generates a driver inbox.
  rpc GenerateDriverInboxReport(GenerateDriverInboxReportRequest) returns (GenerateDriverInboxReportResponse);

  // Returns a driver inbox.
  rpc FetchDriverInboxReport(FetchDriverInboxReportRequest) returns (FetchDriverInboxReportResponse);

  // Schedules a driver inbox.
  rpc ScheduleDriverInboxReport(ScheduleDriverInboxReportRequest) returns (ScheduleDriverInboxReportResponse);

  // Lists driver inboxes a page at a time.
  rpc ListDriverInboxReports(ListDriverInboxReportsRequest) returns (ListDriverInboxReportsResponse);

  // Shares a driver inbox.
  rpc ShareDriverInboxReport(ShareDriverInboxReportRequest) returns (ShareDriverInboxReportResponse);

  // Counts driver inboxes by status.
  rpc CountDriverInboxTotals(CountDriverInboxTotalsRequest) returns (CountDriverInboxTotalsResponse);

  // Deletes a driver inbox.
  rpc DeleteDriverInboxReport(DeleteDriverInboxReportRequest) returns (DeleteDriverInboxReportResponse);
}

// The request of `GenerateDriverInboxReport`.
message GenerateDriverInboxReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  GenerateDriverInboxReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateDriverInboxReport`.
message GenerateDriverInboxReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchDriverInboxReport`.
message FetchDriverInboxReportRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchDriverInboxReport`.
message FetchDriverInboxReportResponse {
  DriverInbox driver_inbox = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleDriverInboxReport`.
message ScheduleDriverInboxReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  ScheduleDriverInboxReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDriverInboxReport`.
message ScheduleDriverInboxReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListDriverInboxReports`.
message ListDriverInboxReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDriverInboxReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDriverInboxReports`.
message ListDriverInboxReportsResponse {
  repeated DriverInbox driver_inboxes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDriverInboxReport`.
message ShareDriverInboxReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  ShareDriverInboxReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDriverInboxReport`.
message ShareDriverInboxReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverInbox driver_inbox = 1;
  ShareDriverInboxReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDriverInboxTotals`.
message CountDriverInboxTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDriverInboxTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDriverInboxTotals`.
message CountDriverInboxTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteDriverInboxReport`.
message DeleteDriverInboxReportRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_inbox_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteDriverInboxReport`.
message DeleteDriverInboxReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
