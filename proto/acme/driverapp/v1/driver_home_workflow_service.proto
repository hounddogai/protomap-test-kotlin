option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "DriverHomeWorkflowServiceProto";
option java_package = "com.acme.driverapp.v1";

// Runs the long-lived workflow that takes a driver home from start to finish.
service DriverHomeWorkflowService {
  // Starts a driver home.
  rpc StartDriverHomeWorkflow(StartDriverHomeWorkflowRequest) returns (StartDriverHomeWorkflowResponse);

  // Advances a driver home.
  rpc AdvanceDriverHomeWorkflow(AdvanceDriverHomeWorkflowRequest) returns (AdvanceDriverHomeWorkflowResponse);

  // Cancels a driver home.
  rpc CancelDriverHomeWorkflow(CancelDriverHomeWorkflowRequest) returns (CancelDriverHomeWorkflowResponse);

  // Retrys a driver home.
  rpc RetryDriverHomeWorkflow(RetryDriverHomeWorkflowRequest) returns (RetryDriverHomeWorkflowResponse);

  // Pauses a driver home.
  rpc PauseDriverHomeWorkflow(PauseDriverHomeWorkflowRequest) returns (PauseDriverHomeWorkflowResponse);

  // Resumes a driver home.
  rpc ResumeDriverHomeWorkflow(ResumeDriverHomeWorkflowRequest) returns (ResumeDriverHomeWorkflowResponse);

  // Returns a driver home.
  rpc InspectDriverHomeWorkflow(InspectDriverHomeWorkflowRequest) returns (InspectDriverHomeWorkflowResponse);

  // Signals a driver home.
  rpc SignalDriverHomeWorkflow(SignalDriverHomeWorkflowRequest) returns (SignalDriverHomeWorkflowResponse);
}

// The request of `StartDriverHomeWorkflow`.
message StartDriverHomeWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  DriverHome driver_home = 3;
  StartDriverHomeWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDriverHomeWorkflow`.
message StartDriverHomeWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverHome driver_home = 1;
  StartDriverHomeWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

