syntax = "proto3";

package acme.driverapp.v1;

option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.driverapp.v1";

// A reference to a driver home of the driverapp domain.
message DriverHomeRef {
  string driver_home_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a driver inbox of the driverapp domain.
message DriverInboxRef {
  string driver_inbox_id = 1;
  string display_name = 2;
  string number = 3;
}
