message SendDriverHomeTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverHome driver_home = 1;
  SendDriverHomeTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDriverHomePreferences`.
message GetDriverHomePreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDriverHomePreferences`.
message GetDriverHomePreferencesResponse {
  DriverHome driver_home = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamDriverHomeNotices`.
message StreamDriverHomeNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDriverHomeNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDriverHomeNotices`.
message StreamDriverHomeNoticesResponse {
  DriverHome driver_home = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
