syntax = "proto3";

package acme.driverapp.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/driverapp/v1/driverapp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Driverapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/driverapp/v1;driverappv1";
option java_multiple_files = true;
option java_outer_classname = "DriverHomeNotificationServiceProto";
option java_package = "com.acme.driverapp.v1";

// Tells the people who follow a driver home what changed.
service DriverHomeNotificationService {
  // Subscribes a driver home.
  rpc SubscribeDriverHomeUpdates(SubscribeDriverHomeUpdatesRequest) returns (SubscribeDriverHomeUpdatesResponse);

  // Unsubscribes a driver home.
  rpc UnsubscribeDriverHomeUpdates(UnsubscribeDriverHomeUpdatesRequest) returns (UnsubscribeDriverHomeUpdatesResponse);

  // Notifys a driver home.
  rpc NotifyDriverHomeWatchers(NotifyDriverHomeWatchersRequest) returns (NotifyDriverHomeWatchersResponse);

  // Lists driver homes a page at a time.
  rpc ListDriverHomeSubscriptions(ListDriverHomeSubscriptionsRequest) returns (ListDriverHomeSubscriptionsResponse);

  // Sends a driver home.
  rpc SendDriverHomeTestNotice(SendDriverHomeTestNoticeRequest) returns (SendDriverHomeTestNoticeResponse);

  // Returns a driver home.
  rpc GetDriverHomePreferences(GetDriverHomePreferencesRequest) returns (GetDriverHomePreferencesResponse);

  // Streams the changes of driver homes as they happen.
  rpc StreamDriverHomeNotices(StreamDriverHomeNoticesRequest) returns (stream StreamDriverHomeNoticesResponse);
}

// The request of `SubscribeDriverHomeUpdates`.
message SubscribeDriverHomeUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  SubscribeDriverHomeUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeDriverHomeUpdates`.
message SubscribeDriverHomeUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverHome driver_home = 1;
  SubscribeDriverHomeUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeDriverHomeUpdates`.
message UnsubscribeDriverHomeUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  UnsubscribeDriverHomeUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeDriverHomeUpdates`.
message UnsubscribeDriverHomeUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverHome driver_home = 1;
  UnsubscribeDriverHomeUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyDriverHomeWatchers`.
message NotifyDriverHomeWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_home_id = 2;
  NotifyDriverHomeWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyDriverHomeWatchers`.
message NotifyDriverHomeWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverHome driver_home = 1;
  NotifyDriverHomeWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDriverHomeSubscriptions`.
message ListDriverHomeSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDriverHomeSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDriverHomeSubscriptions`.
message ListDriverHomeSubscriptionsResponse {
  repeated DriverHome driver_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendDriverHomeTestNotice`.
message SendDriverHomeTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
