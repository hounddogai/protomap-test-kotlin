syntax = "proto3";

package acme.routing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/routing/v1/routing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "RouteValidationServiceProto";
option java_package = "com.acme.routing.v1";

// Checks routes against the rules before anything acts on them.
service RouteValidationService {
  // Validates a route.
  rpc ValidateRoute(ValidateRouteRequest) returns (ValidateRouteResponse);

  // Previews a route.
  rpc PreviewRoute(PreviewRouteRequest) returns (PreviewRouteResponse);

  // Checks a route.
  rpc CheckRouteEligibility(CheckRouteEligibilityRequest) returns (CheckRouteEligibilityResponse);

  // Explains a route.
  rpc ExplainRouteDecision(ExplainRouteDecisionRequest) returns (ExplainRouteDecisionResponse);

  // Scores a route.
  rpc ScoreRoute(ScoreRouteRequest) returns (ScoreRouteResponse);

  // Lints a route.
  rpc LintRoutes(LintRoutesRequest) returns (LintRoutesResponse);

  // Returns a route.
  rpc GetRouteRules(GetRouteRulesRequest) returns (GetRouteRulesResponse);
}

// The request of `ValidateRoute`.
message ValidateRouteRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string route_id = 2;
  Route route = 3;
  ValidateRouteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRoute`.
message ValidateRouteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Route route = 1;
  ValidateRouteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

