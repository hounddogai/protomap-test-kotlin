syntax = "proto3";

package acme.routing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/routing/v1/routing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "RoutePlanValidationServiceProto";
option java_package = "com.acme.routing.v1";

// Checks route plans against the rules before anything acts on them.
service RoutePlanValidationService {
  // Validates a route plan.
  rpc ValidateRoutePlan(ValidateRoutePlanRequest) returns (ValidateRoutePlanResponse);

  // Previews a route plan.
  rpc PreviewRoutePlan(PreviewRoutePlanRequest) returns (PreviewRoutePlanResponse);

  // Checks a route plan.
  rpc CheckRoutePlanEligibility(CheckRoutePlanEligibilityRequest) returns (CheckRoutePlanEligibilityResponse);

  // Normalizes a route plan.
  rpc NormalizeRoutePlan(NormalizeRoutePlanRequest) returns (NormalizeRoutePlanResponse);

  // Explains a route plan.
  rpc ExplainRoutePlanDecision(ExplainRoutePlanDecisionRequest) returns (ExplainRoutePlanDecisionResponse);

  // Scores a route plan.
  rpc ScoreRoutePlan(ScoreRoutePlanRequest) returns (ScoreRoutePlanResponse);

  // Lints a route plan.
  rpc LintRoutePlans(LintRoutePlansRequest) returns (LintRoutePlansResponse);

  // Returns a route plan.
  rpc GetRoutePlanRules(GetRoutePlanRulesRequest) returns (GetRoutePlanRulesResponse);
}

// The request of `ValidateRoutePlan`.
message ValidateRoutePlanRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string route_plan_id = 2;
  RoutePlan route_plan = 3;
  ValidateRoutePlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRoutePlan`.
message ValidateRoutePlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoutePlan route_plan = 1;
  ValidateRoutePlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

