syntax = "proto3";

package acme.routing.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.routing.v1";

// A reference to a route of the routing domain.
message RouteRef {
  string route_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a stop of the routing domain.
message StopRef {
  string stop_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a route plan of the routing domain.
message RoutePlanRef {
  string route_plan_id = 1;
  string display_name = 2;
  string number = 3;
}
