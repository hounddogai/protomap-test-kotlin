syntax = "proto3";

package acme.routing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/routing/v1/routing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "StopValidationServiceProto";
option java_package = "com.acme.routing.v1";

// Checks stops against the rules before anything acts on them.
service StopValidationService {
  // Validates a stop.
  rpc ValidateStop(ValidateStopRequest) returns (ValidateStopResponse);

  // Previews a stop.
  rpc PreviewStop(PreviewStopRequest) returns (PreviewStopResponse);

  // Checks a stop.
  rpc CheckStopEligibility(CheckStopEligibilityRequest) returns (CheckStopEligibilityResponse);

  // Explains a stop.
  rpc ExplainStopDecision(ExplainStopDecisionRequest) returns (ExplainStopDecisionResponse);

  // Scores a stop.
  rpc ScoreStop(ScoreStopRequest) returns (ScoreStopResponse);

  // Lints a stop.
  rpc LintStops(LintStopsRequest) returns (LintStopsResponse);

  // Returns a stop.
  rpc GetStopRules(GetStopRulesRequest) returns (GetStopRulesResponse);
}

// The request of `ValidateStop`.
message ValidateStopRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string stop_id = 2;
  Stop stop = 3;
  ValidateStopRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateStop`.
message ValidateStopResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Stop stop = 1;
  ValidateStopResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

