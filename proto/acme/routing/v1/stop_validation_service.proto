// The request of `GetStopRules`.
message GetStopRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string stop_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetStopRules`.
message GetStopRulesResponse {
