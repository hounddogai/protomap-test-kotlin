option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "RoutePlanWorkflowServiceProto";
option java_package = "com.acme.routing.v1";

// Runs the long-lived workflow that takes a route plan from start to finish.
service RoutePlanWorkflowService {
  // Starts a route plan.
  rpc StartRoutePlanWorkflow(StartRoutePlanWorkflowRequest) returns (StartRoutePlanWorkflowResponse);

  // Advances a route plan.
  rpc AdvanceRoutePlanWorkflow(AdvanceRoutePlanWorkflowRequest) returns (AdvanceRoutePlanWorkflowResponse);

  // Cancels a route plan.
  rpc CancelRoutePlanWorkflow(CancelRoutePlanWorkflowRequest) returns (CancelRoutePlanWorkflowResponse);

  // Retrys a route plan.
  rpc RetryRoutePlanWorkflow(RetryRoutePlanWorkflowRequest) returns (RetryRoutePlanWorkflowResponse);

  // Pauses a route plan.
  rpc PauseRoutePlanWorkflow(PauseRoutePlanWorkflowRequest) returns (PauseRoutePlanWorkflowResponse);

  // Resumes a route plan.
  rpc ResumeRoutePlanWorkflow(ResumeRoutePlanWorkflowRequest) returns (ResumeRoutePlanWorkflowResponse);

  // Returns a route plan.
  rpc InspectRoutePlanWorkflow(InspectRoutePlanWorkflowRequest) returns (InspectRoutePlanWorkflowResponse);

  // Lists route plans a page at a time.
  rpc ListRoutePlanWorkflows(ListRoutePlanWorkflowsRequest) returns (ListRoutePlanWorkflowsResponse);

  // Signals a route plan.
  rpc SignalRoutePlanWorkflow(SignalRoutePlanWorkflowRequest) returns (SignalRoutePlanWorkflowResponse);
}

// The request of `StartRoutePlanWorkflow`.
message StartRoutePlanWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_plan_id = 2;
  RoutePlan route_plan = 3;
  StartRoutePlanWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRoutePlanWorkflow`.
message StartRoutePlanWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoutePlan route_plan = 1;
  StartRoutePlanWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

