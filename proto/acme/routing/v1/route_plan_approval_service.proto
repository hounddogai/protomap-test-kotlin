syntax = "proto3";

package acme.routing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/routing/v1/routing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "RoutePlanApprovalServiceProto";
option java_package = "com.acme.routing.v1";

// Routes route plans through approval, with escalation and delegation.
service RoutePlanApprovalService {
  // Submits a route plan.
  rpc SubmitRoutePlan(SubmitRoutePlanRequest) returns (SubmitRoutePlanResponse);

  // Approves a route plan.
  rpc ApproveRoutePlan(ApproveRoutePlanRequest) returns (ApproveRoutePlanResponse);

  // Rejects a route plan.
  rpc RejectRoutePlan(RejectRoutePlanRequest) returns (RejectRoutePlanResponse);

  // Escalates a route plan.
  rpc EscalateRoutePlan(EscalateRoutePlanRequest) returns (EscalateRoutePlanResponse);

  // Lists route plans a page at a time.
  rpc ListPendingRoutePlans(ListPendingRoutePlansRequest) returns (ListPendingRoutePlansResponse);

  // Delegates a route plan.
  rpc DelegateRoutePlanApproval(DelegateRoutePlanApprovalRequest) returns (DelegateRoutePlanApprovalResponse);

  // Returns a route plan.
  rpc GetRoutePlanApprovalStatus(GetRoutePlanApprovalStatusRequest) returns (GetRoutePlanApprovalStatusResponse);

  // Comments a route plan.
  rpc CommentRoutePlanApproval(CommentRoutePlanApprovalRequest) returns (CommentRoutePlanApprovalResponse);
}

// The request of `SubmitRoutePlan`.
message SubmitRoutePlanRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_plan_id = 2;
  RoutePlan route_plan = 3;
  SubmitRoutePlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRoutePlan`.
message SubmitRoutePlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoutePlan route_plan = 1;
  SubmitRoutePlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

