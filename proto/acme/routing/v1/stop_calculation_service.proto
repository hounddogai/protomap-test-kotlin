syntax = "proto3";

package acme.routing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/routing/v1/routing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "StopCalculationServiceProto";
option java_package = "com.acme.routing.v1";

// Computes the figures of a stop, such as totals, taxes, and estimates.
service StopCalculationService {
  // Calculates a stop.
  rpc CalculateStop(CalculateStopRequest) returns (CalculateStopResponse);

  // Estimates a stop.
  rpc EstimateStop(EstimateStopRequest) returns (EstimateStopResponse);

  // Quotes a stop.
  rpc QuoteStop(QuoteStopRequest) returns (QuoteStopResponse);

  // Compares a stop.
  rpc CompareStopOptions(CompareStopOptionsRequest) returns (CompareStopOptionsResponse);

  // Simulates a stop.
  rpc SimulateStop(SimulateStopRequest) returns (SimulateStopResponse);

  // Explains a stop.
  rpc ExplainStopCalculation(ExplainStopCalculationRequest) returns (ExplainStopCalculationResponse);

  // Returns a stop.
  rpc GetStopRates(GetStopRatesRequest) returns (GetStopRatesResponse);
}

// The request of `CalculateStop`.
message CalculateStopRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string stop_id = 2;
  Stop stop = 3;
  CalculateStopRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateStop`.
message CalculateStopResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateStopResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Stop stop = 1;
  CalculateStopResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

