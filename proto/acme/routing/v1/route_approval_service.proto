syntax = "proto3";

package acme.routing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/routing/v1/routing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "RouteApprovalServiceProto";
option java_package = "com.acme.routing.v1";

// Routes routes through approval, with escalation and delegation.
service RouteApprovalService {
  // Submits a route.
  rpc SubmitRoute(SubmitRouteRequest) returns (SubmitRouteResponse);

  // Approves a route.
  rpc ApproveRoute(ApproveRouteRequest) returns (ApproveRouteResponse);

  // Rejects a route.
  rpc RejectRoute(RejectRouteRequest) returns (RejectRouteResponse);

  // Escalates a route.
  rpc EscalateRoute(EscalateRouteRequest) returns (EscalateRouteResponse);

  // Lists routes a page at a time.
  rpc ListPendingRoutes(ListPendingRoutesRequest) returns (ListPendingRoutesResponse);

  // Delegates a route.
  rpc DelegateRouteApproval(DelegateRouteApprovalRequest) returns (DelegateRouteApprovalResponse);

  // Recalls a route.
  rpc RecallRoute(RecallRouteRequest) returns (RecallRouteResponse);

  // Returns a route.
  rpc GetRouteApprovalStatus(GetRouteApprovalStatusRequest) returns (GetRouteApprovalStatusResponse);

  // Comments a route.
  rpc CommentRouteApproval(CommentRouteApprovalRequest) returns (CommentRouteApprovalResponse);
}

// The request of `SubmitRoute`.
message SubmitRouteRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_id = 2;
  Route route = 3;
  SubmitRouteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRoute`.
message SubmitRouteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Route route = 1;
  SubmitRouteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

