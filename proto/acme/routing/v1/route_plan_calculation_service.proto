syntax = "proto3";

package acme.routing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/routing/v1/routing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Routing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/routing/v1;routingv1";
option java_multiple_files = true;
option java_outer_classname = "RoutePlanCalculationServiceProto";
option java_package = "com.acme.routing.v1";

// Computes the figures of a route plan, such as totals, taxes, and estimates.
service RoutePlanCalculationService {
  // Calculates a route plan.
  rpc CalculateRoutePlan(CalculateRoutePlanRequest) returns (CalculateRoutePlanResponse);

  // Estimates a route plan.
  rpc EstimateRoutePlan(EstimateRoutePlanRequest) returns (EstimateRoutePlanResponse);

  // Quotes a route plan.
  rpc QuoteRoutePlan(QuoteRoutePlanRequest) returns (QuoteRoutePlanResponse);

  // Compares a route plan.
  rpc CompareRoutePlanOptions(CompareRoutePlanOptionsRequest) returns (CompareRoutePlanOptionsResponse);

  // Recalculates a route plan.
  rpc RecalculateRoutePlans(RecalculateRoutePlansRequest) returns (RecalculateRoutePlansResponse);

  // Simulates a route plan.
  rpc SimulateRoutePlan(SimulateRoutePlanRequest) returns (SimulateRoutePlanResponse);

  // Explains a route plan.
  rpc ExplainRoutePlanCalculation(ExplainRoutePlanCalculationRequest) returns (ExplainRoutePlanCalculationResponse);

  // Returns a route plan.
  rpc GetRoutePlanRates(GetRoutePlanRatesRequest) returns (GetRoutePlanRatesResponse);
}

// The request of `CalculateRoutePlan`.
message CalculateRoutePlanRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_plan_id = 2;
  RoutePlan route_plan = 3;
  CalculateRoutePlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRoutePlan`.
message CalculateRoutePlanResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRoutePlanResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  RoutePlan route_plan = 1;
  CalculateRoutePlanResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

