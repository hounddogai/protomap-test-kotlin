syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TelemetryReadingValidationServiceProto";
option java_package = "com.acme.telematics.v1";

// Checks telemetry readings against the rules before anything acts on them.
service TelemetryReadingValidationService {
  // Validates a telemetry reading.
  rpc ValidateTelemetryReading(ValidateTelemetryReadingRequest) returns (ValidateTelemetryReadingResponse);

  // Previews a telemetry reading.
  rpc PreviewTelemetryReading(PreviewTelemetryReadingRequest) returns (PreviewTelemetryReadingResponse);

  // Checks a telemetry reading.
  rpc CheckTelemetryReadingEligibility(CheckTelemetryReadingEligibilityRequest) returns (CheckTelemetryReadingEligibilityResponse);

  // Normalizes a telemetry reading.
  rpc NormalizeTelemetryReading(NormalizeTelemetryReadingRequest) returns (NormalizeTelemetryReadingResponse);

  // Explains a telemetry reading.
  rpc ExplainTelemetryReadingDecision(ExplainTelemetryReadingDecisionRequest) returns (ExplainTelemetryReadingDecisionResponse);

  // Scores a telemetry reading.
  rpc ScoreTelemetryReading(ScoreTelemetryReadingRequest) returns (ScoreTelemetryReadingResponse);

  // Returns a telemetry reading.
  rpc GetTelemetryReadingRules(GetTelemetryReadingRulesRequest) returns (GetTelemetryReadingRulesResponse);
}

// The request of `ValidateTelemetryReading`.
message ValidateTelemetryReadingRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string telemetry_reading_id = 2;
  TelemetryReading telemetry_reading = 3;
  ValidateTelemetryReadingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTelemetryReading`.
message ValidateTelemetryReadingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TelemetryReading telemetry_reading = 1;
  ValidateTelemetryReadingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

