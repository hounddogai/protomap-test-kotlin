syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TripLogImportServiceProto";
option java_package = "com.acme.telematics.v1";

// Takes trip logs in bulk from partners and legacy systems.
service TripLogImportService {
  // Takes a stream of trip logs and answers once at the end.
  rpc ImportTripLogs(stream ImportTripLogsRequest) returns (ImportTripLogsResponse);

  // Returns a trip log.
  rpc GetTripLogImportStatus(GetTripLogImportStatusRequest) returns (GetTripLogImportStatusResponse);

  // Cancels a trip log.
  rpc CancelTripLogImport(CancelTripLogImportRequest) returns (CancelTripLogImportResponse);

  // Validates a trip log.
  rpc ValidateTripLogImport(ValidateTripLogImportRequest) returns (ValidateTripLogImportResponse);

  // Retrys a trip log.
  rpc RetryTripLogImport(RetryTripLogImportRequest) returns (RetryTripLogImportResponse);

  // Maps a trip log.
  rpc MapTripLogImportColumns(MapTripLogImportColumnsRequest) returns (MapTripLogImportColumnsResponse);
}

// The request of `ImportTripLogs`.
message ImportTripLogsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportTripLogsRequest.StreamHeader header = 2;
    TripLog record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportTripLogs`.
message ImportTripLogsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string trip_log_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportTripLogsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetTripLogImportStatus`.
message GetTripLogImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetTripLogImportStatus`.
message GetTripLogImportStatusResponse {
  TripLog trip_log = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelTripLogImport`.
message CancelTripLogImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  CancelTripLogImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelTripLogImport`.
message CancelTripLogImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TripLog trip_log = 1;
  CancelTripLogImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateTripLogImport`.
message ValidateTripLogImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  TripLog trip_log = 3;
  ValidateTripLogImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTripLogImport`.
message ValidateTripLogImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TripLog trip_log = 1;
  ValidateTripLogImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryTripLogImport`.
message RetryTripLogImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  TripLog trip_log = 3;
  RetryTripLogImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryTripLogImport`.
message RetryTripLogImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TripLog trip_log = 1;
  RetryTripLogImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapTripLogImportColumns`.
message MapTripLogImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  TripLog trip_log = 3;
  MapTripLogImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapTripLogImportColumns`.
message MapTripLogImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TripLog trip_log = 1;
  MapTripLogImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
