syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TripLogWorkflowServiceProto";
option java_package = "com.acme.telematics.v1";

// Runs the long-lived workflow that takes a trip log from start to finish.
service TripLogWorkflowService {
  // Starts a trip log.
  rpc StartTripLogWorkflow(StartTripLogWorkflowRequest) returns (StartTripLogWorkflowResponse);

  // Advances a trip log.
  rpc AdvanceTripLogWorkflow(AdvanceTripLogWorkflowRequest) returns (AdvanceTripLogWorkflowResponse);

  // Cancels a trip log.
  rpc CancelTripLogWorkflow(CancelTripLogWorkflowRequest) returns (CancelTripLogWorkflowResponse);

  // Retrys a trip log.
  rpc RetryTripLogWorkflow(RetryTripLogWorkflowRequest) returns (RetryTripLogWorkflowResponse);

  // Pauses a trip log.
  rpc PauseTripLogWorkflow(PauseTripLogWorkflowRequest) returns (PauseTripLogWorkflowResponse);

  // Resumes a trip log.
  rpc ResumeTripLogWorkflow(ResumeTripLogWorkflowRequest) returns (ResumeTripLogWorkflowResponse);

  // Returns a trip log.
  rpc InspectTripLogWorkflow(InspectTripLogWorkflowRequest) returns (InspectTripLogWorkflowResponse);

  // Lists trip logs a page at a time.
  rpc ListTripLogWorkflows(ListTripLogWorkflowsRequest) returns (ListTripLogWorkflowsResponse);
}

// The request of `StartTripLogWorkflow`.
message StartTripLogWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  TripLog trip_log = 3;
  StartTripLogWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTripLogWorkflow`.
message StartTripLogWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TripLog trip_log = 1;
  StartTripLogWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

