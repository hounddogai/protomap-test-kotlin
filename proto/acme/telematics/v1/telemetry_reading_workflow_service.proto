syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TelemetryReadingWorkflowServiceProto";
option java_package = "com.acme.telematics.v1";

// Runs the long-lived workflow that takes a telemetry reading from start to finish.
service TelemetryReadingWorkflowService {
  // Starts a telemetry reading.
  rpc StartTelemetryReadingWorkflow(StartTelemetryReadingWorkflowRequest) returns (StartTelemetryReadingWorkflowResponse);

  // Advances a telemetry reading.
  rpc AdvanceTelemetryReadingWorkflow(AdvanceTelemetryReadingWorkflowRequest) returns (AdvanceTelemetryReadingWorkflowResponse);

  // Retrys a telemetry reading.
  rpc RetryTelemetryReadingWorkflow(RetryTelemetryReadingWorkflowRequest) returns (RetryTelemetryReadingWorkflowResponse);

  // Pauses a telemetry reading.
  rpc PauseTelemetryReadingWorkflow(PauseTelemetryReadingWorkflowRequest) returns (PauseTelemetryReadingWorkflowResponse);

  // Resumes a telemetry reading.
  rpc ResumeTelemetryReadingWorkflow(ResumeTelemetryReadingWorkflowRequest) returns (ResumeTelemetryReadingWorkflowResponse);

  // Lists telemetry readings a page at a time.
  rpc ListTelemetryReadingWorkflows(ListTelemetryReadingWorkflowsRequest) returns (ListTelemetryReadingWorkflowsResponse);
}

// The request of `StartTelemetryReadingWorkflow`.
message StartTelemetryReadingWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string telemetry_reading_id = 2;
  TelemetryReading telemetry_reading = 3;
  StartTelemetryReadingWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTelemetryReadingWorkflow`.
message StartTelemetryReadingWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TelemetryReading telemetry_reading = 1;
  StartTelemetryReadingWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

