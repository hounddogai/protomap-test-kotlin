syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "GeoFenceLifecycleServiceProto";
option java_package = "com.acme.telematics.v1";

// Moves a geo fence between the states of its lifecycle.
service GeoFenceLifecycleService {
  // Activates a geo fence.
  rpc ActivateGeoFence(ActivateGeoFenceRequest) returns (ActivateGeoFenceResponse);

  // Suspends a geo fence.
  rpc SuspendGeoFence(SuspendGeoFenceRequest) returns (SuspendGeoFenceResponse);

  // Reinstates a geo fence.
  rpc ReinstateGeoFence(ReinstateGeoFenceRequest) returns (ReinstateGeoFenceResponse);

  // Terminates a geo fence.
  rpc TerminateGeoFence(TerminateGeoFenceRequest) returns (TerminateGeoFenceResponse);

  // Expires a geo fence.
  rpc ExpireGeoFence(ExpireGeoFenceRequest) returns (ExpireGeoFenceResponse);

  // Returns a geo fence.
  rpc GetGeoFenceLifecycle(GetGeoFenceLifecycleRequest) returns (GetGeoFenceLifecycleResponse);

  // Schedules a geo fence.
  rpc ScheduleGeoFenceExpiry(ScheduleGeoFenceExpiryRequest) returns (ScheduleGeoFenceExpiryResponse);
}

// The request of `ActivateGeoFence`.
message ActivateGeoFenceRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  ActivateGeoFenceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateGeoFence`.
message ActivateGeoFenceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GeoFence geo_fence = 1;
  ActivateGeoFenceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

