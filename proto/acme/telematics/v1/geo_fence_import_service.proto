syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "GeoFenceImportServiceProto";
option java_package = "com.acme.telematics.v1";

// Takes geo fences in bulk from partners and legacy systems.
service GeoFenceImportService {
  // Takes a stream of geo fences and answers once at the end.
  rpc ImportGeoFences(stream ImportGeoFencesRequest) returns (ImportGeoFencesResponse);

  // Returns a geo fence.
  rpc GetGeoFenceImportStatus(GetGeoFenceImportStatusRequest) returns (GetGeoFenceImportStatusResponse);

  // Cancels a geo fence.
  rpc CancelGeoFenceImport(CancelGeoFenceImportRequest) returns (CancelGeoFenceImportResponse);

  // Validates a geo fence.
  rpc ValidateGeoFenceImport(ValidateGeoFenceImportRequest) returns (ValidateGeoFenceImportResponse);

  // Lists geo fences a page at a time.
  rpc ListGeoFenceImports(ListGeoFenceImportsRequest) returns (ListGeoFenceImportsResponse);

  // Retrys a geo fence.
  rpc RetryGeoFenceImport(RetryGeoFenceImportRequest) returns (RetryGeoFenceImportResponse);

  // Maps a geo fence.
  rpc MapGeoFenceImportColumns(MapGeoFenceImportColumnsRequest) returns (MapGeoFenceImportColumnsResponse);
}

// The request of `ImportGeoFences`.
message ImportGeoFencesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportGeoFencesRequest.StreamHeader header = 2;
    GeoFence record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportGeoFences`.
message ImportGeoFencesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string geo_fence_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportGeoFencesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetGeoFenceImportStatus`.
message GetGeoFenceImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetGeoFenceImportStatus`.
message GetGeoFenceImportStatusResponse {
  GeoFence geo_fence = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelGeoFenceImport`.
message CancelGeoFenceImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  CancelGeoFenceImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelGeoFenceImport`.
message CancelGeoFenceImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GeoFence geo_fence = 1;
  CancelGeoFenceImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateGeoFenceImport`.
message ValidateGeoFenceImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  GeoFence geo_fence = 3;
  ValidateGeoFenceImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateGeoFenceImport`.
message ValidateGeoFenceImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GeoFence geo_fence = 1;
  ValidateGeoFenceImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListGeoFenceImports`.
message ListGeoFenceImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GeoFenceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListGeoFenceImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListGeoFenceImports`.
message ListGeoFenceImportsResponse {
  repeated GeoFence geo_fences = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryGeoFenceImport`.
message RetryGeoFenceImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  GeoFence geo_fence = 3;
  RetryGeoFenceImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryGeoFenceImport`.
message RetryGeoFenceImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GeoFence geo_fence = 1;
  RetryGeoFenceImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapGeoFenceImportColumns`.
message MapGeoFenceImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  GeoFence geo_fence = 3;
  MapGeoFenceImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapGeoFenceImportColumns`.
message MapGeoFenceImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GeoFence geo_fence = 1;
  MapGeoFenceImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
