syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "GeoFenceSyncServiceProto";
option java_package = "com.acme.telematics.v1";

// Keeps geo fences in step with the systems of record in other regions.
service GeoFenceSyncService {
  // Syncs a geo fence.
  rpc SyncGeoFences(SyncGeoFencesRequest) returns (SyncGeoFencesResponse);

  // Pushs a geo fence.
  rpc PushGeoFence(PushGeoFenceRequest) returns (PushGeoFenceResponse);

  // Pulls a geo fence.
  rpc PullGeoFences(PullGeoFencesRequest) returns (PullGeoFencesResponse);

  // Reconciles a geo fence.
  rpc ReconcileGeoFences(ReconcileGeoFencesRequest) returns (ReconcileGeoFencesResponse);

  // Exchanges changes of geo fences with a peer.
  rpc StreamGeoFenceChanges(stream StreamGeoFenceChangesRequest) returns (stream StreamGeoFenceChangesResponse);

  // Resolves a geo fence.
  rpc ResolveGeoFenceConflict(ResolveGeoFenceConflictRequest) returns (ResolveGeoFenceConflictResponse);

  // Returns a geo fence.
  rpc GetGeoFenceSyncState(GetGeoFenceSyncStateRequest) returns (GetGeoFenceSyncStateResponse);

  // Lists geo fences a page at a time.
  rpc ListGeoFenceConflicts(ListGeoFenceConflictsRequest) returns (ListGeoFenceConflictsResponse);
}

// The request of `SyncGeoFences`.
message SyncGeoFencesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  GeoFence geo_fence = 3;
  SyncGeoFencesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncGeoFences`.
message SyncGeoFencesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GeoFence geo_fence = 1;
  SyncGeoFencesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

