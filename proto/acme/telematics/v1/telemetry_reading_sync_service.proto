syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TelemetryReadingSyncServiceProto";
option java_package = "com.acme.telematics.v1";

// Keeps telemetry readings in step with the systems of record in other regions.
service TelemetryReadingSyncService {
  // Syncs a telemetry reading.
  rpc SyncTelemetryReadings(SyncTelemetryReadingsRequest) returns (SyncTelemetryReadingsResponse);

  // Pushs a telemetry reading.
  rpc PushTelemetryReading(PushTelemetryReadingRequest) returns (PushTelemetryReadingResponse);

  // Pulls a telemetry reading.
  rpc PullTelemetryReadings(PullTelemetryReadingsRequest) returns (PullTelemetryReadingsResponse);

  // Reconciles a telemetry reading.
  rpc ReconcileTelemetryReadings(ReconcileTelemetryReadingsRequest) returns (ReconcileTelemetryReadingsResponse);

  // Exchanges changes of telemetry readings with a peer.
  rpc StreamTelemetryReadingChanges(stream StreamTelemetryReadingChangesRequest) returns (stream StreamTelemetryReadingChangesResponse);

  // Resolves a telemetry reading.
  rpc ResolveTelemetryReadingConflict(ResolveTelemetryReadingConflictRequest) returns (ResolveTelemetryReadingConflictResponse);

  // Returns a telemetry reading.
  rpc GetTelemetryReadingSyncState(GetTelemetryReadingSyncStateRequest) returns (GetTelemetryReadingSyncStateResponse);

  // Lists telemetry readings a page at a time.
  rpc ListTelemetryReadingConflicts(ListTelemetryReadingConflictsRequest) returns (ListTelemetryReadingConflictsResponse);
}

// The request of `SyncTelemetryReadings`.
message SyncTelemetryReadingsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string telemetry_reading_id = 2;
  TelemetryReading telemetry_reading = 3;
  SyncTelemetryReadingsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncTelemetryReadings`.
message SyncTelemetryReadingsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TelemetryReading telemetry_reading = 1;
  SyncTelemetryReadingsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushTelemetryReading`.
message PushTelemetryReadingRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string telemetry_reading_id = 2;
