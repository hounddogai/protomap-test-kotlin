syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TripLogCalculationServiceProto";
option java_package = "com.acme.telematics.v1";

// Computes the figures of a trip log, such as totals, taxes, and estimates.
service TripLogCalculationService {
  // Calculates a trip log.
  rpc CalculateTripLog(CalculateTripLogRequest) returns (CalculateTripLogResponse);

  // Estimates a trip log.
  rpc EstimateTripLog(EstimateTripLogRequest) returns (EstimateTripLogResponse);

  // Quotes a trip log.
  rpc QuoteTripLog(QuoteTripLogRequest) returns (QuoteTripLogResponse);

  // Compares a trip log.
  rpc CompareTripLogOptions(CompareTripLogOptionsRequest) returns (CompareTripLogOptionsResponse);

  // Recalculates a trip log.
  rpc RecalculateTripLogs(RecalculateTripLogsRequest) returns (RecalculateTripLogsResponse);

  // Simulates a trip log.
  rpc SimulateTripLog(SimulateTripLogRequest) returns (SimulateTripLogResponse);

  // Explains a trip log.
  rpc ExplainTripLogCalculation(ExplainTripLogCalculationRequest) returns (ExplainTripLogCalculationResponse);

  // Returns a trip log.
  rpc GetTripLogRates(GetTripLogRatesRequest) returns (GetTripLogRatesResponse);
}

// The request of `CalculateTripLog`.
message CalculateTripLogRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  TripLog trip_log = 3;
  CalculateTripLogRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateTripLog`.
message CalculateTripLogResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateTripLogResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  TripLog trip_log = 1;
  CalculateTripLogResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

