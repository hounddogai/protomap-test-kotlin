syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TripLogReportingServiceProto";
option java_package = "com.acme.telematics.v1";

// Builds and schedules reports about trip logs.
service TripLogReportingService {
  // Generates a trip log.
  rpc GenerateTripLogReport(GenerateTripLogReportRequest) returns (GenerateTripLogReportResponse);

  // Returns a trip log.
  rpc FetchTripLogReport(FetchTripLogReportRequest) returns (FetchTripLogReportResponse);

  // Schedules a trip log.
  rpc ScheduleTripLogReport(ScheduleTripLogReportRequest) returns (ScheduleTripLogReportResponse);

  // Streams the changes of trip logs as they happen.
  rpc StreamTripLogMetrics(StreamTripLogMetricsRequest) returns (stream StreamTripLogMetricsResponse);

  // Lists trip logs a page at a time.
  rpc ListTripLogReports(ListTripLogReportsRequest) returns (ListTripLogReportsResponse);

  // Shares a trip log.
  rpc ShareTripLogReport(ShareTripLogReportRequest) returns (ShareTripLogReportResponse);

  // Counts trip logs by status.
  rpc CountTripLogTotals(CountTripLogTotalsRequest) returns (CountTripLogTotalsResponse);
}

// The request of `GenerateTripLogReport`.
message GenerateTripLogReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  GenerateTripLogReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateTripLogReport`.
message GenerateTripLogReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchTripLogReport`.
message FetchTripLogReportRequest {
  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchTripLogReport`.
message FetchTripLogReportResponse {
  TripLog trip_log = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleTripLogReport`.
message ScheduleTripLogReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  ScheduleTripLogReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleTripLogReport`.
message ScheduleTripLogReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamTripLogMetrics`.
message StreamTripLogMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TripLogStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamTripLogMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamTripLogMetrics`.
message StreamTripLogMetricsResponse {
  TripLog trip_log = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListTripLogReports`.
message ListTripLogReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TripLogStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListTripLogReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListTripLogReports`.
message ListTripLogReportsResponse {
  repeated TripLog trip_logs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareTripLogReport`.
message ShareTripLogReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  ShareTripLogReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareTripLogReport`.
message ShareTripLogReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TripLog trip_log = 1;
  ShareTripLogReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountTripLogTotals`.
message CountTripLogTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TripLogStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountTripLogTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountTripLogTotals`.
message CountTripLogTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
