syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "GeoFenceReportingServiceProto";
option java_package = "com.acme.telematics.v1";

// Builds and schedules reports about geo fences.
service GeoFenceReportingService {
  // Generates a geo fence.
  rpc GenerateGeoFenceReport(GenerateGeoFenceReportRequest) returns (GenerateGeoFenceReportResponse);

  // Returns a geo fence.
  rpc FetchGeoFenceReport(FetchGeoFenceReportRequest) returns (FetchGeoFenceReportResponse);

  // Streams the changes of geo fences as they happen.
  rpc StreamGeoFenceMetrics(StreamGeoFenceMetricsRequest) returns (stream StreamGeoFenceMetricsResponse);

  // Lists geo fences a page at a time.
  rpc ListGeoFenceReports(ListGeoFenceReportsRequest) returns (ListGeoFenceReportsResponse);

  // Shares a geo fence.
  rpc ShareGeoFenceReport(ShareGeoFenceReportRequest) returns (ShareGeoFenceReportResponse);

  // Counts geo fences by status.
  rpc CountGeoFenceTotals(CountGeoFenceTotalsRequest) returns (CountGeoFenceTotalsResponse);

  // Deletes a geo fence.
  rpc DeleteGeoFenceReport(DeleteGeoFenceReportRequest) returns (DeleteGeoFenceReportResponse);
}

// The request of `GenerateGeoFenceReport`.
message GenerateGeoFenceReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  GenerateGeoFenceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateGeoFenceReport`.
message GenerateGeoFenceReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchGeoFenceReport`.
message FetchGeoFenceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchGeoFenceReport`.
message FetchGeoFenceReportResponse {
  GeoFence geo_fence = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamGeoFenceMetrics`.
message StreamGeoFenceMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GeoFenceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamGeoFenceMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamGeoFenceMetrics`.
message StreamGeoFenceMetricsResponse {
  GeoFence geo_fence = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListGeoFenceReports`.
message ListGeoFenceReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GeoFenceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListGeoFenceReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListGeoFenceReports`.
message ListGeoFenceReportsResponse {
  repeated GeoFence geo_fences = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareGeoFenceReport`.
message ShareGeoFenceReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  ShareGeoFenceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareGeoFenceReport`.
message ShareGeoFenceReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GeoFence geo_fence = 1;
  ShareGeoFenceReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountGeoFenceTotals`.
message CountGeoFenceTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GeoFenceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountGeoFenceTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountGeoFenceTotals`.
message CountGeoFenceTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteGeoFenceReport`.
message DeleteGeoFenceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string geo_fence_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteGeoFenceReport`.
message DeleteGeoFenceReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
