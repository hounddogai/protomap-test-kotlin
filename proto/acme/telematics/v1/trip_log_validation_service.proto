syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TripLogValidationServiceProto";
option java_package = "com.acme.telematics.v1";

// Checks trip logs against the rules before anything acts on them.
service TripLogValidationService {
  // Validates a trip log.
  rpc ValidateTripLog(ValidateTripLogRequest) returns (ValidateTripLogResponse);

  // Previews a trip log.
  rpc PreviewTripLog(PreviewTripLogRequest) returns (PreviewTripLogResponse);

  // Checks a trip log.
  rpc CheckTripLogEligibility(CheckTripLogEligibilityRequest) returns (CheckTripLogEligibilityResponse);

  // Normalizes a trip log.
  rpc NormalizeTripLog(NormalizeTripLogRequest) returns (NormalizeTripLogResponse);

  // Explains a trip log.
  rpc ExplainTripLogDecision(ExplainTripLogDecisionRequest) returns (ExplainTripLogDecisionResponse);

  // Scores a trip log.
  rpc ScoreTripLog(ScoreTripLogRequest) returns (ScoreTripLogResponse);

  // Lints a trip log.
  rpc LintTripLogs(LintTripLogsRequest) returns (LintTripLogsResponse);

  // Returns a trip log.
  rpc GetTripLogRules(GetTripLogRulesRequest) returns (GetTripLogRulesResponse);
}

// The request of `ValidateTripLog`.
message ValidateTripLogRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  TripLog trip_log = 3;
  ValidateTripLogRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTripLog`.
message ValidateTripLogResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TripLog trip_log = 1;
  ValidateTripLogResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

