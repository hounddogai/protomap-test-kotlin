syntax = "proto3";

package acme.telematics.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/telematics/v1/telematics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telematics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telematics/v1;telematicsv1";
option java_multiple_files = true;
option java_outer_classname = "TripLogApprovalServiceProto";
option java_package = "com.acme.telematics.v1";

// Routes trip logs through approval, with escalation and delegation.
service TripLogApprovalService {
  // Submits a trip log.
  rpc SubmitTripLog(SubmitTripLogRequest) returns (SubmitTripLogResponse);

  // Approves a trip log.
  rpc ApproveTripLog(ApproveTripLogRequest) returns (ApproveTripLogResponse);

  // Rejects a trip log.
  rpc RejectTripLog(RejectTripLogRequest) returns (RejectTripLogResponse);

  // Escalates a trip log.
  rpc EscalateTripLog(EscalateTripLogRequest) returns (EscalateTripLogResponse);

  // Lists trip logs a page at a time.
  rpc ListPendingTripLogs(ListPendingTripLogsRequest) returns (ListPendingTripLogsResponse);

  // Delegates a trip log.
  rpc DelegateTripLogApproval(DelegateTripLogApprovalRequest) returns (DelegateTripLogApprovalResponse);

  // Recalls a trip log.
  rpc RecallTripLog(RecallTripLogRequest) returns (RecallTripLogResponse);

  // Returns a trip log.
  rpc GetTripLogApprovalStatus(GetTripLogApprovalStatusRequest) returns (GetTripLogApprovalStatusResponse);

  // Comments a trip log.
  rpc CommentTripLogApproval(CommentTripLogApprovalRequest) returns (CommentTripLogApprovalResponse);
}

// The request of `SubmitTripLog`.
message SubmitTripLogRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_log_id = 2;
  TripLog trip_log = 3;
  SubmitTripLogRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTripLog`.
message SubmitTripLogResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TripLog trip_log = 1;
  SubmitTripLogResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

