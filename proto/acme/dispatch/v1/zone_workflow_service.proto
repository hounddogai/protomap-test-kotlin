syntax = "proto3";

package acme.dispatch.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/dispatch/v1/dispatch.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Dispatch.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/dispatch/v1;dispatchv1";
option java_multiple_files = true;
option java_outer_classname = "ZoneWorkflowServiceProto";
option java_package = "com.acme.dispatch.v1";

// Runs the long-lived workflow that takes a zone from start to finish.
service ZoneWorkflowService {
  // Starts a zone.
  rpc StartZoneWorkflow(StartZoneWorkflowRequest) returns (StartZoneWorkflowResponse);

  // Advances a zone.
  rpc AdvanceZoneWorkflow(AdvanceZoneWorkflowRequest) returns (AdvanceZoneWorkflowResponse);

  // Cancels a zone.
  rpc CancelZoneWorkflow(CancelZoneWorkflowRequest) returns (CancelZoneWorkflowResponse);

  // Pauses a zone.
  rpc PauseZoneWorkflow(PauseZoneWorkflowRequest) returns (PauseZoneWorkflowResponse);

  // Resumes a zone.
  rpc ResumeZoneWorkflow(ResumeZoneWorkflowRequest) returns (ResumeZoneWorkflowResponse);

  // Returns a zone.
  rpc InspectZoneWorkflow(InspectZoneWorkflowRequest) returns (InspectZoneWorkflowResponse);

  // Signals a zone.
  rpc SignalZoneWorkflow(SignalZoneWorkflowRequest) returns (SignalZoneWorkflowResponse);
}

// The request of `StartZoneWorkflow`.
message StartZoneWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string zone_id = 2;
  Zone zone = 3;
  StartZoneWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartZoneWorkflow`.
message StartZoneWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Zone zone = 1;
  StartZoneWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

