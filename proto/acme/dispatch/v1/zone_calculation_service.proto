syntax = "proto3";

package acme.dispatch.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/dispatch/v1/dispatch.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Dispatch.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/dispatch/v1;dispatchv1";
option java_multiple_files = true;
option java_outer_classname = "ZoneCalculationServiceProto";
option java_package = "com.acme.dispatch.v1";

// Computes the figures of a zone, such as totals, taxes, and estimates.
service ZoneCalculationService {
  // Calculates a zone.
  rpc CalculateZone(CalculateZoneRequest) returns (CalculateZoneResponse);

  // Estimates a zone.
  rpc EstimateZone(EstimateZoneRequest) returns (EstimateZoneResponse);

  // Quotes a zone.
  rpc QuoteZone(QuoteZoneRequest) returns (QuoteZoneResponse);

  // Compares a zone.
  rpc CompareZoneOptions(CompareZoneOptionsRequest) returns (CompareZoneOptionsResponse);

  // Recalculates a zone.
  rpc RecalculateZones(RecalculateZonesRequest) returns (RecalculateZonesResponse);

  // Simulates a zone.
  rpc SimulateZone(SimulateZoneRequest) returns (SimulateZoneResponse);

  // Explains a zone.
  rpc ExplainZoneCalculation(ExplainZoneCalculationRequest) returns (ExplainZoneCalculationResponse);

  // Returns a zone.
  rpc GetZoneRates(GetZoneRatesRequest) returns (GetZoneRatesResponse);
}

// The request of `CalculateZone`.
message CalculateZoneRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string zone_id = 2;
  Zone zone = 3;
  CalculateZoneRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateZone`.
message CalculateZoneResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateZoneResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Zone zone = 1;
  CalculateZoneResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

