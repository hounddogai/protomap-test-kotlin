syntax = "proto3";

package acme.dispatch.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/dispatch/v1/dispatch.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Dispatch.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/dispatch/v1;dispatchv1";
option java_multiple_files = true;
option java_outer_classname = "DispatchOrderApprovalServiceProto";
option java_package = "com.acme.dispatch.v1";

// Routes dispatch orders through approval, with escalation and delegation.
service DispatchOrderApprovalService {
  // Submits a dispatch order.
  rpc SubmitDispatchOrder(SubmitDispatchOrderRequest) returns (SubmitDispatchOrderResponse);

  // Approves a dispatch order.
  rpc ApproveDispatchOrder(ApproveDispatchOrderRequest) returns (ApproveDispatchOrderResponse);

  // Rejects a dispatch order.
  rpc RejectDispatchOrder(RejectDispatchOrderRequest) returns (RejectDispatchOrderResponse);

  // Escalates a dispatch order.
  rpc EscalateDispatchOrder(EscalateDispatchOrderRequest) returns (EscalateDispatchOrderResponse);

  // Lists dispatch orders a page at a time.
  rpc ListPendingDispatchOrders(ListPendingDispatchOrdersRequest) returns (ListPendingDispatchOrdersResponse);

  // Delegates a dispatch order.
  rpc DelegateDispatchOrderApproval(DelegateDispatchOrderApprovalRequest) returns (DelegateDispatchOrderApprovalResponse);

  // Comments a dispatch order.
  rpc CommentDispatchOrderApproval(CommentDispatchOrderApprovalRequest) returns (CommentDispatchOrderApprovalResponse);
}

// The request of `SubmitDispatchOrder`.
message SubmitDispatchOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dispatch_order_id = 2;
  DispatchOrder dispatch_order = 3;
  SubmitDispatchOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDispatchOrder`.
message SubmitDispatchOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DispatchOrder dispatch_order = 1;
  SubmitDispatchOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

