syntax = "proto3";

package acme.dispatch.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/dispatch/v1/dispatch.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Dispatch.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/dispatch/v1;dispatchv1";
option java_multiple_files = true;
option java_outer_classname = "DispatchAssignmentQueryServiceProto";
option java_package = "com.acme.dispatch.v1";

// Answers read-only questions about dispatch assignments, for screens and reports.
service DispatchAssignmentQueryService {
  // Returns a dispatch assignment.
  rpc LookupDispatchAssignment(LookupDispatchAssignmentRequest) returns (LookupDispatchAssignmentResponse);

  // Lists dispatch assignments a page at a time.
  rpc BrowseDispatchAssignments(BrowseDispatchAssignmentsRequest) returns (BrowseDispatchAssignmentsResponse);

  // Lists dispatch assignments a page at a time.
  rpc FindDispatchAssignments(FindDispatchAssignmentsRequest) returns (FindDispatchAssignmentsResponse);

  // Counts dispatch assignments by status.
  rpc CountDispatchAssignments(CountDispatchAssignmentsRequest) returns (CountDispatchAssignmentsResponse);

  // Returns several dispatch assignments at once.
  rpc ResolveDispatchAssignments(ResolveDispatchAssignmentsRequest) returns (ResolveDispatchAssignmentsResponse);

  // Streams every matching dispatch assignment.
  rpc ExportDispatchAssignments(ExportDispatchAssignmentsRequest) returns (stream ExportDispatchAssignmentsResponse);

  // Summarizes a dispatch assignment.
  rpc SummarizeDispatchAssignments(SummarizeDispatchAssignmentsRequest) returns (SummarizeDispatchAssignmentsResponse);

  // Returns a dispatch assignment.
  rpc PeekDispatchAssignment(PeekDispatchAssignmentRequest) returns (PeekDispatchAssignmentResponse);
}

// The request of `LookupDispatchAssignment`.
message LookupDispatchAssignmentRequest {
  acme.common.v1.RequestContext context = 1;
  string dispatch_assignment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupDispatchAssignment`.
message LookupDispatchAssignmentResponse {
  DispatchAssignment dispatch_assignment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseDispatchAssignments`.
message BrowseDispatchAssignmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DispatchAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseDispatchAssignmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseDispatchAssignments`.
message BrowseDispatchAssignmentsResponse {
  repeated DispatchAssignment dispatch_assignments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindDispatchAssignments`.
message FindDispatchAssignmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DispatchAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindDispatchAssignmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindDispatchAssignments`.
message FindDispatchAssignmentsResponse {
  repeated DispatchAssignment dispatch_assignments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDispatchAssignments`.
message CountDispatchAssignmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DispatchAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDispatchAssignmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDispatchAssignments`.
message CountDispatchAssignmentsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveDispatchAssignments`.
message ResolveDispatchAssignmentsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string dispatch_assignment_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveDispatchAssignments`.
message ResolveDispatchAssignmentsResponse {
  repeated DispatchAssignment dispatch_assignments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportDispatchAssignments`.
message ExportDispatchAssignmentsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DispatchAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportDispatchAssignmentsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportDispatchAssignments`.
message ExportDispatchAssignmentsResponse {
  DispatchAssignment dispatch_assignment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeDispatchAssignments`.
message SummarizeDispatchAssignmentsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dispatch_assignment_id = 2;
  SummarizeDispatchAssignmentsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeDispatchAssignments`.
message SummarizeDispatchAssignmentsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekDispatchAssignment`.
message PeekDispatchAssignmentRequest {
  acme.common.v1.RequestContext context = 1;
  string dispatch_assignment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekDispatchAssignment`.
message PeekDispatchAssignmentResponse {
  DispatchAssignment dispatch_assignment = 1;
  acme.common.v1.OperationResult result = 2;
}
