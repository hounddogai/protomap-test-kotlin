syntax = "proto3";

package acme.dispatch.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/dispatch/v1/dispatch.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Dispatch.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/dispatch/v1;dispatchv1";
option java_multiple_files = true;
option java_outer_classname = "ZoneApprovalServiceProto";
option java_package = "com.acme.dispatch.v1";

// Routes zones through approval, with escalation and delegation.
service ZoneApprovalService {
  // Submits a zone.
  rpc SubmitZone(SubmitZoneRequest) returns (SubmitZoneResponse);

  // Approves a zone.
  rpc ApproveZone(ApproveZoneRequest) returns (ApproveZoneResponse);

  // Escalates a zone.
  rpc EscalateZone(EscalateZoneRequest) returns (EscalateZoneResponse);

  // Lists zones a page at a time.
  rpc ListPendingZones(ListPendingZonesRequest) returns (ListPendingZonesResponse);

  // Recalls a zone.
  rpc RecallZone(RecallZoneRequest) returns (RecallZoneResponse);

  // Returns a zone.
  rpc GetZoneApprovalStatus(GetZoneApprovalStatusRequest) returns (GetZoneApprovalStatusResponse);

  // Comments a zone.
  rpc CommentZoneApproval(CommentZoneApprovalRequest) returns (CommentZoneApprovalResponse);
}

// The request of `SubmitZone`.
message SubmitZoneRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string zone_id = 2;
  Zone zone = 3;
  SubmitZoneRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitZone`.
message SubmitZoneResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Zone zone = 1;
  SubmitZoneResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

