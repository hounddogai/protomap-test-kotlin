syntax = "proto3";

package acme.dispatch.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/dispatch/v1/dispatch.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Dispatch.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/dispatch/v1;dispatchv1";
option java_multiple_files = true;
option java_outer_classname = "ZoneValidationServiceProto";
option java_package = "com.acme.dispatch.v1";

// Checks zones against the rules before anything acts on them.
service ZoneValidationService {
  // Validates a zone.
  rpc ValidateZone(ValidateZoneRequest) returns (ValidateZoneResponse);

  // Previews a zone.
  rpc PreviewZone(PreviewZoneRequest) returns (PreviewZoneResponse);

  // Checks a zone.
  rpc CheckZoneEligibility(CheckZoneEligibilityRequest) returns (CheckZoneEligibilityResponse);

  // Normalizes a zone.
  rpc NormalizeZone(NormalizeZoneRequest) returns (NormalizeZoneResponse);

  // Explains a zone.
  rpc ExplainZoneDecision(ExplainZoneDecisionRequest) returns (ExplainZoneDecisionResponse);

  // Scores a zone.
  rpc ScoreZone(ScoreZoneRequest) returns (ScoreZoneResponse);

  // Lints a zone.
  rpc LintZones(LintZonesRequest) returns (LintZonesResponse);

  // Returns a zone.
  rpc GetZoneRules(GetZoneRulesRequest) returns (GetZoneRulesResponse);
}

// The request of `ValidateZone`.
message ValidateZoneRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string zone_id = 2;
  Zone zone = 3;
  ValidateZoneRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateZone`.
message ValidateZoneResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Zone zone = 1;
  ValidateZoneResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

