syntax = "proto3";

package acme.dispatch.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/dispatch/v1/dispatch.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Dispatch.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/dispatch/v1;dispatchv1";
option java_multiple_files = true;
option java_outer_classname = "DispatchOrderValidationServiceProto";
option java_package = "com.acme.dispatch.v1";

// Checks dispatch orders against the rules before anything acts on them.
service DispatchOrderValidationService {
  // Validates a dispatch order.
  rpc ValidateDispatchOrder(ValidateDispatchOrderRequest) returns (ValidateDispatchOrderResponse);

  // Previews a dispatch order.
  rpc PreviewDispatchOrder(PreviewDispatchOrderRequest) returns (PreviewDispatchOrderResponse);

  // Checks a dispatch order.
  rpc CheckDispatchOrderEligibility(CheckDispatchOrderEligibilityRequest) returns (CheckDispatchOrderEligibilityResponse);

  // Normalizes a dispatch order.
  rpc NormalizeDispatchOrder(NormalizeDispatchOrderRequest) returns (NormalizeDispatchOrderResponse);

  // Explains a dispatch order.
  rpc ExplainDispatchOrderDecision(ExplainDispatchOrderDecisionRequest) returns (ExplainDispatchOrderDecisionResponse);

  // Scores a dispatch order.
  rpc ScoreDispatchOrder(ScoreDispatchOrderRequest) returns (ScoreDispatchOrderResponse);

  // Lints a dispatch order.
  rpc LintDispatchOrders(LintDispatchOrdersRequest) returns (LintDispatchOrdersResponse);

  // Returns a dispatch order.
  rpc GetDispatchOrderRules(GetDispatchOrderRulesRequest) returns (GetDispatchOrderRulesResponse);
}

// The request of `ValidateDispatchOrder`.
message ValidateDispatchOrderRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dispatch_order_id = 2;
  DispatchOrder dispatch_order = 3;
  ValidateDispatchOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDispatchOrder`.
message ValidateDispatchOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DispatchOrder dispatch_order = 1;
  ValidateDispatchOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

