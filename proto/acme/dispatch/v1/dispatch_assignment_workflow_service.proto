option csharp_namespace = "Acme.Dispatch.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/dispatch/v1;dispatchv1";
option java_multiple_files = true;
option java_outer_classname = "DispatchAssignmentWorkflowServiceProto";
option java_package = "com.acme.dispatch.v1";

// Runs the long-lived workflow that takes a dispatch assignment from start to finish.
service DispatchAssignmentWorkflowService {
  // Starts a dispatch assignment.
  rpc StartDispatchAssignmentWorkflow(StartDispatchAssignmentWorkflowRequest) returns (StartDispatchAssignmentWorkflowResponse);

  // Advances a dispatch assignment.
  rpc AdvanceDispatchAssignmentWorkflow(AdvanceDispatchAssignmentWorkflowRequest) returns (AdvanceDispatchAssignmentWorkflowResponse);

  // Cancels a dispatch assignment.
  rpc CancelDispatchAssignmentWorkflow(CancelDispatchAssignmentWorkflowRequest) returns (CancelDispatchAssignmentWorkflowResponse);

  // Retrys a dispatch assignment.
  rpc RetryDispatchAssignmentWorkflow(RetryDispatchAssignmentWorkflowRequest) returns (RetryDispatchAssignmentWorkflowResponse);

  // Resumes a dispatch assignment.
  rpc ResumeDispatchAssignmentWorkflow(ResumeDispatchAssignmentWorkflowRequest) returns (ResumeDispatchAssignmentWorkflowResponse);

  // Returns a dispatch assignment.
  rpc InspectDispatchAssignmentWorkflow(InspectDispatchAssignmentWorkflowRequest) returns (InspectDispatchAssignmentWorkflowResponse);

  // Lists dispatch assignments a page at a time.
  rpc ListDispatchAssignmentWorkflows(ListDispatchAssignmentWorkflowsRequest) returns (ListDispatchAssignmentWorkflowsResponse);

  // Signals a dispatch assignment.
  rpc SignalDispatchAssignmentWorkflow(SignalDispatchAssignmentWorkflowRequest) returns (SignalDispatchAssignmentWorkflowResponse);
}

// The request of `StartDispatchAssignmentWorkflow`.
message StartDispatchAssignmentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dispatch_assignment_id = 2;
  DispatchAssignment dispatch_assignment = 3;
  StartDispatchAssignmentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDispatchAssignmentWorkflow`.
message StartDispatchAssignmentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DispatchAssignment dispatch_assignment = 1;
  StartDispatchAssignmentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

