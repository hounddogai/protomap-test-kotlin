syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverLicenseCalculationServiceProto";
option java_package = "com.acme.drivers.v1";

// Computes the figures of a driver license, such as totals, taxes, and estimates.
service DriverLicenseCalculationService {
  // Calculates a driver license.
  rpc CalculateDriverLicense(CalculateDriverLicenseRequest) returns (CalculateDriverLicenseResponse);

  // Estimates a driver license.
  rpc EstimateDriverLicense(EstimateDriverLicenseRequest) returns (EstimateDriverLicenseResponse);

  // Quotes a driver license.
  rpc QuoteDriverLicense(QuoteDriverLicenseRequest) returns (QuoteDriverLicenseResponse);

  // Compares a driver license.
  rpc CompareDriverLicenseOptions(CompareDriverLicenseOptionsRequest) returns (CompareDriverLicenseOptionsResponse);

  // Recalculates a driver license.
  rpc RecalculateDriverLicenses(RecalculateDriverLicensesRequest) returns (RecalculateDriverLicensesResponse);

  // Simulates a driver license.
  rpc SimulateDriverLicense(SimulateDriverLicenseRequest) returns (SimulateDriverLicenseResponse);

  // Explains a driver license.
  rpc ExplainDriverLicenseCalculation(ExplainDriverLicenseCalculationRequest) returns (ExplainDriverLicenseCalculationResponse);

  // Returns a driver license.
  rpc GetDriverLicenseRates(GetDriverLicenseRatesRequest) returns (GetDriverLicenseRatesResponse);
}

// The request of `CalculateDriverLicense`.
message CalculateDriverLicenseRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_license_id = 2;
  DriverLicense driver_license = 3;
  CalculateDriverLicenseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDriverLicense`.
message CalculateDriverLicenseResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDriverLicenseResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  DriverLicense driver_license = 1;
  CalculateDriverLicenseResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

