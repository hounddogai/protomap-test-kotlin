  }

  DriverLicense driver_license = 1;
  ExplainDriverLicenseCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDriverLicenseRates`.
message GetDriverLicenseRatesRequest {
