syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/drivers/v1/drivers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverLifecycleServiceProto";
option java_package = "com.acme.drivers.v1";

// Moves a driver between the states of its lifecycle.
service DriverLifecycleService {
  // Activates a driver.
  rpc ActivateDriver(ActivateDriverRequest) returns (ActivateDriverResponse);

  // Suspends a driver.
  rpc SuspendDriver(SuspendDriverRequest) returns (SuspendDriverResponse);

  // Terminates a driver.
  rpc TerminateDriver(TerminateDriverRequest) returns (TerminateDriverResponse);

  // Renews a driver.
  rpc RenewDriver(RenewDriverRequest) returns (RenewDriverResponse);

  // Expires a driver.
  rpc ExpireDriver(ExpireDriverRequest) returns (ExpireDriverResponse);

  // Returns a driver.
  rpc GetDriverLifecycle(GetDriverLifecycleRequest) returns (GetDriverLifecycleResponse);

  // Schedules a driver.
  rpc ScheduleDriverExpiry(ScheduleDriverExpiryRequest) returns (ScheduleDriverExpiryResponse);
}

// The request of `ActivateDriver`.
message ActivateDriverRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_id = 2;
  ActivateDriverRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateDriver`.
message ActivateDriverResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Driver driver = 1;
  ActivateDriverResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

