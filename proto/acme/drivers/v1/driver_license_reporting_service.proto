syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverLicenseReportingServiceProto";
option java_package = "com.acme.drivers.v1";

// Builds and schedules reports about driver licenses.
service DriverLicenseReportingService {
  // Generates a driver license.
  rpc GenerateDriverLicenseReport(GenerateDriverLicenseReportRequest) returns (GenerateDriverLicenseReportResponse);

  // Returns a driver license.
  rpc FetchDriverLicenseReport(FetchDriverLicenseReportRequest) returns (FetchDriverLicenseReportResponse);

  // Streams the changes of driver licenses as they happen.
  rpc StreamDriverLicenseMetrics(StreamDriverLicenseMetricsRequest) returns (stream StreamDriverLicenseMetricsResponse);

  // Lists driver licenses a page at a time.
  rpc ListDriverLicenseReports(ListDriverLicenseReportsRequest) returns (ListDriverLicenseReportsResponse);

  // Shares a driver license.
  rpc ShareDriverLicenseReport(ShareDriverLicenseReportRequest) returns (ShareDriverLicenseReportResponse);

  // Counts driver licenses by status.
  rpc CountDriverLicenseTotals(CountDriverLicenseTotalsRequest) returns (CountDriverLicenseTotalsResponse);
}

// The request of `GenerateDriverLicenseReport`.
message GenerateDriverLicenseReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_license_id = 2;
  GenerateDriverLicenseReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateDriverLicenseReport`.
message GenerateDriverLicenseReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchDriverLicenseReport`.
message FetchDriverLicenseReportRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_license_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchDriverLicenseReport`.
message FetchDriverLicenseReportResponse {
  DriverLicense driver_license = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamDriverLicenseMetrics`.
message StreamDriverLicenseMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverLicenseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDriverLicenseMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDriverLicenseMetrics`.
message StreamDriverLicenseMetricsResponse {
  DriverLicense driver_license = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListDriverLicenseReports`.
message ListDriverLicenseReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverLicenseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDriverLicenseReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDriverLicenseReports`.
message ListDriverLicenseReportsResponse {
  repeated DriverLicense driver_licenses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDriverLicenseReport`.
message ShareDriverLicenseReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_license_id = 2;
  ShareDriverLicenseReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDriverLicenseReport`.
message ShareDriverLicenseReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverLicense driver_license = 1;
  ShareDriverLicenseReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDriverLicenseTotals`.
message CountDriverLicenseTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverLicenseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDriverLicenseTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDriverLicenseTotals`.
message CountDriverLicenseTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
