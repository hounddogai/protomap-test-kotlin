syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverLicenseQueryServiceProto";
option java_package = "com.acme.drivers.v1";

// Answers read-only questions about driver licenses, for screens and reports.
service DriverLicenseQueryService {
  // Returns a driver license.
  rpc LookupDriverLicense(LookupDriverLicenseRequest) returns (LookupDriverLicenseResponse);

  // Lists driver licenses a page at a time.
  rpc BrowseDriverLicenses(BrowseDriverLicensesRequest) returns (BrowseDriverLicensesResponse);

  // Lists driver licenses a page at a time.
  rpc FindDriverLicenses(FindDriverLicensesRequest) returns (FindDriverLicensesResponse);

  // Streams every matching driver license.
  rpc ExportDriverLicenses(ExportDriverLicensesRequest) returns (stream ExportDriverLicensesResponse);

  // Summarizes a driver license.
  rpc SummarizeDriverLicenses(SummarizeDriverLicensesRequest) returns (SummarizeDriverLicensesResponse);

  // Lists driver licenses a page at a time.
  rpc SuggestDriverLicenses(SuggestDriverLicensesRequest) returns (SuggestDriverLicensesResponse);
}

// The request of `LookupDriverLicense`.
message LookupDriverLicenseRequest {
  acme.common.v1.RequestContext context = 1;
  string driver_license_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupDriverLicense`.
message LookupDriverLicenseResponse {
  DriverLicense driver_license = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseDriverLicenses`.
message BrowseDriverLicensesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverLicenseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseDriverLicensesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseDriverLicenses`.
message BrowseDriverLicensesResponse {
  repeated DriverLicense driver_licenses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindDriverLicenses`.
message FindDriverLicensesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverLicenseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindDriverLicensesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindDriverLicenses`.
message FindDriverLicensesResponse {
  repeated DriverLicense driver_licenses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportDriverLicenses`.
message ExportDriverLicensesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverLicenseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportDriverLicensesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportDriverLicenses`.
message ExportDriverLicensesResponse {
  DriverLicense driver_license = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeDriverLicenses`.
message SummarizeDriverLicensesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_license_id = 2;
  SummarizeDriverLicensesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeDriverLicenses`.
message SummarizeDriverLicensesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestDriverLicenses`.
message SuggestDriverLicensesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DriverLicenseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestDriverLicensesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestDriverLicenses`.
message SuggestDriverLicensesResponse {
  repeated DriverLicense driver_licenses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
