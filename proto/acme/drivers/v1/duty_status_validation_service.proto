syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DutyStatusValidationServiceProto";
option java_package = "com.acme.drivers.v1";

// Checks duty statuses against the rules before anything acts on them.
service DutyStatusValidationService {
  // Validates a duty status.
  rpc ValidateDutyStatus(ValidateDutyStatusRequest) returns (ValidateDutyStatusResponse);

  // Previews a duty status.
  rpc PreviewDutyStatus(PreviewDutyStatusRequest) returns (PreviewDutyStatusResponse);

  // Normalizes a duty status.
  rpc NormalizeDutyStatus(NormalizeDutyStatusRequest) returns (NormalizeDutyStatusResponse);

  // Explains a duty status.
  rpc ExplainDutyStatusDecision(ExplainDutyStatusDecisionRequest) returns (ExplainDutyStatusDecisionResponse);

  // Scores a duty status.
  rpc ScoreDutyStatus(ScoreDutyStatusRequest) returns (ScoreDutyStatusResponse);

  // Returns a duty status.
  rpc GetDutyStatusRules(GetDutyStatusRulesRequest) returns (GetDutyStatusRulesResponse);
}

// The request of `ValidateDutyStatus`.
message ValidateDutyStatusRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string duty_status_id = 2;
  DutyStatus duty_status = 3;
  ValidateDutyStatusRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDutyStatus`.
message ValidateDutyStatusResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DutyStatus duty_status = 1;
  ValidateDutyStatusResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

