syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DutyStatusReportingServiceProto";
option java_package = "com.acme.drivers.v1";

// Builds and schedules reports about duty statuses.
service DutyStatusReportingService {
  // Generates a duty status.
  rpc GenerateDutyStatusReport(GenerateDutyStatusReportRequest) returns (GenerateDutyStatusReportResponse);

  // Returns a duty status.
  rpc FetchDutyStatusReport(FetchDutyStatusReportRequest) returns (FetchDutyStatusReportResponse);

  // Schedules a duty status.
  rpc ScheduleDutyStatusReport(ScheduleDutyStatusReportRequest) returns (ScheduleDutyStatusReportResponse);

  // Streams the changes of duty statuses as they happen.
  rpc StreamDutyStatusMetrics(StreamDutyStatusMetricsRequest) returns (stream StreamDutyStatusMetricsResponse);

  // Lists duty statuses a page at a time.
  rpc ListDutyStatusReports(ListDutyStatusReportsRequest) returns (ListDutyStatusReportsResponse);

  // Shares a duty status.
  rpc ShareDutyStatusReport(ShareDutyStatusReportRequest) returns (ShareDutyStatusReportResponse);

  // Counts duty statuses by status.
  rpc CountDutyStatusTotals(CountDutyStatusTotalsRequest) returns (CountDutyStatusTotalsResponse);

  // Deletes a duty status.
  rpc DeleteDutyStatusReport(DeleteDutyStatusReportRequest) returns (DeleteDutyStatusReportResponse);
}

// The request of `GenerateDutyStatusReport`.
message GenerateDutyStatusReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string duty_status_id = 2;
  GenerateDutyStatusReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateDutyStatusReport`.
message GenerateDutyStatusReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchDutyStatusReport`.
message FetchDutyStatusReportRequest {
  acme.common.v1.RequestContext context = 1;
  string duty_status_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchDutyStatusReport`.
message FetchDutyStatusReportResponse {
  DutyStatus duty_status = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleDutyStatusReport`.
message ScheduleDutyStatusReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string duty_status_id = 2;
  ScheduleDutyStatusReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDutyStatusReport`.
message ScheduleDutyStatusReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamDutyStatusMetrics`.
message StreamDutyStatusMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DutyStatusStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDutyStatusMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDutyStatusMetrics`.
message StreamDutyStatusMetricsResponse {
  DutyStatus duty_status = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListDutyStatusReports`.
message ListDutyStatusReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DutyStatusStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDutyStatusReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDutyStatusReports`.
message ListDutyStatusReportsResponse {
  repeated DutyStatus duty_statuses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDutyStatusReport`.
message ShareDutyStatusReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string duty_status_id = 2;
  ShareDutyStatusReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDutyStatusReport`.
message ShareDutyStatusReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DutyStatus duty_status = 1;
  ShareDutyStatusReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDutyStatusTotals`.
message CountDutyStatusTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DutyStatusStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDutyStatusTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDutyStatusTotals`.
message CountDutyStatusTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteDutyStatusReport`.
message DeleteDutyStatusReportRequest {
  acme.common.v1.RequestContext context = 1;
  string duty_status_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteDutyStatusReport`.
message DeleteDutyStatusReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
