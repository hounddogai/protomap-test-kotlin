syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverWorkflowServiceProto";
option java_package = "com.acme.drivers.v1";

// Runs the long-lived workflow that takes a driver from start to finish.
service DriverWorkflowService {
  // Starts a driver.
  rpc StartDriverWorkflow(StartDriverWorkflowRequest) returns (StartDriverWorkflowResponse);

  // Advances a driver.
  rpc AdvanceDriverWorkflow(AdvanceDriverWorkflowRequest) returns (AdvanceDriverWorkflowResponse);

  // Cancels a driver.
  rpc CancelDriverWorkflow(CancelDriverWorkflowRequest) returns (CancelDriverWorkflowResponse);

  // Retrys a driver.
  rpc RetryDriverWorkflow(RetryDriverWorkflowRequest) returns (RetryDriverWorkflowResponse);

  // Pauses a driver.
  rpc PauseDriverWorkflow(PauseDriverWorkflowRequest) returns (PauseDriverWorkflowResponse);

  // Resumes a driver.
  rpc ResumeDriverWorkflow(ResumeDriverWorkflowRequest) returns (ResumeDriverWorkflowResponse);

  // Returns a driver.
  rpc InspectDriverWorkflow(InspectDriverWorkflowRequest) returns (InspectDriverWorkflowResponse);

  // Lists drivers a page at a time.
  rpc ListDriverWorkflows(ListDriverWorkflowsRequest) returns (ListDriverWorkflowsResponse);

  // Signals a driver.
  rpc SignalDriverWorkflow(SignalDriverWorkflowRequest) returns (SignalDriverWorkflowResponse);
}

// The request of `StartDriverWorkflow`.
message StartDriverWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_id = 2;
  Driver driver = 3;
  StartDriverWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDriverWorkflow`.
message StartDriverWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Driver driver = 1;
  StartDriverWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

