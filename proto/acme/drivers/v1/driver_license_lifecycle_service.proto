syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/drivers/v1/drivers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverLicenseLifecycleServiceProto";
option java_package = "com.acme.drivers.v1";

// Moves a driver license between the states of its lifecycle.
service DriverLicenseLifecycleService {
  // Activates a driver license.
  rpc ActivateDriverLicense(ActivateDriverLicenseRequest) returns (ActivateDriverLicenseResponse);

  // Suspends a driver license.
  rpc SuspendDriverLicense(SuspendDriverLicenseRequest) returns (SuspendDriverLicenseResponse);

  // Reinstates a driver license.
  rpc ReinstateDriverLicense(ReinstateDriverLicenseRequest) returns (ReinstateDriverLicenseResponse);

  // Terminates a driver license.
  rpc TerminateDriverLicense(TerminateDriverLicenseRequest) returns (TerminateDriverLicenseResponse);

  // Renews a driver license.
  rpc RenewDriverLicense(RenewDriverLicenseRequest) returns (RenewDriverLicenseResponse);

  // Expires a driver license.
  rpc ExpireDriverLicense(ExpireDriverLicenseRequest) returns (ExpireDriverLicenseResponse);

  // Returns a driver license.
  rpc GetDriverLicenseLifecycle(GetDriverLicenseLifecycleRequest) returns (GetDriverLicenseLifecycleResponse);
}

// The request of `ActivateDriverLicense`.
message ActivateDriverLicenseRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_license_id = 2;
  ActivateDriverLicenseRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateDriverLicense`.
message ActivateDriverLicenseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverLicense driver_license = 1;
  ActivateDriverLicenseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

