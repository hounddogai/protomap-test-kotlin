syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/drivers/v1/drivers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverApprovalServiceProto";
option java_package = "com.acme.drivers.v1";

// Routes drivers through approval, with escalation and delegation.
service DriverApprovalService {
  // Submits a driver.
  rpc SubmitDriver(SubmitDriverRequest) returns (SubmitDriverResponse);

  // Approves a driver.
  rpc ApproveDriver(ApproveDriverRequest) returns (ApproveDriverResponse);

  // Escalates a driver.
  rpc EscalateDriver(EscalateDriverRequest) returns (EscalateDriverResponse);

  // Lists drivers a page at a time.
  rpc ListPendingDrivers(ListPendingDriversRequest) returns (ListPendingDriversResponse);

  // Delegates a driver.
  rpc DelegateDriverApproval(DelegateDriverApprovalRequest) returns (DelegateDriverApprovalResponse);

  // Recalls a driver.
  rpc RecallDriver(RecallDriverRequest) returns (RecallDriverResponse);

  // Returns a driver.
  rpc GetDriverApprovalStatus(GetDriverApprovalStatusRequest) returns (GetDriverApprovalStatusResponse);
}

// The request of `SubmitDriver`.
message SubmitDriverRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_id = 2;
  Driver driver = 3;
  SubmitDriverRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDriver`.
message SubmitDriverResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Driver driver = 1;
  SubmitDriverResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

