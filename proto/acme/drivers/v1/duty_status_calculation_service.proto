syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DutyStatusCalculationServiceProto";
option java_package = "com.acme.drivers.v1";

// Computes the figures of a duty status, such as totals, taxes, and estimates.
service DutyStatusCalculationService {
  // Calculates a duty status.
  rpc CalculateDutyStatus(CalculateDutyStatusRequest) returns (CalculateDutyStatusResponse);

  // Estimates a duty status.
  rpc EstimateDutyStatus(EstimateDutyStatusRequest) returns (EstimateDutyStatusResponse);

  // Quotes a duty status.
  rpc QuoteDutyStatus(QuoteDutyStatusRequest) returns (QuoteDutyStatusResponse);

  // Compares a duty status.
  rpc CompareDutyStatusOptions(CompareDutyStatusOptionsRequest) returns (CompareDutyStatusOptionsResponse);

  // Recalculates a duty status.
  rpc RecalculateDutyStatuses(RecalculateDutyStatusesRequest) returns (RecalculateDutyStatusesResponse);

  // Simulates a duty status.
  rpc SimulateDutyStatus(SimulateDutyStatusRequest) returns (SimulateDutyStatusResponse);

  // Explains a duty status.
  rpc ExplainDutyStatusCalculation(ExplainDutyStatusCalculationRequest) returns (ExplainDutyStatusCalculationResponse);
}

// The request of `CalculateDutyStatus`.
message CalculateDutyStatusRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string duty_status_id = 2;
  DutyStatus duty_status = 3;
  CalculateDutyStatusRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDutyStatus`.
message CalculateDutyStatusResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDutyStatusResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  DutyStatus duty_status = 1;
  CalculateDutyStatusResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

