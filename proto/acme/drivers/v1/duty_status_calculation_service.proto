// The response of `ExplainDutyStatusCalculation`.
message ExplainDutyStatusCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DutyStatus duty_status = 1;
  ExplainDutyStatusCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
