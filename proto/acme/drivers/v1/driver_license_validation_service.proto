syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverLicenseValidationServiceProto";
option java_package = "com.acme.drivers.v1";

// Checks driver licenses against the rules before anything acts on them.
service DriverLicenseValidationService {
  // Validates a driver license.
  rpc ValidateDriverLicense(ValidateDriverLicenseRequest) returns (ValidateDriverLicenseResponse);

  // Previews a driver license.
  rpc PreviewDriverLicense(PreviewDriverLicenseRequest) returns (PreviewDriverLicenseResponse);

  // Checks a driver license.
  rpc CheckDriverLicenseEligibility(CheckDriverLicenseEligibilityRequest) returns (CheckDriverLicenseEligibilityResponse);

  // Normalizes a driver license.
  rpc NormalizeDriverLicense(NormalizeDriverLicenseRequest) returns (NormalizeDriverLicenseResponse);

  // Explains a driver license.
  rpc ExplainDriverLicenseDecision(ExplainDriverLicenseDecisionRequest) returns (ExplainDriverLicenseDecisionResponse);

  // Scores a driver license.
  rpc ScoreDriverLicense(ScoreDriverLicenseRequest) returns (ScoreDriverLicenseResponse);

  // Lints a driver license.
  rpc LintDriverLicenses(LintDriverLicensesRequest) returns (LintDriverLicensesResponse);

  // Returns a driver license.
  rpc GetDriverLicenseRules(GetDriverLicenseRulesRequest) returns (GetDriverLicenseRulesResponse);
}

// The request of `ValidateDriverLicense`.
message ValidateDriverLicenseRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_license_id = 2;
  DriverLicense driver_license = 3;
  ValidateDriverLicenseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDriverLicense`.
message ValidateDriverLicenseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverLicense driver_license = 1;
  ValidateDriverLicenseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

