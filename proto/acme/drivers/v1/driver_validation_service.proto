syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/drivers/v1/drivers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverValidationServiceProto";
option java_package = "com.acme.drivers.v1";

// Checks drivers against the rules before anything acts on them.
service DriverValidationService {
  // Validates a driver.
  rpc ValidateDriver(ValidateDriverRequest) returns (ValidateDriverResponse);

  // Previews a driver.
  rpc PreviewDriver(PreviewDriverRequest) returns (PreviewDriverResponse);

  // Checks a driver.
  rpc CheckDriverEligibility(CheckDriverEligibilityRequest) returns (CheckDriverEligibilityResponse);

  // Normalizes a driver.
  rpc NormalizeDriver(NormalizeDriverRequest) returns (NormalizeDriverResponse);

  // Explains a driver.
  rpc ExplainDriverDecision(ExplainDriverDecisionRequest) returns (ExplainDriverDecisionResponse);

  // Scores a driver.
  rpc ScoreDriver(ScoreDriverRequest) returns (ScoreDriverResponse);

  // Lints a driver.
  rpc LintDrivers(LintDriversRequest) returns (LintDriversResponse);

  // Returns a driver.
  rpc GetDriverRules(GetDriverRulesRequest) returns (GetDriverRulesResponse);
}

// The request of `ValidateDriver`.
message ValidateDriverRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_id = 2;
  Driver driver = 3;
  ValidateDriverRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDriver`.
message ValidateDriverResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Driver driver = 1;
  ValidateDriverResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

