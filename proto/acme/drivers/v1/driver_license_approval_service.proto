syntax = "proto3";

package acme.drivers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/drivers/v1/drivers.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DriverLicenseApprovalServiceProto";
option java_package = "com.acme.drivers.v1";

// Routes driver licenses through approval, with escalation and delegation.
service DriverLicenseApprovalService {
  // Submits a driver license.
  rpc SubmitDriverLicense(SubmitDriverLicenseRequest) returns (SubmitDriverLicenseResponse);

  // Approves a driver license.
  rpc ApproveDriverLicense(ApproveDriverLicenseRequest) returns (ApproveDriverLicenseResponse);

  // Rejects a driver license.
  rpc RejectDriverLicense(RejectDriverLicenseRequest) returns (RejectDriverLicenseResponse);

  // Escalates a driver license.
  rpc EscalateDriverLicense(EscalateDriverLicenseRequest) returns (EscalateDriverLicenseResponse);

  // Lists driver licenses a page at a time.
  rpc ListPendingDriverLicenses(ListPendingDriverLicensesRequest) returns (ListPendingDriverLicensesResponse);

  // Delegates a driver license.
  rpc DelegateDriverLicenseApproval(DelegateDriverLicenseApprovalRequest) returns (DelegateDriverLicenseApprovalResponse);

  // Recalls a driver license.
  rpc RecallDriverLicense(RecallDriverLicenseRequest) returns (RecallDriverLicenseResponse);

  // Returns a driver license.
  rpc GetDriverLicenseApprovalStatus(GetDriverLicenseApprovalStatusRequest) returns (GetDriverLicenseApprovalStatusResponse);

  // Comments a driver license.
  rpc CommentDriverLicenseApproval(CommentDriverLicenseApprovalRequest) returns (CommentDriverLicenseApprovalResponse);
}

// The request of `SubmitDriverLicense`.
message SubmitDriverLicenseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string driver_license_id = 2;
  DriverLicense driver_license = 3;
  SubmitDriverLicenseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDriverLicense`.
message SubmitDriverLicenseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DriverLicense driver_license = 1;
  SubmitDriverLicenseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

