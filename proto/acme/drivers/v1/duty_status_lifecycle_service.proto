import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Drivers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/drivers/v1;driversv1";
option java_multiple_files = true;
option java_outer_classname = "DutyStatusLifecycleServiceProto";
option java_package = "com.acme.drivers.v1";

// Moves a duty status between the states of its lifecycle.
service DutyStatusLifecycleService {
  // Activates a duty status.
  rpc ActivateDutyStatus(ActivateDutyStatusRequest) returns (ActivateDutyStatusResponse);

  // Suspends a duty status.
  rpc SuspendDutyStatus(SuspendDutyStatusRequest) returns (SuspendDutyStatusResponse);

  // Reinstates a duty status.
  rpc ReinstateDutyStatus(ReinstateDutyStatusRequest) returns (ReinstateDutyStatusResponse);

  // Terminates a duty status.
  rpc TerminateDutyStatus(TerminateDutyStatusRequest) returns (TerminateDutyStatusResponse);

  // Renews a duty status.
  rpc RenewDutyStatus(RenewDutyStatusRequest) returns (RenewDutyStatusResponse);

  // Expires a duty status.
  rpc ExpireDutyStatus(ExpireDutyStatusRequest) returns (ExpireDutyStatusResponse);

  // Returns a duty status.
  rpc GetDutyStatusLifecycle(GetDutyStatusLifecycleRequest) returns (GetDutyStatusLifecycleResponse);

  // Schedules a duty status.
  rpc ScheduleDutyStatusExpiry(ScheduleDutyStatusExpiryRequest) returns (ScheduleDutyStatusExpiryResponse);
}

// The request of `ActivateDutyStatus`.
message ActivateDutyStatusRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string duty_status_id = 2;
  ActivateDutyStatusRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateDutyStatus`.
message ActivateDutyStatusResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DutyStatus duty_status = 1;
  ActivateDutyStatusResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

