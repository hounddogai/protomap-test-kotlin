syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelTransactionWorkflowServiceProto";
option java_package = "com.acme.fuel.v1";

// Runs the long-lived workflow that takes a fuel transaction from start to finish.
service FuelTransactionWorkflowService {
  // Starts a fuel transaction.
  rpc StartFuelTransactionWorkflow(StartFuelTransactionWorkflowRequest) returns (StartFuelTransactionWorkflowResponse);

  // Advances a fuel transaction.
  rpc AdvanceFuelTransactionWorkflow(AdvanceFuelTransactionWorkflowRequest) returns (AdvanceFuelTransactionWorkflowResponse);

  // Cancels a fuel transaction.
  rpc CancelFuelTransactionWorkflow(CancelFuelTransactionWorkflowRequest) returns (CancelFuelTransactionWorkflowResponse);

  // Retrys a fuel transaction.
  rpc RetryFuelTransactionWorkflow(RetryFuelTransactionWorkflowRequest) returns (RetryFuelTransactionWorkflowResponse);

  // Pauses a fuel transaction.
  rpc PauseFuelTransactionWorkflow(PauseFuelTransactionWorkflowRequest) returns (PauseFuelTransactionWorkflowResponse);

  // Resumes a fuel transaction.
  rpc ResumeFuelTransactionWorkflow(ResumeFuelTransactionWorkflowRequest) returns (ResumeFuelTransactionWorkflowResponse);

  // Returns a fuel transaction.
  rpc InspectFuelTransactionWorkflow(InspectFuelTransactionWorkflowRequest) returns (InspectFuelTransactionWorkflowResponse);

  // Lists fuel transactions a page at a time.
  rpc ListFuelTransactionWorkflows(ListFuelTransactionWorkflowsRequest) returns (ListFuelTransactionWorkflowsResponse);

  // Signals a fuel transaction.
  rpc SignalFuelTransactionWorkflow(SignalFuelTransactionWorkflowRequest) returns (SignalFuelTransactionWorkflowResponse);
}

// The request of `StartFuelTransactionWorkflow`.
message StartFuelTransactionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  StartFuelTransactionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFuelTransactionWorkflow`.
message StartFuelTransactionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  StartFuelTransactionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

