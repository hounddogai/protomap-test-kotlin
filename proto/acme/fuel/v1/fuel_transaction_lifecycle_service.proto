syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelTransactionLifecycleServiceProto";
option java_package = "com.acme.fuel.v1";

// Moves a fuel transaction between the states of its lifecycle.
service FuelTransactionLifecycleService {
  // Activates a fuel transaction.
  rpc ActivateFuelTransaction(ActivateFuelTransactionRequest) returns (ActivateFuelTransactionResponse);

  // Suspends a fuel transaction.
  rpc SuspendFuelTransaction(SuspendFuelTransactionRequest) returns (SuspendFuelTransactionResponse);

  // Reinstates a fuel transaction.
  rpc ReinstateFuelTransaction(ReinstateFuelTransactionRequest) returns (ReinstateFuelTransactionResponse);

  // Terminates a fuel transaction.
  rpc TerminateFuelTransaction(TerminateFuelTransactionRequest) returns (TerminateFuelTransactionResponse);

  // Renews a fuel transaction.
  rpc RenewFuelTransaction(RenewFuelTransactionRequest) returns (RenewFuelTransactionResponse);

  // Expires a fuel transaction.
  rpc ExpireFuelTransaction(ExpireFuelTransactionRequest) returns (ExpireFuelTransactionResponse);

  // Returns a fuel transaction.
  rpc GetFuelTransactionLifecycle(GetFuelTransactionLifecycleRequest) returns (GetFuelTransactionLifecycleResponse);

  // Schedules a fuel transaction.
  rpc ScheduleFuelTransactionExpiry(ScheduleFuelTransactionExpiryRequest) returns (ScheduleFuelTransactionExpiryResponse);
}

// The request of `ActivateFuelTransaction`.
message ActivateFuelTransactionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  ActivateFuelTransactionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateFuelTransaction`.
message ActivateFuelTransactionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  ActivateFuelTransactionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

