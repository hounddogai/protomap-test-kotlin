syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelTransactionSyncServiceProto";
option java_package = "com.acme.fuel.v1";

// Keeps fuel transactions in step with the systems of record in other regions.
service FuelTransactionSyncService {
  // Syncs a fuel transaction.
  rpc SyncFuelTransactions(SyncFuelTransactionsRequest) returns (SyncFuelTransactionsResponse);

  // Pushs a fuel transaction.
  rpc PushFuelTransaction(PushFuelTransactionRequest) returns (PushFuelTransactionResponse);

  // Pulls a fuel transaction.
  rpc PullFuelTransactions(PullFuelTransactionsRequest) returns (PullFuelTransactionsResponse);

  // Reconciles a fuel transaction.
  rpc ReconcileFuelTransactions(ReconcileFuelTransactionsRequest) returns (ReconcileFuelTransactionsResponse);

  // Exchanges changes of fuel transactions with a peer.
  rpc StreamFuelTransactionChanges(stream StreamFuelTransactionChangesRequest) returns (stream StreamFuelTransactionChangesResponse);

  // Resolves a fuel transaction.
  rpc ResolveFuelTransactionConflict(ResolveFuelTransactionConflictRequest) returns (ResolveFuelTransactionConflictResponse);

  // Lists fuel transactions a page at a time.
  rpc ListFuelTransactionConflicts(ListFuelTransactionConflictsRequest) returns (ListFuelTransactionConflictsResponse);
}

// The request of `SyncFuelTransactions`.
message SyncFuelTransactionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  SyncFuelTransactionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncFuelTransactions`.
message SyncFuelTransactionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  SyncFuelTransactionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushFuelTransaction`.
message PushFuelTransactionRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  PushFuelTransactionRequest.Details details = 4;
