    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  ResolveFuelTransactionConflictRequest.Details details = 4;
