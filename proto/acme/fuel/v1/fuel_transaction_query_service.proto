syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelTransactionQueryServiceProto";
option java_package = "com.acme.fuel.v1";

// Answers read-only questions about fuel transactions, for screens and reports.
service FuelTransactionQueryService {
  // Returns a fuel transaction.
  rpc LookupFuelTransaction(LookupFuelTransactionRequest) returns (LookupFuelTransactionResponse);

  // Lists fuel transactions a page at a time.
  rpc BrowseFuelTransactions(BrowseFuelTransactionsRequest) returns (BrowseFuelTransactionsResponse);

  // Lists fuel transactions a page at a time.
  rpc FindFuelTransactions(FindFuelTransactionsRequest) returns (FindFuelTransactionsResponse);

  // Counts fuel transactions by status.
  rpc CountFuelTransactions(CountFuelTransactionsRequest) returns (CountFuelTransactionsResponse);

  // Returns several fuel transactions at once.
  rpc ResolveFuelTransactions(ResolveFuelTransactionsRequest) returns (ResolveFuelTransactionsResponse);

  // Streams every matching fuel transaction.
  rpc ExportFuelTransactions(ExportFuelTransactionsRequest) returns (stream ExportFuelTransactionsResponse);

  // Summarizes a fuel transaction.
  rpc SummarizeFuelTransactions(SummarizeFuelTransactionsRequest) returns (SummarizeFuelTransactionsResponse);

  // Lists fuel transactions a page at a time.
  rpc SuggestFuelTransactions(SuggestFuelTransactionsRequest) returns (SuggestFuelTransactionsResponse);

  // Returns a fuel transaction.
  rpc PeekFuelTransaction(PeekFuelTransactionRequest) returns (PeekFuelTransactionResponse);
}

// The request of `LookupFuelTransaction`.
message LookupFuelTransactionRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupFuelTransaction`.
message LookupFuelTransactionResponse {
  FuelTransaction fuel_transaction = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseFuelTransactions`.
message BrowseFuelTransactionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelTransactionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseFuelTransactionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseFuelTransactions`.
message BrowseFuelTransactionsResponse {
  repeated FuelTransaction fuel_transactions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindFuelTransactions`.
message FindFuelTransactionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelTransactionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindFuelTransactionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindFuelTransactions`.
message FindFuelTransactionsResponse {
  repeated FuelTransaction fuel_transactions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFuelTransactions`.
message CountFuelTransactionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelTransactionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFuelTransactionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFuelTransactions`.
message CountFuelTransactionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveFuelTransactions`.
message ResolveFuelTransactionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string fuel_transaction_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveFuelTransactions`.
message ResolveFuelTransactionsResponse {
  repeated FuelTransaction fuel_transactions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportFuelTransactions`.
message ExportFuelTransactionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelTransactionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportFuelTransactionsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportFuelTransactions`.
message ExportFuelTransactionsResponse {
  FuelTransaction fuel_transaction = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeFuelTransactions`.
message SummarizeFuelTransactionsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  SummarizeFuelTransactionsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeFuelTransactions`.
message SummarizeFuelTransactionsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestFuelTransactions`.
message SuggestFuelTransactionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelTransactionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestFuelTransactionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestFuelTransactions`.
message SuggestFuelTransactionsResponse {
  repeated FuelTransaction fuel_transactions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekFuelTransaction`.
message PeekFuelTransactionRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekFuelTransaction`.
message PeekFuelTransactionResponse {
  FuelTransaction fuel_transaction = 1;
  acme.common.v1.OperationResult result = 2;
}
