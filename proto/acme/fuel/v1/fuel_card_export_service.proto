syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelCardExportServiceProto";
option java_package = "com.acme.fuel.v1";

// Exports fuel cards to files and other systems.
service FuelCardExportService {
  // Streams every matching fuel card.
  rpc StreamFuelCardExport(StreamFuelCardExportRequest) returns (stream StreamFuelCardExportResponse);

  // Returns a fuel card.
  rpc GetFuelCardExport(GetFuelCardExportRequest) returns (GetFuelCardExportResponse);

  // Cancels a fuel card.
  rpc CancelFuelCardExport(CancelFuelCardExportRequest) returns (CancelFuelCardExportResponse);

  // Lists fuel cards a page at a time.
  rpc ListFuelCardExports(ListFuelCardExportsRequest) returns (ListFuelCardExportsResponse);

  // Schedules a fuel card.
  rpc ScheduleFuelCardExport(ScheduleFuelCardExportRequest) returns (ScheduleFuelCardExportResponse);

  // Retrys a fuel card.
  rpc RetryFuelCardExport(RetryFuelCardExportRequest) returns (RetryFuelCardExportResponse);

  // Shares a fuel card.
  rpc ShareFuelCardExport(ShareFuelCardExportRequest) returns (ShareFuelCardExportResponse);
}

// The request of `StreamFuelCardExport`.
message StreamFuelCardExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFuelCardExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamFuelCardExport`.
message StreamFuelCardExportResponse {
  FuelCard fuel_card = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetFuelCardExport`.
message GetFuelCardExportRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFuelCardExport`.
message GetFuelCardExportResponse {
  FuelCard fuel_card = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelFuelCardExport`.
message CancelFuelCardExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  CancelFuelCardExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelFuelCardExport`.
message CancelFuelCardExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  CancelFuelCardExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFuelCardExports`.
message ListFuelCardExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFuelCardExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFuelCardExports`.
message ListFuelCardExportsResponse {
  repeated FuelCard fuel_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleFuelCardExport`.
message ScheduleFuelCardExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  ScheduleFuelCardExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleFuelCardExport`.
message ScheduleFuelCardExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryFuelCardExport`.
message RetryFuelCardExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  FuelCard fuel_card = 3;
  RetryFuelCardExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryFuelCardExport`.
message RetryFuelCardExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  RetryFuelCardExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareFuelCardExport`.
message ShareFuelCardExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  ShareFuelCardExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareFuelCardExport`.
message ShareFuelCardExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  ShareFuelCardExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
