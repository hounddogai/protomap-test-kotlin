syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelPolicyApprovalServiceProto";
option java_package = "com.acme.fuel.v1";

// Routes fuel policies through approval, with escalation and delegation.
service FuelPolicyApprovalService {
  // Submits a fuel policy.
  rpc SubmitFuelPolicy(SubmitFuelPolicyRequest) returns (SubmitFuelPolicyResponse);

  // Approves a fuel policy.
  rpc ApproveFuelPolicy(ApproveFuelPolicyRequest) returns (ApproveFuelPolicyResponse);

  // Rejects a fuel policy.
  rpc RejectFuelPolicy(RejectFuelPolicyRequest) returns (RejectFuelPolicyResponse);

  // Escalates a fuel policy.
  rpc EscalateFuelPolicy(EscalateFuelPolicyRequest) returns (EscalateFuelPolicyResponse);

  // Lists fuel policies a page at a time.
  rpc ListPendingFuelPolicies(ListPendingFuelPoliciesRequest) returns (ListPendingFuelPoliciesResponse);

  // Recalls a fuel policy.
  rpc RecallFuelPolicy(RecallFuelPolicyRequest) returns (RecallFuelPolicyResponse);

  // Comments a fuel policy.
  rpc CommentFuelPolicyApproval(CommentFuelPolicyApprovalRequest) returns (CommentFuelPolicyApprovalResponse);
}

// The request of `SubmitFuelPolicy`.
message SubmitFuelPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  FuelPolicy fuel_policy = 3;
  SubmitFuelPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFuelPolicy`.
message SubmitFuelPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  SubmitFuelPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

