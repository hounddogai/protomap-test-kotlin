syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelCardValidationServiceProto";
option java_package = "com.acme.fuel.v1";

// Checks fuel cards against the rules before anything acts on them.
service FuelCardValidationService {
  // Validates a fuel card.
  rpc ValidateFuelCard(ValidateFuelCardRequest) returns (ValidateFuelCardResponse);

  // Previews a fuel card.
  rpc PreviewFuelCard(PreviewFuelCardRequest) returns (PreviewFuelCardResponse);

  // Checks a fuel card.
  rpc CheckFuelCardEligibility(CheckFuelCardEligibilityRequest) returns (CheckFuelCardEligibilityResponse);

  // Normalizes a fuel card.
  rpc NormalizeFuelCard(NormalizeFuelCardRequest) returns (NormalizeFuelCardResponse);

  // Explains a fuel card.
  rpc ExplainFuelCardDecision(ExplainFuelCardDecisionRequest) returns (ExplainFuelCardDecisionResponse);

  // Scores a fuel card.
  rpc ScoreFuelCard(ScoreFuelCardRequest) returns (ScoreFuelCardResponse);

  // Lints a fuel card.
  rpc LintFuelCards(LintFuelCardsRequest) returns (LintFuelCardsResponse);

  // Returns a fuel card.
  rpc GetFuelCardRules(GetFuelCardRulesRequest) returns (GetFuelCardRulesResponse);
}

// The request of `ValidateFuelCard`.
message ValidateFuelCardRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  FuelCard fuel_card = 3;
  ValidateFuelCardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFuelCard`.
message ValidateFuelCardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  ValidateFuelCardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

