syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelTransactionApprovalServiceProto";
option java_package = "com.acme.fuel.v1";

// Routes fuel transactions through approval, with escalation and delegation.
service FuelTransactionApprovalService {
  // Submits a fuel transaction.
  rpc SubmitFuelTransaction(SubmitFuelTransactionRequest) returns (SubmitFuelTransactionResponse);

  // Approves a fuel transaction.
  rpc ApproveFuelTransaction(ApproveFuelTransactionRequest) returns (ApproveFuelTransactionResponse);

  // Escalates a fuel transaction.
  rpc EscalateFuelTransaction(EscalateFuelTransactionRequest) returns (EscalateFuelTransactionResponse);

  // Lists fuel transactions a page at a time.
  rpc ListPendingFuelTransactions(ListPendingFuelTransactionsRequest) returns (ListPendingFuelTransactionsResponse);

  // Delegates a fuel transaction.
  rpc DelegateFuelTransactionApproval(DelegateFuelTransactionApprovalRequest) returns (DelegateFuelTransactionApprovalResponse);

  // Recalls a fuel transaction.
  rpc RecallFuelTransaction(RecallFuelTransactionRequest) returns (RecallFuelTransactionResponse);

  // Returns a fuel transaction.
  rpc GetFuelTransactionApprovalStatus(GetFuelTransactionApprovalStatusRequest) returns (GetFuelTransactionApprovalStatusResponse);

  // Comments a fuel transaction.
  rpc CommentFuelTransactionApproval(CommentFuelTransactionApprovalRequest) returns (CommentFuelTransactionApprovalResponse);
}

// The request of `SubmitFuelTransaction`.
message SubmitFuelTransactionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  SubmitFuelTransactionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFuelTransaction`.
message SubmitFuelTransactionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  SubmitFuelTransactionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

