syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelPolicyLifecycleServiceProto";
option java_package = "com.acme.fuel.v1";

// Moves a fuel policy between the states of its lifecycle.
service FuelPolicyLifecycleService {
  // Activates a fuel policy.
  rpc ActivateFuelPolicy(ActivateFuelPolicyRequest) returns (ActivateFuelPolicyResponse);

  // Suspends a fuel policy.
  rpc SuspendFuelPolicy(SuspendFuelPolicyRequest) returns (SuspendFuelPolicyResponse);

  // Reinstates a fuel policy.
  rpc ReinstateFuelPolicy(ReinstateFuelPolicyRequest) returns (ReinstateFuelPolicyResponse);

  // Terminates a fuel policy.
  rpc TerminateFuelPolicy(TerminateFuelPolicyRequest) returns (TerminateFuelPolicyResponse);

  // Renews a fuel policy.
  rpc RenewFuelPolicy(RenewFuelPolicyRequest) returns (RenewFuelPolicyResponse);

  // Expires a fuel policy.
  rpc ExpireFuelPolicy(ExpireFuelPolicyRequest) returns (ExpireFuelPolicyResponse);

  // Returns a fuel policy.
  rpc GetFuelPolicyLifecycle(GetFuelPolicyLifecycleRequest) returns (GetFuelPolicyLifecycleResponse);

  // Schedules a fuel policy.
  rpc ScheduleFuelPolicyExpiry(ScheduleFuelPolicyExpiryRequest) returns (ScheduleFuelPolicyExpiryResponse);
}

// The request of `ActivateFuelPolicy`.
message ActivateFuelPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  ActivateFuelPolicyRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateFuelPolicy`.
message ActivateFuelPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  ActivateFuelPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

