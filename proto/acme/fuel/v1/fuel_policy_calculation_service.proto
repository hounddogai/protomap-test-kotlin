    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  ExplainFuelPolicyCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetFuelPolicyRates`.
message GetFuelPolicyRatesRequest {
