syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelPolicyValidationServiceProto";
option java_package = "com.acme.fuel.v1";

// Checks fuel policies against the rules before anything acts on them.
service FuelPolicyValidationService {
  // Validates a fuel policy.
  rpc ValidateFuelPolicy(ValidateFuelPolicyRequest) returns (ValidateFuelPolicyResponse);

  // Previews a fuel policy.
  rpc PreviewFuelPolicy(PreviewFuelPolicyRequest) returns (PreviewFuelPolicyResponse);

  // Normalizes a fuel policy.
  rpc NormalizeFuelPolicy(NormalizeFuelPolicyRequest) returns (NormalizeFuelPolicyResponse);

  // Explains a fuel policy.
  rpc ExplainFuelPolicyDecision(ExplainFuelPolicyDecisionRequest) returns (ExplainFuelPolicyDecisionResponse);

  // Scores a fuel policy.
  rpc ScoreFuelPolicy(ScoreFuelPolicyRequest) returns (ScoreFuelPolicyResponse);

  // Lints a fuel policy.
  rpc LintFuelPolicies(LintFuelPoliciesRequest) returns (LintFuelPoliciesResponse);

  // Returns a fuel policy.
  rpc GetFuelPolicyRules(GetFuelPolicyRulesRequest) returns (GetFuelPolicyRulesResponse);
}

// The request of `ValidateFuelPolicy`.
message ValidateFuelPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  FuelPolicy fuel_policy = 3;
  ValidateFuelPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFuelPolicy`.
message ValidateFuelPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  ValidateFuelPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

