syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelCardImportServiceProto";
option java_package = "com.acme.fuel.v1";

// Takes fuel cards in bulk from partners and legacy systems.
service FuelCardImportService {
  // Takes a stream of fuel cards and answers once at the end.
  rpc ImportFuelCards(stream ImportFuelCardsRequest) returns (ImportFuelCardsResponse);

  // Returns a fuel card.
  rpc GetFuelCardImportStatus(GetFuelCardImportStatusRequest) returns (GetFuelCardImportStatusResponse);

  // Cancels a fuel card.
  rpc CancelFuelCardImport(CancelFuelCardImportRequest) returns (CancelFuelCardImportResponse);

  // Validates a fuel card.
  rpc ValidateFuelCardImport(ValidateFuelCardImportRequest) returns (ValidateFuelCardImportResponse);

  // Lists fuel cards a page at a time.
  rpc ListFuelCardImports(ListFuelCardImportsRequest) returns (ListFuelCardImportsResponse);

  // Retrys a fuel card.
  rpc RetryFuelCardImport(RetryFuelCardImportRequest) returns (RetryFuelCardImportResponse);

  // Maps a fuel card.
  rpc MapFuelCardImportColumns(MapFuelCardImportColumnsRequest) returns (MapFuelCardImportColumnsResponse);
}

// The request of `ImportFuelCards`.
message ImportFuelCardsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportFuelCardsRequest.StreamHeader header = 2;
    FuelCard record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportFuelCards`.
message ImportFuelCardsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string fuel_card_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportFuelCardsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetFuelCardImportStatus`.
message GetFuelCardImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFuelCardImportStatus`.
message GetFuelCardImportStatusResponse {
  FuelCard fuel_card = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelFuelCardImport`.
message CancelFuelCardImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  CancelFuelCardImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelFuelCardImport`.
message CancelFuelCardImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  CancelFuelCardImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateFuelCardImport`.
message ValidateFuelCardImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  FuelCard fuel_card = 3;
  ValidateFuelCardImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFuelCardImport`.
message ValidateFuelCardImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  ValidateFuelCardImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFuelCardImports`.
message ListFuelCardImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFuelCardImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFuelCardImports`.
message ListFuelCardImportsResponse {
  repeated FuelCard fuel_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryFuelCardImport`.
message RetryFuelCardImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  FuelCard fuel_card = 3;
  RetryFuelCardImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryFuelCardImport`.
message RetryFuelCardImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  RetryFuelCardImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapFuelCardImportColumns`.
message MapFuelCardImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  FuelCard fuel_card = 3;
  MapFuelCardImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapFuelCardImportColumns`.
message MapFuelCardImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  MapFuelCardImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
