syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelCardReportingServiceProto";
option java_package = "com.acme.fuel.v1";

// Builds and schedules reports about fuel cards.
service FuelCardReportingService {
  // Generates a fuel card.
  rpc GenerateFuelCardReport(GenerateFuelCardReportRequest) returns (GenerateFuelCardReportResponse);

  // Returns a fuel card.
  rpc FetchFuelCardReport(FetchFuelCardReportRequest) returns (FetchFuelCardReportResponse);

  // Schedules a fuel card.
  rpc ScheduleFuelCardReport(ScheduleFuelCardReportRequest) returns (ScheduleFuelCardReportResponse);

  // Streams the changes of fuel cards as they happen.
  rpc StreamFuelCardMetrics(StreamFuelCardMetricsRequest) returns (stream StreamFuelCardMetricsResponse);

  // Lists fuel cards a page at a time.
  rpc ListFuelCardReports(ListFuelCardReportsRequest) returns (ListFuelCardReportsResponse);

  // Shares a fuel card.
  rpc ShareFuelCardReport(ShareFuelCardReportRequest) returns (ShareFuelCardReportResponse);

  // Counts fuel cards by status.
  rpc CountFuelCardTotals(CountFuelCardTotalsRequest) returns (CountFuelCardTotalsResponse);

  // Deletes a fuel card.
  rpc DeleteFuelCardReport(DeleteFuelCardReportRequest) returns (DeleteFuelCardReportResponse);
}

// The request of `GenerateFuelCardReport`.
message GenerateFuelCardReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  GenerateFuelCardReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateFuelCardReport`.
message GenerateFuelCardReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchFuelCardReport`.
message FetchFuelCardReportRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchFuelCardReport`.
message FetchFuelCardReportResponse {
  FuelCard fuel_card = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleFuelCardReport`.
message ScheduleFuelCardReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  ScheduleFuelCardReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleFuelCardReport`.
message ScheduleFuelCardReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamFuelCardMetrics`.
message StreamFuelCardMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFuelCardMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamFuelCardMetrics`.
message StreamFuelCardMetricsResponse {
  FuelCard fuel_card = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListFuelCardReports`.
message ListFuelCardReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFuelCardReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFuelCardReports`.
message ListFuelCardReportsResponse {
  repeated FuelCard fuel_cards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareFuelCardReport`.
message ShareFuelCardReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  ShareFuelCardReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareFuelCardReport`.
message ShareFuelCardReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  ShareFuelCardReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFuelCardTotals`.
message CountFuelCardTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelCardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFuelCardTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFuelCardTotals`.
message CountFuelCardTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteFuelCardReport`.
message DeleteFuelCardReportRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteFuelCardReport`.
message DeleteFuelCardReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
