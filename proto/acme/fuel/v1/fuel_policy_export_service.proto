syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelPolicyExportServiceProto";
option java_package = "com.acme.fuel.v1";

// Exports fuel policies to files and other systems.
service FuelPolicyExportService {
  // Streams every matching fuel policy.
  rpc StreamFuelPolicyExport(StreamFuelPolicyExportRequest) returns (stream StreamFuelPolicyExportResponse);

  // Returns a fuel policy.
  rpc GetFuelPolicyExport(GetFuelPolicyExportRequest) returns (GetFuelPolicyExportResponse);

  // Cancels a fuel policy.
  rpc CancelFuelPolicyExport(CancelFuelPolicyExportRequest) returns (CancelFuelPolicyExportResponse);

  // Lists fuel policies a page at a time.
  rpc ListFuelPolicyExports(ListFuelPolicyExportsRequest) returns (ListFuelPolicyExportsResponse);

  // Schedules a fuel policy.
  rpc ScheduleFuelPolicyExport(ScheduleFuelPolicyExportRequest) returns (ScheduleFuelPolicyExportResponse);

  // Retrys a fuel policy.
  rpc RetryFuelPolicyExport(RetryFuelPolicyExportRequest) returns (RetryFuelPolicyExportResponse);

  // Shares a fuel policy.
  rpc ShareFuelPolicyExport(ShareFuelPolicyExportRequest) returns (ShareFuelPolicyExportResponse);
}

// The request of `StreamFuelPolicyExport`.
message StreamFuelPolicyExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFuelPolicyExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamFuelPolicyExport`.
message StreamFuelPolicyExportResponse {
  FuelPolicy fuel_policy = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetFuelPolicyExport`.
message GetFuelPolicyExportRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFuelPolicyExport`.
message GetFuelPolicyExportResponse {
  FuelPolicy fuel_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelFuelPolicyExport`.
message CancelFuelPolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  CancelFuelPolicyExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelFuelPolicyExport`.
message CancelFuelPolicyExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  CancelFuelPolicyExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFuelPolicyExports`.
message ListFuelPolicyExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFuelPolicyExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFuelPolicyExports`.
message ListFuelPolicyExportsResponse {
  repeated FuelPolicy fuel_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleFuelPolicyExport`.
message ScheduleFuelPolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  ScheduleFuelPolicyExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleFuelPolicyExport`.
message ScheduleFuelPolicyExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryFuelPolicyExport`.
message RetryFuelPolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  FuelPolicy fuel_policy = 3;
  RetryFuelPolicyExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryFuelPolicyExport`.
message RetryFuelPolicyExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  RetryFuelPolicyExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareFuelPolicyExport`.
message ShareFuelPolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  ShareFuelPolicyExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareFuelPolicyExport`.
message ShareFuelPolicyExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  ShareFuelPolicyExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
