syntax = "proto3";

package acme.fuel.v1;

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.fuel.v1";

// A reference to a fuel card of the fuel domain.
message FuelCardRef {
  string fuel_card_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a fuel transaction of the fuel domain.
message FuelTransactionRef {
  string fuel_transaction_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a fuel policy of the fuel domain.
message FuelPolicyRef {
  string fuel_policy_id = 1;
  string display_name = 2;
  int64 version = 3;
}
