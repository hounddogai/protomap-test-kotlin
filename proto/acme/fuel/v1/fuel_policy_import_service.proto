syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelPolicyImportServiceProto";
option java_package = "com.acme.fuel.v1";

// Takes fuel policies in bulk from partners and legacy systems.
service FuelPolicyImportService {
  // Takes a stream of fuel policies and answers once at the end.
  rpc ImportFuelPolicies(stream ImportFuelPoliciesRequest) returns (ImportFuelPoliciesResponse);

  // Returns a fuel policy.
  rpc GetFuelPolicyImportStatus(GetFuelPolicyImportStatusRequest) returns (GetFuelPolicyImportStatusResponse);

  // Cancels a fuel policy.
  rpc CancelFuelPolicyImport(CancelFuelPolicyImportRequest) returns (CancelFuelPolicyImportResponse);

  // Validates a fuel policy.
  rpc ValidateFuelPolicyImport(ValidateFuelPolicyImportRequest) returns (ValidateFuelPolicyImportResponse);

  // Lists fuel policies a page at a time.
  rpc ListFuelPolicyImports(ListFuelPolicyImportsRequest) returns (ListFuelPolicyImportsResponse);

  // Retrys a fuel policy.
  rpc RetryFuelPolicyImport(RetryFuelPolicyImportRequest) returns (RetryFuelPolicyImportResponse);
}

// The request of `ImportFuelPolicies`.
message ImportFuelPoliciesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportFuelPoliciesRequest.StreamHeader header = 2;
    FuelPolicy record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportFuelPolicies`.
message ImportFuelPoliciesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string fuel_policy_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportFuelPoliciesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetFuelPolicyImportStatus`.
message GetFuelPolicyImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFuelPolicyImportStatus`.
message GetFuelPolicyImportStatusResponse {
  FuelPolicy fuel_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelFuelPolicyImport`.
message CancelFuelPolicyImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  CancelFuelPolicyImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelFuelPolicyImport`.
message CancelFuelPolicyImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  CancelFuelPolicyImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateFuelPolicyImport`.
message ValidateFuelPolicyImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  FuelPolicy fuel_policy = 3;
  ValidateFuelPolicyImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFuelPolicyImport`.
message ValidateFuelPolicyImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  ValidateFuelPolicyImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFuelPolicyImports`.
message ListFuelPolicyImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFuelPolicyImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFuelPolicyImports`.
message ListFuelPolicyImportsResponse {
  repeated FuelPolicy fuel_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryFuelPolicyImport`.
message RetryFuelPolicyImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  FuelPolicy fuel_policy = 3;
  RetryFuelPolicyImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryFuelPolicyImport`.
message RetryFuelPolicyImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  RetryFuelPolicyImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
