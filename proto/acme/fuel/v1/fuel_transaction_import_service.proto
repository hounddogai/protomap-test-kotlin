syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelTransactionImportServiceProto";
option java_package = "com.acme.fuel.v1";

// Takes fuel transactions in bulk from partners and legacy systems.
service FuelTransactionImportService {
  // Takes a stream of fuel transactions and answers once at the end.
  rpc ImportFuelTransactions(stream ImportFuelTransactionsRequest) returns (ImportFuelTransactionsResponse);

  // Returns a fuel transaction.
  rpc GetFuelTransactionImportStatus(GetFuelTransactionImportStatusRequest) returns (GetFuelTransactionImportStatusResponse);

  // Cancels a fuel transaction.
  rpc CancelFuelTransactionImport(CancelFuelTransactionImportRequest) returns (CancelFuelTransactionImportResponse);

  // Validates a fuel transaction.
  rpc ValidateFuelTransactionImport(ValidateFuelTransactionImportRequest) returns (ValidateFuelTransactionImportResponse);

  // Lists fuel transactions a page at a time.
  rpc ListFuelTransactionImports(ListFuelTransactionImportsRequest) returns (ListFuelTransactionImportsResponse);

  // Retrys a fuel transaction.
  rpc RetryFuelTransactionImport(RetryFuelTransactionImportRequest) returns (RetryFuelTransactionImportResponse);

  // Maps a fuel transaction.
  rpc MapFuelTransactionImportColumns(MapFuelTransactionImportColumnsRequest) returns (MapFuelTransactionImportColumnsResponse);
}

// The request of `ImportFuelTransactions`.
message ImportFuelTransactionsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportFuelTransactionsRequest.StreamHeader header = 2;
    FuelTransaction record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportFuelTransactions`.
message ImportFuelTransactionsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string fuel_transaction_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportFuelTransactionsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetFuelTransactionImportStatus`.
message GetFuelTransactionImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFuelTransactionImportStatus`.
message GetFuelTransactionImportStatusResponse {
  FuelTransaction fuel_transaction = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelFuelTransactionImport`.
message CancelFuelTransactionImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  CancelFuelTransactionImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelFuelTransactionImport`.
message CancelFuelTransactionImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  CancelFuelTransactionImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateFuelTransactionImport`.
message ValidateFuelTransactionImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  ValidateFuelTransactionImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFuelTransactionImport`.
message ValidateFuelTransactionImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  ValidateFuelTransactionImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFuelTransactionImports`.
message ListFuelTransactionImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelTransactionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFuelTransactionImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFuelTransactionImports`.
message ListFuelTransactionImportsResponse {
  repeated FuelTransaction fuel_transactions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryFuelTransactionImport`.
message RetryFuelTransactionImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  RetryFuelTransactionImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryFuelTransactionImport`.
message RetryFuelTransactionImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  RetryFuelTransactionImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapFuelTransactionImportColumns`.
message MapFuelTransactionImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  MapFuelTransactionImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapFuelTransactionImportColumns`.
message MapFuelTransactionImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  MapFuelTransactionImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
