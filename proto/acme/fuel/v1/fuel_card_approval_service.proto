syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelCardApprovalServiceProto";
option java_package = "com.acme.fuel.v1";

// Routes fuel cards through approval, with escalation and delegation.
service FuelCardApprovalService {
  // Submits a fuel card.
  rpc SubmitFuelCard(SubmitFuelCardRequest) returns (SubmitFuelCardResponse);

  // Approves a fuel card.
  rpc ApproveFuelCard(ApproveFuelCardRequest) returns (ApproveFuelCardResponse);

  // Rejects a fuel card.
  rpc RejectFuelCard(RejectFuelCardRequest) returns (RejectFuelCardResponse);

  // Lists fuel cards a page at a time.
  rpc ListPendingFuelCards(ListPendingFuelCardsRequest) returns (ListPendingFuelCardsResponse);

  // Delegates a fuel card.
  rpc DelegateFuelCardApproval(DelegateFuelCardApprovalRequest) returns (DelegateFuelCardApprovalResponse);

  // Recalls a fuel card.
  rpc RecallFuelCard(RecallFuelCardRequest) returns (RecallFuelCardResponse);

  // Returns a fuel card.
  rpc GetFuelCardApprovalStatus(GetFuelCardApprovalStatusRequest) returns (GetFuelCardApprovalStatusResponse);

  // Comments a fuel card.
  rpc CommentFuelCardApproval(CommentFuelCardApprovalRequest) returns (CommentFuelCardApprovalResponse);
}

// The request of `SubmitFuelCard`.
message SubmitFuelCardRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  FuelCard fuel_card = 3;
  SubmitFuelCardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFuelCard`.
message SubmitFuelCardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  SubmitFuelCardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

