syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelTransactionCalculationServiceProto";
option java_package = "com.acme.fuel.v1";

// Computes the figures of a fuel transaction, such as totals, taxes, and estimates.
service FuelTransactionCalculationService {
  // Calculates a fuel transaction.
  rpc CalculateFuelTransaction(CalculateFuelTransactionRequest) returns (CalculateFuelTransactionResponse);

  // Estimates a fuel transaction.
  rpc EstimateFuelTransaction(EstimateFuelTransactionRequest) returns (EstimateFuelTransactionResponse);

  // Quotes a fuel transaction.
  rpc QuoteFuelTransaction(QuoteFuelTransactionRequest) returns (QuoteFuelTransactionResponse);

  // Compares a fuel transaction.
  rpc CompareFuelTransactionOptions(CompareFuelTransactionOptionsRequest) returns (CompareFuelTransactionOptionsResponse);

  // Recalculates a fuel transaction.
  rpc RecalculateFuelTransactions(RecalculateFuelTransactionsRequest) returns (RecalculateFuelTransactionsResponse);

  // Simulates a fuel transaction.
  rpc SimulateFuelTransaction(SimulateFuelTransactionRequest) returns (SimulateFuelTransactionResponse);

  // Explains a fuel transaction.
  rpc ExplainFuelTransactionCalculation(ExplainFuelTransactionCalculationRequest) returns (ExplainFuelTransactionCalculationResponse);

  // Returns a fuel transaction.
  rpc GetFuelTransactionRates(GetFuelTransactionRatesRequest) returns (GetFuelTransactionRatesResponse);
}

// The request of `CalculateFuelTransaction`.
message CalculateFuelTransactionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  CalculateFuelTransactionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateFuelTransaction`.
message CalculateFuelTransactionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateFuelTransactionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  FuelTransaction fuel_transaction = 1;
  CalculateFuelTransactionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

