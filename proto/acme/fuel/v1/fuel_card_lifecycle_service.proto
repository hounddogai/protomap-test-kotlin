syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelCardLifecycleServiceProto";
option java_package = "com.acme.fuel.v1";

// Moves a fuel card between the states of its lifecycle.
service FuelCardLifecycleService {
  // Activates a fuel card.
  rpc ActivateFuelCard(ActivateFuelCardRequest) returns (ActivateFuelCardResponse);

  // Suspends a fuel card.
  rpc SuspendFuelCard(SuspendFuelCardRequest) returns (SuspendFuelCardResponse);

  // Reinstates a fuel card.
  rpc ReinstateFuelCard(ReinstateFuelCardRequest) returns (ReinstateFuelCardResponse);

  // Terminates a fuel card.
  rpc TerminateFuelCard(TerminateFuelCardRequest) returns (TerminateFuelCardResponse);

  // Renews a fuel card.
  rpc RenewFuelCard(RenewFuelCardRequest) returns (RenewFuelCardResponse);

  // Expires a fuel card.
  rpc ExpireFuelCard(ExpireFuelCardRequest) returns (ExpireFuelCardResponse);

  // Schedules a fuel card.
  rpc ScheduleFuelCardExpiry(ScheduleFuelCardExpiryRequest) returns (ScheduleFuelCardExpiryResponse);
}

// The request of `ActivateFuelCard`.
message ActivateFuelCardRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  ActivateFuelCardRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateFuelCard`.
message ActivateFuelCardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  ActivateFuelCardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

