syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelTransactionExportServiceProto";
option java_package = "com.acme.fuel.v1";

// Exports fuel transactions to files and other systems.
service FuelTransactionExportService {
  // Streams every matching fuel transaction.
  rpc StreamFuelTransactionExport(StreamFuelTransactionExportRequest) returns (stream StreamFuelTransactionExportResponse);

  // Returns a fuel transaction.
  rpc GetFuelTransactionExport(GetFuelTransactionExportRequest) returns (GetFuelTransactionExportResponse);

  // Cancels a fuel transaction.
  rpc CancelFuelTransactionExport(CancelFuelTransactionExportRequest) returns (CancelFuelTransactionExportResponse);

  // Lists fuel transactions a page at a time.
  rpc ListFuelTransactionExports(ListFuelTransactionExportsRequest) returns (ListFuelTransactionExportsResponse);

  // Schedules a fuel transaction.
  rpc ScheduleFuelTransactionExport(ScheduleFuelTransactionExportRequest) returns (ScheduleFuelTransactionExportResponse);

  // Retrys a fuel transaction.
  rpc RetryFuelTransactionExport(RetryFuelTransactionExportRequest) returns (RetryFuelTransactionExportResponse);

  // Shares a fuel transaction.
  rpc ShareFuelTransactionExport(ShareFuelTransactionExportRequest) returns (ShareFuelTransactionExportResponse);
}

// The request of `StreamFuelTransactionExport`.
message StreamFuelTransactionExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelTransactionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFuelTransactionExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamFuelTransactionExport`.
message StreamFuelTransactionExportResponse {
  FuelTransaction fuel_transaction = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetFuelTransactionExport`.
message GetFuelTransactionExportRequest {
  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFuelTransactionExport`.
message GetFuelTransactionExportResponse {
  FuelTransaction fuel_transaction = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelFuelTransactionExport`.
message CancelFuelTransactionExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  CancelFuelTransactionExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelFuelTransactionExport`.
message CancelFuelTransactionExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  CancelFuelTransactionExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFuelTransactionExports`.
message ListFuelTransactionExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FuelTransactionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFuelTransactionExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFuelTransactionExports`.
message ListFuelTransactionExportsResponse {
  repeated FuelTransaction fuel_transactions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleFuelTransactionExport`.
message ScheduleFuelTransactionExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  ScheduleFuelTransactionExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleFuelTransactionExport`.
message ScheduleFuelTransactionExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryFuelTransactionExport`.
message RetryFuelTransactionExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  FuelTransaction fuel_transaction = 3;
  RetryFuelTransactionExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryFuelTransactionExport`.
message RetryFuelTransactionExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  RetryFuelTransactionExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareFuelTransactionExport`.
message ShareFuelTransactionExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_transaction_id = 2;
  ShareFuelTransactionExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareFuelTransactionExport`.
message ShareFuelTransactionExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelTransaction fuel_transaction = 1;
  ShareFuelTransactionExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
