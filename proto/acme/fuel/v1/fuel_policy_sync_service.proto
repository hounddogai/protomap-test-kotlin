syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelPolicySyncServiceProto";
option java_package = "com.acme.fuel.v1";

// Keeps fuel policies in step with the systems of record in other regions.
service FuelPolicySyncService {
  // Syncs a fuel policy.
  rpc SyncFuelPolicies(SyncFuelPoliciesRequest) returns (SyncFuelPoliciesResponse);

  // Pushs a fuel policy.
  rpc PushFuelPolicy(PushFuelPolicyRequest) returns (PushFuelPolicyResponse);

  // Pulls a fuel policy.
  rpc PullFuelPolicies(PullFuelPoliciesRequest) returns (PullFuelPoliciesResponse);

  // Reconciles a fuel policy.
  rpc ReconcileFuelPolicies(ReconcileFuelPoliciesRequest) returns (ReconcileFuelPoliciesResponse);

  // Exchanges changes of fuel policies with a peer.
  rpc StreamFuelPolicyChanges(stream StreamFuelPolicyChangesRequest) returns (stream StreamFuelPolicyChangesResponse);

  // Resolves a fuel policy.
  rpc ResolveFuelPolicyConflict(ResolveFuelPolicyConflictRequest) returns (ResolveFuelPolicyConflictResponse);

  // Returns a fuel policy.
  rpc GetFuelPolicySyncState(GetFuelPolicySyncStateRequest) returns (GetFuelPolicySyncStateResponse);

  // Lists fuel policies a page at a time.
  rpc ListFuelPolicyConflicts(ListFuelPolicyConflictsRequest) returns (ListFuelPolicyConflictsResponse);
}

// The request of `SyncFuelPolicies`.
message SyncFuelPoliciesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_policy_id = 2;
  FuelPolicy fuel_policy = 3;
  SyncFuelPoliciesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncFuelPolicies`.
message SyncFuelPoliciesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelPolicy fuel_policy = 1;
  SyncFuelPoliciesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushFuelPolicy`.
message PushFuelPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
