syntax = "proto3";

package acme.fuel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fuel/v1/fuel.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fuel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fuel/v1;fuelv1";
option java_multiple_files = true;
option java_outer_classname = "FuelCardWorkflowServiceProto";
option java_package = "com.acme.fuel.v1";

// Runs the long-lived workflow that takes a fuel card from start to finish.
service FuelCardWorkflowService {
  // Starts a fuel card.
  rpc StartFuelCardWorkflow(StartFuelCardWorkflowRequest) returns (StartFuelCardWorkflowResponse);

  // Advances a fuel card.
  rpc AdvanceFuelCardWorkflow(AdvanceFuelCardWorkflowRequest) returns (AdvanceFuelCardWorkflowResponse);

  // Cancels a fuel card.
  rpc CancelFuelCardWorkflow(CancelFuelCardWorkflowRequest) returns (CancelFuelCardWorkflowResponse);

  // Pauses a fuel card.
  rpc PauseFuelCardWorkflow(PauseFuelCardWorkflowRequest) returns (PauseFuelCardWorkflowResponse);

  // Resumes a fuel card.
  rpc ResumeFuelCardWorkflow(ResumeFuelCardWorkflowRequest) returns (ResumeFuelCardWorkflowResponse);

  // Returns a fuel card.
  rpc InspectFuelCardWorkflow(InspectFuelCardWorkflowRequest) returns (InspectFuelCardWorkflowResponse);

  // Lists fuel cards a page at a time.
  rpc ListFuelCardWorkflows(ListFuelCardWorkflowsRequest) returns (ListFuelCardWorkflowsResponse);

  // Signals a fuel card.
  rpc SignalFuelCardWorkflow(SignalFuelCardWorkflowRequest) returns (SignalFuelCardWorkflowResponse);
}

// The request of `StartFuelCardWorkflow`.
message StartFuelCardWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fuel_card_id = 2;
  FuelCard fuel_card = 3;
  StartFuelCardWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFuelCardWorkflow`.
message StartFuelCardWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FuelCard fuel_card = 1;
  StartFuelCardWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

