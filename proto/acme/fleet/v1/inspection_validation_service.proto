syntax = "proto3";

package acme.fleet.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fleet/v1/fleet.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fleet.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fleet/v1;fleetv1";
option java_multiple_files = true;
option java_outer_classname = "InspectionValidationServiceProto";
option java_package = "com.acme.fleet.v1";

// Checks inspections against the rules before anything acts on them.
service InspectionValidationService {
  // Validates an inspection.
  rpc ValidateInspection(ValidateInspectionRequest) returns (ValidateInspectionResponse);

  // Previews an inspection.
  rpc PreviewInspection(PreviewInspectionRequest) returns (PreviewInspectionResponse);

  // Checks an inspection.
  rpc CheckInspectionEligibility(CheckInspectionEligibilityRequest) returns (CheckInspectionEligibilityResponse);

  // Normalizes an inspection.
  rpc NormalizeInspection(NormalizeInspectionRequest) returns (NormalizeInspectionResponse);

  // Scores an inspection.
  rpc ScoreInspection(ScoreInspectionRequest) returns (ScoreInspectionResponse);

  // Returns an inspection.
  rpc GetInspectionRules(GetInspectionRulesRequest) returns (GetInspectionRulesResponse);
}

// The request of `ValidateInspection`.
message ValidateInspectionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string inspection_id = 2;
  Inspection inspection = 3;
  ValidateInspectionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateInspection`.
message ValidateInspectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Inspection inspection = 1;
  ValidateInspectionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewInspection`.
message PreviewInspectionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string inspection_id = 2;
  Inspection inspection = 3;
  PreviewInspectionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PreviewInspection`.
message PreviewInspectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Inspection inspection = 1;
  PreviewInspectionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CheckInspectionEligibility`.
message CheckInspectionEligibilityRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string inspection_id = 2;
  Inspection inspection = 3;
  CheckInspectionEligibilityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CheckInspectionEligibility`.
message CheckInspectionEligibilityResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Inspection inspection = 1;
  CheckInspectionEligibilityResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NormalizeInspection`.
message NormalizeInspectionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string inspection_id = 2;
  Inspection inspection = 3;
  NormalizeInspectionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `NormalizeInspection`.
message NormalizeInspectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
