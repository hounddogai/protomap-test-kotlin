option csharp_namespace = "Acme.Fleet.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fleet/v1;fleetv1";
option java_multiple_files = true;
option java_outer_classname = "VehicleGroupWorkflowServiceProto";
option java_package = "com.acme.fleet.v1";

// Runs the long-lived workflow that takes a vehicle group from start to finish.
service VehicleGroupWorkflowService {
  // Starts a vehicle group.
  rpc StartVehicleGroupWorkflow(StartVehicleGroupWorkflowRequest) returns (StartVehicleGroupWorkflowResponse);

  // Advances a vehicle group.
  rpc AdvanceVehicleGroupWorkflow(AdvanceVehicleGroupWorkflowRequest) returns (AdvanceVehicleGroupWorkflowResponse);

  // Retrys a vehicle group.
  rpc RetryVehicleGroupWorkflow(RetryVehicleGroupWorkflowRequest) returns (RetryVehicleGroupWorkflowResponse);

  // Pauses a vehicle group.
  rpc PauseVehicleGroupWorkflow(PauseVehicleGroupWorkflowRequest) returns (PauseVehicleGroupWorkflowResponse);

  // Resumes a vehicle group.
  rpc ResumeVehicleGroupWorkflow(ResumeVehicleGroupWorkflowRequest) returns (ResumeVehicleGroupWorkflowResponse);

  // Returns a vehicle group.
  rpc InspectVehicleGroupWorkflow(InspectVehicleGroupWorkflowRequest) returns (InspectVehicleGroupWorkflowResponse);

  // Lists vehicle groups a page at a time.
  rpc ListVehicleGroupWorkflows(ListVehicleGroupWorkflowsRequest) returns (ListVehicleGroupWorkflowsResponse);

  // Signals a vehicle group.
  rpc SignalVehicleGroupWorkflow(SignalVehicleGroupWorkflowRequest) returns (SignalVehicleGroupWorkflowResponse);
}

// The request of `StartVehicleGroupWorkflow`.
message StartVehicleGroupWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string vehicle_group_id = 2;
  VehicleGroup vehicle_group = 3;
  StartVehicleGroupWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartVehicleGroupWorkflow`.
message StartVehicleGroupWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VehicleGroup vehicle_group = 1;
  StartVehicleGroupWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

