syntax = "proto3";

package acme.fleet.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/fleet/v1/fleet.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fleet.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fleet/v1;fleetv1";
option java_multiple_files = true;
option java_outer_classname = "VehicleValidationServiceProto";
option java_package = "com.acme.fleet.v1";

// Checks vehicles against the rules before anything acts on them.
service VehicleValidationService {
  // Validates a vehicle.
  rpc ValidateVehicle(ValidateVehicleRequest) returns (ValidateVehicleResponse);

  // Previews a vehicle.
  rpc PreviewVehicle(PreviewVehicleRequest) returns (PreviewVehicleResponse);

  // Checks a vehicle.
  rpc CheckVehicleEligibility(CheckVehicleEligibilityRequest) returns (CheckVehicleEligibilityResponse);

  // Normalizes a vehicle.
  rpc NormalizeVehicle(NormalizeVehicleRequest) returns (NormalizeVehicleResponse);

  // Explains a vehicle.
  rpc ExplainVehicleDecision(ExplainVehicleDecisionRequest) returns (ExplainVehicleDecisionResponse);

  // Scores a vehicle.
  rpc ScoreVehicle(ScoreVehicleRequest) returns (ScoreVehicleResponse);

  // Lints a vehicle.
  rpc LintVehicles(LintVehiclesRequest) returns (LintVehiclesResponse);

  // Returns a vehicle.
  rpc GetVehicleRules(GetVehicleRulesRequest) returns (GetVehicleRulesResponse);
}

// The request of `ValidateVehicle`.
message ValidateVehicleRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string vehicle_id = 2;
  Vehicle vehicle = 3;
  ValidateVehicleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateVehicle`.
message ValidateVehicleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Vehicle vehicle = 1;
  ValidateVehicleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

