syntax = "proto3";

package acme.fleet.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fleet/v1/fleet.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fleet.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fleet/v1;fleetv1";
option java_multiple_files = true;
option java_outer_classname = "VehicleGroupApprovalServiceProto";
option java_package = "com.acme.fleet.v1";

// Routes vehicle groups through approval, with escalation and delegation.
service VehicleGroupApprovalService {
  // Submits a vehicle group.
  rpc SubmitVehicleGroup(SubmitVehicleGroupRequest) returns (SubmitVehicleGroupResponse);

  // Approves a vehicle group.
  rpc ApproveVehicleGroup(ApproveVehicleGroupRequest) returns (ApproveVehicleGroupResponse);

  // Rejects a vehicle group.
  rpc RejectVehicleGroup(RejectVehicleGroupRequest) returns (RejectVehicleGroupResponse);

  // Escalates a vehicle group.
  rpc EscalateVehicleGroup(EscalateVehicleGroupRequest) returns (EscalateVehicleGroupResponse);

  // Lists vehicle groups a page at a time.
  rpc ListPendingVehicleGroups(ListPendingVehicleGroupsRequest) returns (ListPendingVehicleGroupsResponse);

  // Delegates a vehicle group.
  rpc DelegateVehicleGroupApproval(DelegateVehicleGroupApprovalRequest) returns (DelegateVehicleGroupApprovalResponse);

  // Recalls a vehicle group.
  rpc RecallVehicleGroup(RecallVehicleGroupRequest) returns (RecallVehicleGroupResponse);

  // Returns a vehicle group.
  rpc GetVehicleGroupApprovalStatus(GetVehicleGroupApprovalStatusRequest) returns (GetVehicleGroupApprovalStatusResponse);

  // Comments a vehicle group.
  rpc CommentVehicleGroupApproval(CommentVehicleGroupApprovalRequest) returns (CommentVehicleGroupApprovalResponse);
}

// The request of `SubmitVehicleGroup`.
message SubmitVehicleGroupRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string vehicle_group_id = 2;
  VehicleGroup vehicle_group = 3;
  SubmitVehicleGroupRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitVehicleGroup`.
message SubmitVehicleGroupResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VehicleGroup vehicle_group = 1;
  SubmitVehicleGroupResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

