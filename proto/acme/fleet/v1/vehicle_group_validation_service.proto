syntax = "proto3";

package acme.fleet.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fleet/v1/fleet.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fleet.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fleet/v1;fleetv1";
option java_multiple_files = true;
option java_outer_classname = "VehicleGroupValidationServiceProto";
option java_package = "com.acme.fleet.v1";

// Checks vehicle groups against the rules before anything acts on them.
service VehicleGroupValidationService {
  // Validates a vehicle group.
  rpc ValidateVehicleGroup(ValidateVehicleGroupRequest) returns (ValidateVehicleGroupResponse);

  // Previews a vehicle group.
  rpc PreviewVehicleGroup(PreviewVehicleGroupRequest) returns (PreviewVehicleGroupResponse);

  // Checks a vehicle group.
  rpc CheckVehicleGroupEligibility(CheckVehicleGroupEligibilityRequest) returns (CheckVehicleGroupEligibilityResponse);

  // Explains a vehicle group.
  rpc ExplainVehicleGroupDecision(ExplainVehicleGroupDecisionRequest) returns (ExplainVehicleGroupDecisionResponse);

  // Lints a vehicle group.
  rpc LintVehicleGroups(LintVehicleGroupsRequest) returns (LintVehicleGroupsResponse);

  // Returns a vehicle group.
  rpc GetVehicleGroupRules(GetVehicleGroupRulesRequest) returns (GetVehicleGroupRulesResponse);
}

// The request of `ValidateVehicleGroup`.
message ValidateVehicleGroupRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string vehicle_group_id = 2;
  VehicleGroup vehicle_group = 3;
  ValidateVehicleGroupRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateVehicleGroup`.
message ValidateVehicleGroupResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VehicleGroup vehicle_group = 1;
  ValidateVehicleGroupResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

