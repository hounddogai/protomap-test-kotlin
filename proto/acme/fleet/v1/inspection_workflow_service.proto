syntax = "proto3";

package acme.fleet.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/fleet/v1/fleet.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fleet.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fleet/v1;fleetv1";
option java_multiple_files = true;
option java_outer_classname = "InspectionWorkflowServiceProto";
option java_package = "com.acme.fleet.v1";

// Runs the long-lived workflow that takes an inspection from start to finish.
service InspectionWorkflowService {
  // Starts an inspection.
  rpc StartInspectionWorkflow(StartInspectionWorkflowRequest) returns (StartInspectionWorkflowResponse);

  // Advances an inspection.
  rpc AdvanceInspectionWorkflow(AdvanceInspectionWorkflowRequest) returns (AdvanceInspectionWorkflowResponse);

  // Cancels an inspection.
  rpc CancelInspectionWorkflow(CancelInspectionWorkflowRequest) returns (CancelInspectionWorkflowResponse);

  // Retrys an inspection.
  rpc RetryInspectionWorkflow(RetryInspectionWorkflowRequest) returns (RetryInspectionWorkflowResponse);

  // Resumes an inspection.
  rpc ResumeInspectionWorkflow(ResumeInspectionWorkflowRequest) returns (ResumeInspectionWorkflowResponse);

  // Returns an inspection.
  rpc InspectInspectionWorkflow(InspectInspectionWorkflowRequest) returns (InspectInspectionWorkflowResponse);
}

// The request of `StartInspectionWorkflow`.
message StartInspectionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string inspection_id = 2;
  Inspection inspection = 3;
  StartInspectionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartInspectionWorkflow`.
message StartInspectionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Inspection inspection = 1;
  StartInspectionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

