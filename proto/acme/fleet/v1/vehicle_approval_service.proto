syntax = "proto3";

package acme.fleet.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fleet/v1/fleet.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fleet.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fleet/v1;fleetv1";
option java_multiple_files = true;
option java_outer_classname = "VehicleApprovalServiceProto";
option java_package = "com.acme.fleet.v1";

// Routes vehicles through approval, with escalation and delegation.
service VehicleApprovalService {
  // Submits a vehicle.
  rpc SubmitVehicle(SubmitVehicleRequest) returns (SubmitVehicleResponse);

  // Approves a vehicle.
  rpc ApproveVehicle(ApproveVehicleRequest) returns (ApproveVehicleResponse);

  // Rejects a vehicle.
  rpc RejectVehicle(RejectVehicleRequest) returns (RejectVehicleResponse);

  // Escalates a vehicle.
  rpc EscalateVehicle(EscalateVehicleRequest) returns (EscalateVehicleResponse);

  // Lists vehicles a page at a time.
  rpc ListPendingVehicles(ListPendingVehiclesRequest) returns (ListPendingVehiclesResponse);

  // Delegates a vehicle.
  rpc DelegateVehicleApproval(DelegateVehicleApprovalRequest) returns (DelegateVehicleApprovalResponse);

  // Recalls a vehicle.
  rpc RecallVehicle(RecallVehicleRequest) returns (RecallVehicleResponse);

  // Returns a vehicle.
  rpc GetVehicleApprovalStatus(GetVehicleApprovalStatusRequest) returns (GetVehicleApprovalStatusResponse);

  // Comments a vehicle.
  rpc CommentVehicleApproval(CommentVehicleApprovalRequest) returns (CommentVehicleApprovalResponse);
}

// The request of `SubmitVehicle`.
message SubmitVehicleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string vehicle_id = 2;
  Vehicle vehicle = 3;
  SubmitVehicleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitVehicle`.
message SubmitVehicleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Vehicle vehicle = 1;
  SubmitVehicleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

